유형이 아닙니다."]},{"id":"3-1-06","s":3,"c":1,"t":"요약변수와 파생변수","k":"B","lv":2,"pg":5,"ref":"Q1-6","m":1,"n":23,"q":"파생변수에 대한 설명으로 옳은 것은?","o":["원 데이터를 분석 목적에 맞게 단순 집계한 변수이다.","여러 분석 모형에 공통으로 쓸 수 있어 재활용성이 가장 높다.","사용자가 특정 조건이나 함수로 의미를 부여한 변수라 주관적일 수 있으므로 논리적 타당성을 갖춰야 한다.","기간별 구매 금액, 구매 횟수가 대표적인 예이다."],"a":3,"e":"①, ②, ④는 모두 요약변수의 설명입니다. 두 변수의 특징을 맞바꿔 내는 것이 이 파트의 고정 패턴입니다.","x":["요약변수에 대한 설명입니다. 원 데이터를 분석 목적에 맞게 종합·집계한 변수가 요약변수입니다.","요약변수에 대한 설명입니다. 요약변수는 여러 모델에 공통으로 쓸 수 있어 재활용성이 높습니다.","파생변수는 사용자가 특정 조건이나 함수로 의미를 부여해 만든 변수라 주관적일 수 있으므로 논리적 타당성을 갖춰야 합니다.","요약변수의 예입니다. '주 구매 매장', '구매 상품 다양성'처럼 조건으로 의미를 부여한 값이 파생변수입니다."]},{"id":"3-1-07","s":3,"c":1,"t":"EDA의 4가지 주제","k":"EDA","lv":2,"pg":5,"m":3,"n":23,"q":"탐색적 자료 분석(EDA)의 4가지 주제에 해당하지 않는 것은?","o":["가설 검정(hypothesis testing)","저항성(resistance)","자료 재표현(re-expression)","현시성(revelation)"],"a":1,"e":"EDA의 4가지 주제는 저항성, 잔차 해석, 자료 재표현, 현시성(그래프로 드러내기)입니다. 가설 검정은 정해 둔 가설을 확인하는 확증적 분석에 해당합니다.","x":["EDA의 주제가 아닙니다. 가설 검정은 미리 세운 가설을 확인하는 확증적 자료 분석(CDA)의 방법입니다.","EDA의 주제입니다. 일부 자료가 잘못되거나 이상값이 있어도 결과가 크게 흔들리지 않는 성질로, 평균 대신 중앙값을 쓰는 것이 예입니다.","EDA의 주제입니다. 로그 변환처럼 자료를 다른 척도로 바꿔 분석과 해석을 쉽게 만드는 것입니다.","EDA의 주제입니다. 그래프와 그림으로 자료의 특징을 눈에 보이게 드러내는 것입니다."]},{"id":"3-1-08","s":3,"c":1,"t":"이상값 처리","k":"E","lv":5,"pg":4,"m":2,"n":23,"q":"이상값에 대한 설명으로 옳지 않은 것은?","o":["상자그림에서 Q1 − 1.5 × IQR보다 작거나 Q3 + 1.5 × IQR보다 큰 값을 이상값으로 본다.","이상값은 분석 결과를 왜곡하므로 발견하면 항상 제거해야 한다.","평균 ± 3 × 표준편차를 벗어나는 값을 이상값으로 보는 방법을 ESD라고 한다.","부정 거래 탐지처럼 이상값 자체가 분석의 목적이 되기도 한다."],"a":2,"e":"이상값은 입력 실수인지, 실제로 드문 값인지 먼저 확인한 뒤 제거·대체·유지를 정합니다. 부정 사용 탐지에서는 이상값이 곧 찾으려는 대상입니다.","x":["맞는 설명입니다. 상자그림은 Q1 − 1.5 × IQR, Q3 + 1.5 × IQR을 경계로 그 밖의 값을 이상값으로 봅니다.","틀린 설명입니다. 입력 실수인지 실제로 드문 값인지 먼저 확인한 뒤 제거·대체·유지를 정해야 합니다. 의미 있는 이상값을 지우면 중요한 정보를 잃습니다.","맞는 설명입니다. 평균에서 표준편차의 3배 넘게 떨어진 값을 이상값으로 보는 방법이 ESD입니다.","맞는 설명입니다. 부정 사용 탐지에서는 이상값이 곧 찾으려는 대상입니다."]},{"id":"3-2-12","s":3,"c":2,"t":"검정 방법 고르기","k":"K","lv":5,"pg":10,"ref":"Q2-12","m":3,"n":24,"q":"같은 선수 20명의 훈련 프로그램 참가 전과 후의 체력 점수 평균을 비교하려고 한다. 가장 적절한 검정은? (정규성 만족)","o":["독립표본 t검정","대응표본 t검정","카이제곱 독립성 검정","일원분산분석"],"a":2,"e":"같은 대상을 두 번 잰 전·후 비교라 대응표본 t검정입니다. 서로 다른 두 집단이면 독립표본 t검정, 세 집단 이상이면 분산분석입니다.","x":["독립표본 t검정은 서로 다른 두 집단(예: A팀과 B팀)의 평균을 비교할 때 씁니다.","같은 선수를 전·후로 두 번 잰 짝지어진 자료라 대응표본 t검정이 맞습니다.","카이제곱 독립성 검정은 두 범주형 변수가 서로 관련 있는지 볼 때 씁니다. 평균 비교가 아닙니다.","일원분산분석은 세 집단 이상의 평균을 비교할 때 씁니다."]},{"id":"3-2-14","s":3,"c":2,"t":"분산분석 출력","k":"K","lv":5,"pg":10,"ref":"Q2-14","m":2,"n":24,"q":"세 가지 훈련 프로그램(group)에 따른 체력 점수를 비교한 일원분산분석 결과이다. 해석으로 옳지 않은 것은?","pre":"> summary(aov(score ~ group, data = club))\n            Df Sum Sq Mean Sq F value  Pr(>F)\ngroup        2  180.0   90.00   6.234 0.00594 **\nResiduals   27  389.8   14.44","o":["비교한 프로그램(집단)은 3개이다.","유의수준 0.05에서 세 집단의 평균이 모두 같다는 귀무가설을 기각한다.","전체 관측치는 30개이다.","세 프로그램의 평균이 모두 서로 다르다는 것이 확인되었다."],"a":4,"e":"자유도 2 = 집단 수 − 1이라 3개, 27 = 전체 − 집단 수라 30개입니다. p-value가 0.00594라 귀무가설은 기각하지만, 그 뜻은 적어도 한 집단이 다르다는 것뿐입니다. 어느 집단끼리 다른지는 사후검정으로 확인합니다.","x":["맞는 해석입니다. group의 자유도 2 = 집단 수 − 1이므로 집단은 3개입니다.","맞는 해석입니다. p-value 0.00594 &lt; 0.05이므로 '세 집단 평균이 모두 같다'는 귀무가설을 기각합니다.","맞는 해석입니다. 잔차 자유도 27 = 전체 관측치 − 집단 수이므로 27 + 3 = 30개입니다.","틀린 해석입니다. 귀무가설을 기각하면 '적어도 한 집단의 평균이 다르다'는 것까지만 알 수 있고, 어느 집단끼리 다른지는 사후검정으로 확인합니다."]},{"id":"3-2-19","s":3,"c":2,"t":"비모수 검정","k":"M","lv":2,"pg":12,"ref":"Q2-19","m":1,"n":24,"q":"다음 중 비모수 검정에 해당하지 않는 것은?","o":["독립표본 t검정","부호검정","윌콕슨 부호순위검정","크루스칼-왈리스 검정"],"a":1,"e":"t검정은 정규분포를 가정하는 모수 검정입니다. 독립표본 t검정의 비모수 짝은 만-위트니 U검정입니다.","x":["t검정은 모집단이 정규분포를 따른다고 가정하는 모수 검정입니다. 독립표본 t검정에 대응하는 비모수 검정은 만-위트니 U검정(윌콕슨 순위합 검정)입니다.","비모수 검정입니다. 차이의 부호(+, −)만 써서 중앙값을 검정합니다.","비모수 검정입니다. 대응표본 t검정에 대응하며, 차이의 부호와 크기 순위를 함께 씁니다.","비모수 검정입니다. 세 집단 이상을 비교하는 일원분산분석에 대응합니다."]},{"id":"3-2-02","s":3,"c":2,"t":"표본오차와 비표본오차","k":"F","lv":4,"pg":7,"ref":"Q2-2","m":3,"n":25,"q":"표본조사의 오차에 대한 설명으로 옳지 않은 것은?","o":["표본오차는 모집단의 일부만 조사하기 때문에 생긴다.","표본 크기를 늘리면 표본오차는 줄어든다.","비표본오차는 표본 크기를 늘리면 반드시 줄어든다.","표본편의는 확률화(무작위 추출)로 줄일 수 있다."],"a":3,"e":"비표본오차는 조사 과정의 실수에서 생기므로 표본을 늘려도 줄지 않고, 조사 규모가 커지면 오히려 커질 수 있습니다.","x":["맞는 설명입니다. 표본오차는 모집단 전체가 아니라 일부(표본)만 조사해서 생기는 오차입니다.","맞는 설명입니다. 표본이 커질수록 표본오차는 줄어듭니다.","틀린 설명입니다. 비표본오차는 응답 오류, 입력 실수처럼 조사 과정의 실수에서 생기므로 표본을 늘려도 줄지 않고 오히려 커질 수 있습니다.","맞는 설명입니다. 표본편의는 표본을 무작위로 뽑는 확률화로 최소화할 수 있습니다."]},{"id":"3-2-13","s":3,"c":2,"t":"대응표본 t검정 출력","k":"K","lv":5,"pg":10,"ref":"Q2-13","m":1,"n":25,"q":"선수 20명의 훈련 전(before)과 후(after) 체력 점수를 비교한 결과이다. 해석으로 옳지 않은 것은?","pre":"> t.test(after, before, paired = TRUE)\n\n        Paired t-test\n\ndata:  after and before\nt = 2.8622, df = 19, p-value = 0.00997\nalternative hypothesis: true mean difference is not equal to 0\n95 percent confidence interval:\n 0.860 5.540\nsample estimates:\nmean difference\n            3.2","o":["같은 선수를 두 번 측정한 자료라 대응표본 t검정을 썼다.","훈련 후 점수가 평균 3.2점 높다.","95% 신뢰구간에 0이 포함되므로 차이가 유의하지 않다.","유의수준 0.05에서 전후 평균에 차이가 없다는 귀무가설을 기각한다."],"a":3,"e":"신뢰구간 0.86~5.54에는 0이 없습니다. p-value 0.00997 &lt; 0.05와 같은 결론으로, 훈련 전후 평균 차이는 유의합니다.","x":["맞는 해석입니다. paired = TRUE로 같은 선수의 전후 차이를 본 대응표본 t검정입니다.","맞는 해석입니다. after − before 순서로 계산한 mean difference가 3.2이므로 훈련 후가 평균 3.2점 높습니다.","틀린 해석입니다. 95% 신뢰구간 0.86~5.54에는 0이 없으므로 차이는 유의합니다.","맞는 해석입니다. p-value 0.00997 &lt; 0.05이므로 귀무가설을 기각합니다."]},{"id":"3-2-17","s":3,"c":2,"t":"상관계수와 단위 변환","k":"L","lv":5,"pg":11,"ref":"Q2-17","m":2,"n":25,"q":"선수들의 키(cm)와 몸무게(kg)의 상관계수가 0.6이다. 키를 m 단위로 바꾸고 모든 몸무게에 2kg씩 더한 뒤 다시 구한 상관계수는?","o":["0.006","0.6","0.62","−0.6"],"a":2,"e":"양수를 곱하거나 상수를 더하는 변환은 상관계수를 바꾸지 않습니다. 단위의 영향을 받는 것은 공분산입니다.","x":["키를 m로 바꾸면(100으로 나누면) 공분산은 1/100이 되지만, 상관계수는 표준편차로 나눠 단위를 없앤 값이라 변하지 않습니다.","양수를 곱하거나 나누고 상수를 더하는 변환은 상관계수를 바꾸지 않으므로 0.6 그대로입니다.","모든 몸무게에 2kg을 더해도 점들이 통째로 옮겨질 뿐 관계는 그대로라 상관계수는 변하지 않습니다.","부호는 음수를 곱할 때만 바뀝니다. 여기서는 양수(1/100)를 곱했으므로 부호가 그대로입니다."]},{"id":"3-2-03","s":3,"c":2,"t":"척도 구분","k":"G","lv":4,"pg":7,"ref":"Q2-3","m":2,"n":26,"q":"다음 중 비율척도에 해당하는 것은?","o":["섭씨온도","만족도 순위","선수 등번호","월 운동 시간"],"a":4,"e":"운동 시간은 0시간이 '없음'이고 2배, 3배 비교가 가능하므로 비율척도입니다. 섭씨온도는 0℃가 '온도 없음'이 아니라서 구간척도, 순위는 서열, 등번호는 명목척도입니다.","x":["구간척도입니다. 0℃가 '온도가 없음'을 뜻하지 않아 20℃가 10℃보다 2배 덥다고 말할 수 없습니다.","서열척도입니다. 순서는 있지만 1위와 2위의 간격이 2위와 3위의 간격과 같다고 볼 수 없습니다.","명목척도입니다. 등번호는 선수를 구별하는 이름표일 뿐 크기나 순서의 의미가 없습니다.","0시간이 '운동하지 않음'을 뜻하는 절대 0점이 있고 2배, 3배 비교가 가능하므로 비율척도입니다."]},{"id":"3-2-04","s":3,"c":2,"t":"왜도와 대표값","k":"H","lv":3,"pg":8,"ref":"Q2-4","m":3,"n":26,"q":"오른쪽으로 꼬리가 긴(양의 왜도) 분포에서 대표값의 크기 관계로 옳은 것은?","o":["평균 &lt; 중앙값 &lt; 최빈값","최빈값 &lt; 중앙값 &lt; 평균","중앙값 &lt; 평균 &lt; 최빈값","세 값이 모두 같다"],"a":2,"e":"오른쪽 꼬리의 큰 값들이 평균을 오른쪽으로 끌어당깁니다. 왼쪽 꼬리가 길면 순서가 정반대(①)이고, 좌우 대칭이면 ④입니다.","x":["왼쪽으로 꼬리가 긴(음의 왜도) 분포의 순서입니다.","오른쪽 꼬리의 큰 값들이 평균을 오른쪽으로 끌어당겨 최빈값 &lt; 중앙값 &lt; 평균 순서가 됩니다.","교재에서 다루는 치우친 분포의 순서가 아닙니다. 봉우리가 하나인 분포가 한쪽으로 치우치면 보통 중앙값이 평균과 최빈값 사이에 놓입니다.","세 값이 같은 것은 정규분포처럼 봉우리가 하나인 좌우 대칭 분포일 때입니다."]},{"id":"3-2-16","s":3,"c":2,"t":"상관분석 R 출력","k":"L","lv":5,"pg":11,"ref":"Q2-16","m":1,"n":26,"q":"선수 30명의 주당 훈련 시간(train)과 체력 점수(score)에 대한 상관분석 결과이다. 해석으로 옳지 않은 것은?","pre":"> cor.test(train, score)\n\n        Pearson's product-moment correlation\n\ndata:  train and score\nt = 4.0735, df = 28, p-value = 0.000345\nalternative hypothesis: true correlation is not equal to 0\n95 percent confidence interval:\n 0.3201 0.7955\nsample estimates:\n cor\n0.61","o":["두 변수의 표본 상관계수는 0.61이다.","유의수준 0.05에서 \"모상관계수는 0이다\"라는 귀무가설을 기각한다.","훈련 시간이 늘면 체력 점수가 오른다는 인과관계가 증명되었다.","모상관계수의 95% 신뢰구간에 0이 포함되지 않는다."],"a":3,"e":"상관분석은 함께 움직이는 정도만 보여줄 뿐 원인과 결과를 증명하지 않습니다. p-value 0.000345 &lt; 0.05라 상관이 유의하고, 신뢰구간 0.32~0.80에도 0이 없습니다.","x":["맞는 해석입니다. sample estimates의 cor 값이 0.61입니다.","맞는 해석입니다. p-value 0.000345 &lt; 0.05이므로 '모상관계수는 0이다'라는 귀무가설을 기각합니다.","틀린 해석입니다. 상관분석은 두 변수가 함께 움직이는 정도만 보여 줄 뿐, 원인과 결과를 증명하지 않습니다.","맞는 해석입니다. 95% 신뢰구간 0.32~0.80에 0이 포함되지 않습니다."]},{"id":"3-2-07","s":3,"c":2,"t":"조건부확률과 독립","k":"I","lv":3,"pg":8,"ref":"Q2-7","m":3,"n":27,"q":"P(A) = 0.4, P(B) = 0.5이고 두 사건 A와 B가 서로 독립일 때, P(A∩B)와 P(A|B)를 순서대로 고른 것은?","o":["0.2, 0.4","0.9, 0.4","0.2, 0.5","0.1, 0.2"],"a":1,"e":"독립이면 P(A∩B) = 0.4 × 0.5 = 0.2이고, P(A|B) = 0.2 ÷ 0.5 = 0.4로 P(A)와 같습니다. B가 일어났는지가 A의 확률을 바꾸지 않는다는 것이 독립의 뜻입니다.","x":["독립이면 P(A∩B) = P(A)P(B) = 0.2이고, P(A|B) = 0.2 ÷ 0.5 = 0.4로 P(A)와 같습니다.","0.9는 두 확률을 더한 값입니다. 독립인 두 사건이 함께 일어날 확률은 곱해서 구합니다.","P(A∩B)는 맞지만 P(A|B)를 P(B)로 착각했습니다. P(A|B) = P(A∩B) ÷ P(B) = 0.4입니다.","P(A∩B)를 0.1로 잘못 계산했습니다. 0.4 × 0.5 = 0.2이고, 그러면 P(A|B) = 0.4입니다."]},{"id":"3-2-09","s":3,"c":2,"t":"신뢰구간 해석","k":"J","lv":3,"pg":9,"ref":"Q2-9","m":2,"n":27,"q":"표본평균이 72점이고 모평균의 95% 신뢰구간이 (68, 76)으로 계산되었다. 설명으로 옳은 것은?","o":["같은 방법으로 신뢰구간을 여러 번 구하면 그중 약 95%가 모평균을 포함한다.","표본 크기를 늘리면 같은 신뢰수준에서 구간이 넓어진다.","신뢰수준을 99%로 높이면 구간이 좁아진다.","표본평균이 68과 76 사이에 있을 확률이 95%이다."],"a":1,"e":"신뢰구간은 모르는 <b>모평균<\/b>을 잡기 위한 범위입니다. 표본이 커지면 좁아지고, 신뢰수준을 높이면 넓어집니다. 표본평균은 이미 72로 정해진 값이라 ④는 틀립니다.","x":["맞는 설명입니다. 95% 신뢰구간은 같은 방법으로 여러 번 구하면 그중 약 95%가 모평균을 포함한다는 뜻입니다.","틀린 설명입니다. 표본 크기를 늘리면 표준오차가 작아져 구간이 좁아집니다.","틀린 설명입니다. 신뢰수준을 높이면 더 확실하게 모평균을 포함해야 하므로 구간이 넓어집니다.","틀린 설명입니다. 표본평균은 이미 72로 정해진 값이라 확률을 말할 대상이 아닙니다. 신뢰구간은 모평균을 잡기 위한 범위입니다."]},{"id":"3-2-20","s":3,"c":2,"t":"계통추출","k":"F","lv":4,"pg":7,"m":1,"n":27,"q":"회원 명부 1,000명에 번호를 매기고 1~10번 중 하나를 무작위로 고른 뒤, 그 번호부터 10번째마다 회원을 뽑았다. 이 표본추출 방법은?","o":["단순랜덤추출","계통추출","층화추출","군집추출"],"a":2,"e":"첫 번호만 무작위로 정하고 일정한 간격(k번째)으로 뽑는 방법이 계통추출입니다. 명부에 주기성이 있으면 표본이 한쪽으로 치우칠 수 있다는 점이 단점입니다.","x":["단순랜덤추출은 명단 전체에서 매번 무작위로 뽑는 방법입니다. 여기서는 첫 번호만 무작위로 정했습니다.","첫 번호만 무작위로 정하고 일정한 간격(10번째)마다 뽑았으므로 계통추출입니다.","층화추출은 집단을 나눈 뒤 각 집단에서 뽑는 방법입니다.","군집추출은 집단 몇 개를 골라 그 집단을 통째로 조사하는 방법입니다."]},{"id":"3-2-01","s":3,"c":2,"t":"표본추출","k":"F","lv":4,"pg":7,"ref":"Q2-1","m":2,"n":28,"q":"전국 대학생 만족도 조사를 위해 학생을 학년(1~4학년)으로 나눈 뒤, 각 학년에서 50명씩 무작위로 뽑았다. 이 표본추출 방법은?","o":["단순랜덤추출","계통추출","층화추출","군집추출"],"a":3,"e":"집단을 나눈 뒤 <b>모든 집단에서<\/b> 뽑았으므로 층화추출입니다. 학년 몇 개만 골라 그 학년 전원을 조사했다면 군집추출입니다.","x":["단순랜덤추출은 집단을 나누지 않고 전체 명단에서 무작위로 뽑는 방법입니다. 여기서는 학년으로 먼저 나눴습니다.","계통추출은 번호를 매긴 뒤 일정한 간격(k번째)마다 뽑는 방법입니다.","학년이라는 기준으로 나눈 뒤 모든 학년에서 일정 수를 무작위로 뽑았으므로 층화추출입니다.","군집추출은 집단 몇 개를 무작위로 골라 그 집단 전체를 조사하는 방법입니다. 여기서는 모든 학년에서 뽑았습니다."]},{"id":"3-2-08","s":3,"c":2,"t":"확률분포 구분","k":"I","lv":3,"pg":8,"ref":"Q2-8","m":1,"n":28,"q":"다음 중 이산형 확률분포가 아닌 것은?","o":["이항분포","포아송분포","기하분포","지수분포"],"a":4,"e":"지수분포는 사건 사이의 대기 시간처럼 연속적인 값을 다루는 연속형 분포입니다. 기하분포(첫 성공까지의 시행 횟수)는 이산형이라 헷갈리기 쉽습니다.","x":["이산형입니다. n번 시행 중 성공한 횟수(0, 1, 2, …)를 다룹니다.","이산형입니다. 일정한 시간이나 공간에서 사건이 일어난 횟수를 다룹니다.","이산형입니다. 첫 성공까지 걸린 시행 횟수를 다룹니다.","지수분포는 사건 사이의 대기 시간처럼 연속적인 값을 다루는 연속형 분포입니다."]},{"id":"3-2-15","s":3,"c":2,"t":"카이제곱 검정 고르기","k":"K","lv":5,"pg":10,"ref":"Q2-15","m":3,"n":28,"q":"한 대학의 학생 200명을 조사해 성별과 선호 종목(축구, 농구, 배구)이 서로 관련이 있는지 알아보려고 한다. 가장 적절한 검정은?","o":["적합도 검정","독립성 검정","동질성 검정","대응표본 t검정"],"a":2,"e":"한 모집단에서 뽑은 표본으로 두 범주형 변수의 관련성을 보면 독립성 검정입니다. 남학생 100명, 여학생 100명처럼 집단을 먼저 나눠 뽑고 선호 분포가 같은지 보면 동질성 검정입니다.","x":["적합도 검정은 한 범주형 변수의 분포가 기대한 분포(예: 1:1:1)와 맞는지 볼 때 씁니다. 변수가 하나뿐입니다.","한 모집단에서 뽑은 표본으로 두 범주형 변수(성별, 선호 종목)가 서로 관련 있는지 보므로 독립성 검정입니다.","동질성 검정은 남학생 100명, 여학생 100명처럼 집단을 먼저 나눠 뽑은 뒤 집단별 분포가 같은지 볼 때 씁니다.","대응표본 t검정은 같은 대상을 두 번 잰 연속형 자료의 평균을 비교할 때 씁니다."]},{"id":"3-2-10","s":3,"c":2,"t":"p-value 해석","k":"K","lv":5,"pg":9,"ref":"Q2-10","m":1,"n":29,"q":"유의수준 0.05에서 가설검정을 한 결과 p-value가 0.03이었다. 해석으로 옳은 것은?","o":["귀무가설을 채택한다.","귀무가설을 기각한다.","대립가설이 참일 확률이 97%이다.","1종 오류가 발생할 확률이 97%이다."],"a":2,"e":"0.03 &lt; 0.05이므로 귀무가설을 기각합니다. p-value는 \"가설이 참일 확률\"이 아니므로 ③처럼 해석하면 틀립니다.","x":["p-value(0.03)가 유의수준(0.05)보다 작으면 귀무가설을 채택하지 않고 기각합니다.","p-value 0.03 &lt; 유의수준 0.05이므로 귀무가설을 기각합니다.","틀린 해석입니다. p-value는 귀무가설이 참이라고 할 때 지금 결과와 같거나 그보다 더 극단적인 결과가 나올 확률이지, 대립가설이 참일 확률이 아닙니다.","틀린 해석입니다. 1종 오류를 범할 확률은 유의수준 0.05로 미리 정해 둔 값이고, 97%와는 관계가 없습니다."]},{"id":"3-2-11","s":3,"c":2,"t":"1종·2종 오류","k":"K","lv":5,"pg":9,"ref":"Q2-11","m":2,"n":29,"q":"실제로는 신약의 효과가 없는데, 검정 결과 \"효과가 있다\"고 결론 내렸다. 이 오류는?","o":["1종 오류","2종 오류","검정력","신뢰수준"],"a":1,"e":"귀무가설(효과 없음)이 참인데 기각했으므로 1종 오류입니다. 효과가 있는데 \"없다\"고 했다면 2종 오류입니다.","x":["귀무가설(효과 없음)이 참인데 기각하고 '효과가 있다'고 했으므로 1종 오류입니다.","2종 오류는 반대로 효과가 있는데(대립가설이 참인데) 귀무가설을 기각하지 못하고 '효과가 없다'고 한 경우입니다.","검정력은 대립가설이 참일 때 귀무가설을 올바르게 기각할 확률(1 − β)로, 오류의 이름이 아닙니다.","신뢰수준(1 − α)은 귀무가설이 참일 때 이를 올바르게 채택할 확률로, 오류의 이름이 아닙니다."]},{"id":"3-2-18","s":3,"c":2,"t":"스피어만 상관계수","k":"L","lv":5,"pg":11,"ref":"Q2-18","m":3,"n":29,"q":"스피어만 상관계수를 쓰기에 가장 적절한 경우는?","o":["두 변수 모두 정규분포를 따르는 연속형이고 직선 관계를 보려 할 때","두 변수가 순위(서열척도)이거나, 한쪽이 커지면 다른 쪽도 커지지만 직선은 아닌 관계일 때","두 변수가 모두 명목척도일 때","범주형 변수에 따라 연속형 변수의 평균이 다른지 볼 때"],"a":2,"e":"스피어만은 값을 순위로 바꿔 계산하므로 서열 자료나, 직선이 아니어도 한 방향으로 함께 움직이는 단조 관계에 씁니다. ①은 피어슨, ③은 카이제곱 독립성 검정, ④는 t검정이나 분산분석의 상황입니다.","x":["피어슨 상관계수를 쓰는 상황입니다.","스피어만은 값을 순위로 바꿔 계산하므로 서열 자료나, 직선은 아니어도 한쪽이 커질 때 다른 쪽이 일관되게 커지거나 작아지는 단조 관계에 씁니다.","두 명목형 변수의 관련성은 카이제곱 독립성 검정으로 봅니다.","범주에 따라 연속형 변수의 평균이 다른지는 t검정이나 분산분석으로 봅니다."]},{"id":"3-2-05","s":3,"c":2,"t":"기댓값 계산","k":"I","lv":3,"pg":8,"ref":"Q2-5","m":1,"n":30,"q":"확률변수 X가 0, 1, 2를 각각 확률 0.2, 0.5, 0.3으로 가질 때, E(X)와 E(2X + 3)을 순서대로 고른 것은?","o":["1.1, 5.2","1.1, 2.2","1.0, 5.0","1.2, 5.4"],"a":1,"e":"E(X) = 0×0.2 + 1×0.5 + 2×0.3 = 1.1입니다. 기댓값은 선형이라 E(2X + 3) = 2×1.1 + 3 = 5.2입니다. ②는 상수 3을 빠뜨린 값입니다.","x":["E(X) = 0×0.2 + 1×0.5 + 2×0.3 = 1.1이고, E(2X + 3) = 2 × 1.1 + 3 = 5.2입니다.","E(X)는 맞지만 E(2X + 3)에서 상수 3을 빠뜨렸습니다.","E(X)를 잘못 계산했습니다. 0.5 + 0.6 = 1.1이고, 그래서 E(2X + 3)도 5.0이 아니라 5.2입니다.","E(X)를 1.2로 잘못 계산한 값입니다. 정확히는 1.1이고, 그러면 E(2X + 3) = 5.2입니다."]},{"id":"3-2-06","s":3,"c":2,"t":"분산의 성질","k":"I","lv":3,"pg":8,"ref":"Q2-6","m":2,"n":30,"q":"확률변수 X의 분산이 4일 때, Var(3X + 2)는?","o":["12","14","36","38"],"a":3,"e":"Var(aX + b) = a²Var(X)이므로 3² × 4 = 36입니다. 더한 상수 2는 퍼짐에 영향을 주지 않고, a를 제곱하지 않으면 ①이 됩니다.","x":["a를 제곱하지 않고 3 × 4로 계산한 값입니다. Var(aX + b) = a²Var(X)입니다.","a를 제곱하지 않고(3 × 4 = 12) 상수 2까지 더한 값입니다. 상수는 분산에 영향을 주지 않습니다.","Var(aX + b) = a²Var(X)이므로 3² × 4 = 36입니다. 더한 상수 2는 퍼짐에 영향을 주지 않습니다.","36에 상수 2를 더한 값입니다. 모든 값에 똑같이 더한 상수는 분산을 바꾸지 않습니다."]},{"id":"3-2-21","s":3,"c":2,"t":"표본 크기와 신뢰구간","k":"J","lv":3,"pg":9,"m":3,"n":30,"q":"다른 조건은 그대로 두고 표본 크기를 4배로 늘리면, 모평균에 대한 95% 신뢰구간의 폭은 어떻게 되는가?","o":["4배가 된다.","2배가 된다.","1/2로 줄어든다.","1/4로 줄어든다."],"a":3,"e":"신뢰구간의 폭은 표준오차 σ/√n에 비례합니다. n이 4배가 되면 √n은 2배가 되므로 폭은 1/2로 줄어듭니다. 1/4로 착각하게 만드는 선지가 함정입니다.","x":["표본이 커지면 구간은 넓어지는 것이 아니라 좁아집니다.","표본이 커지면 구간은 좁아집니다. 방향이 반대입니다.","구간 폭은 σ/√n에 비례하므로 n이 4배면 √n이 2배가 되어 폭은 1/2이 됩니다.","폭은 n이 아니라 √n에 반비례합니다. n이 4배면 폭은 1/√4 = 1/2이 됩니다."]},{"id":"3-3-05","s":3,"c":3,"t":"MSE 계산","k":"O","lv":3,"pg":15,"ref":"Q3-5","m":1,"n":31,"q":"관측치 12개로 단순회귀분석을 했더니 잔차제곱합(SSE)이 40이었다. 오차분산의 추정량(MSE)은?","o":["2.00","3.33","3.64","4.00"],"a":4,"e":"단순회귀의 잔차 자유도는 n − 2 = 10이라 MSE = 40 ÷ 10 = 4입니다. ②는 n으로, ③은 n − 1로 나눈 값이고, ①은 잔차표준오차 √4입니다.","x":["MSE의 제곱근 √4 = 2로, 잔차표준오차입니다.","n(12)으로 나눈 값(40 ÷ 12)입니다. 단순회귀의 잔차 자유도는 n − 2입니다.","n − 1(11)로 나눈 값(40 ÷ 11)입니다. 절편과 기울기 2개를 추정했으므로 n − 2로 나눠야 합니다.","단순회귀의 잔차 자유도는 n − 2 = 10이므로 MSE = 40 ÷ 10 = 4입니다."]},{"id":"3-3-09","s":3,"c":3,"t":"정규화 회귀","k":"R","lv":3,"pg":16,"ref":"Q3-9","m":3,"n":31,"q":"회귀계수를 정확히 0으로 만들 수 있어 변수 선택 효과가 있는 방법은?","o":["릿지 회귀","라쏘 회귀","로지스틱 회귀","다항 회귀"],"a":2,"e":"라쏘는 계수의 절댓값 합(L1)에 벌점을 줘서 일부 계수를 0으로 만듭니다. 릿지(L2)는 0 가까이 줄일 뿐 0이 되지는 않습니다.","x":["릿지는 계수 제곱합(L2)에 벌점을 줘 계수를 0 가까이 줄이지만, 정확히 0으로 만들지는 않습니다.","라쏘는 계수 절댓값 합(L1)에 벌점을 줘 일부 계수를 정확히 0으로 만들므로 변수 선택 효과가 있습니다.","로지스틱 회귀는 이진 범주형 종속변수를 예측하는 방법으로, 계수에 벌점을 주는 정규화 방법이 아닙니다.","다항 회귀는 X², X³ 같은 항을 넣어 곡선 관계를 표현하는 방법입니다."]},{"id":"3-3-12","s":3,"c":3,"t":"로지스틱 회귀의 특징","k":"S","lv":5,"pg":17,"ref":"Q3-12","m":2,"n":31,"q":"로지스틱 회귀에 대한 설명으로 옳은 것은?","o":["로짓(logit) 연결함수를 쓰며, 종속변수가 이진 범주형일 때 사용한다.","종속변수가 연속형일 때 쓰며 최소제곱법으로 추정한다.","예측값이 −∞부터 +∞까지의 실수로 나와 그대로 확률로 쓴다.","R에서는 <code>lm()<\/code> 함수로 적합한다."],"a":1,"e":"로지스틱 회귀는 최대우도법으로 추정하고, 예측 확률은 0~1 사이로 나옵니다. R에서는 <code>glm(family = binomial)<\/code>을 씁니다.","x":["맞는 설명입니다. 종속변수가 이진 범주형일 때 로짓 연결함수로 성공 확률을 모형화합니다.","틀린 설명입니다. 연속형 종속변수에 최소제곱법을 쓰는 것은 선형회귀이고, 로지스틱 회귀는 최대우도법으로 추정합니다.","틀린 설명입니다. 선형식 값(로그 오즈)은 −∞~+∞이지만, 이를 시그모이드 함수로 바꾼 예측 확률은 0~1 사이로 나옵니다.","틀린 설명입니다. <code>lm()<\/code>은 선형회귀 함수이고, 로지스틱 회귀는 <code>glm(family = binomial)<\/code>으로 적합합니다."]},{"id":"3-3-01","s":3,"c":3,"t":"회귀 R 출력 해석","k":"N","lv":5,"pg":14,"ref":"Q3-1","m":3,"n":32,"q":"프로야구 50경기의 관중 수(attend, 천 명)를 티켓 가격(price, 천 원)과 홍보 이벤트 횟수(promo)로 설명한 회귀분석 결과이다. 해석으로 옳지 않은 것은?","pre":"Coefficients:\n            Estimate Std. Error t value Pr(>|t|)\n(Intercept)  18.4000     2.3000   8.000 2.55e-10 ***\nprice        -0.8500     0.2100  -4.048 0.000192 ***\npromo         0.4200     0.3500   1.200 0.236153\n---\nResidual standard error: 2.85 on 47 degrees of freedom\nMultiple R-squared:  0.41,  Adjusted R-squared:  0.3849\nF-statistic: 16.33 on 2 and 47 DF,  p-value: 4.12e-06","o":["다른 변수가 같을 때 티켓 가격이 1천 원 오르면 관중 수는 평균 약 850명 줄어든다.","유의수준 0.05에서 promo는 관중 수에 유의한 영향을 준다고 할 수 없다.","이 모형은 관중 수 변동의 약 41%를 설명한다.","F검정의 p-value가 0.05보다 작으므로 모든 회귀계수가 유의하다."],"a":4,"e":"F검정이 유의하다는 것은 \"절편을 뺀 회귀계수 중 적어도 하나는 0이 아니다\"라는 뜻일 뿐입니다. 실제로 promo는 p-value 0.236으로 유의하지 않습니다. ①은 −0.85(천 명) = 850명 감소로 옳습니다.","x":["맞는 해석입니다. price 계수 −0.85(천 명)는 다른 변수가 같을 때 가격이 1천 원 오르면 관중이 평균 850명 줄어든다는 뜻입니다.","맞는 해석입니다. promo의 p-value가 0.236으로 0.05보다 커서 유의하다고 할 수 없습니다.","맞는 해석입니다. Multiple R-squared가 0.41이므로 관중 수 변동의 약 41%를 설명합니다.","틀린 해석입니다. F검정이 유의하다는 것은 '절편을 뺀 회귀계수 중 적어도 하나는 0이 아니다'라는 뜻일 뿐이고, 실제로 promo는 유의하지 않습니다."]},{"id":"3-3-02","s":3,"c":3,"t":"자유도와 표본 수","k":"N","lv":5,"pg":14,"ref":"Q3-2","m":1,"n":32,"q":"독립변수가 3개인 다중회귀분석에서 잔차의 자유도가 46으로 출력되었다. 표본(관측치)의 수는?","o":["46","49","50","53"],"a":3,"e":"잔차 자유도 = n − (독립변수 수) − 1이므로 46 = n − 3 − 1, n = 50입니다. 상수항 몫의 1을 빼먹으면 ②를 고르게 됩니다.","x":["잔차 자유도를 그대로 표본 수로 읽은 값입니다. n = 46이면 잔차 자유도는 46 − 3 − 1 = 42가 됩니다.","상수항 몫의 1을 빼먹고 46 + 3으로 계산한 값입니다. n = 49면 잔차 자유도는 45가 됩니다.","잔차 자유도 = n − (독립변수 수) − 1이므로 46 = n − 3 − 1, n = 50입니다.","n = 53이면 잔차 자유도는 53 − 3 − 1 = 49가 되어 46과 맞지 않습니다."]},{"id":"3-3-03","s":3,"c":3,"t":"더미변수 해석","k":"N","lv":5,"pg":15,"ref":"Q3-3","m":2,"n":32,"q":"프로축구 선수 40명의 연봉(salary, 천만 원)을 경력(career, 년)과 포지션(pos: GK, FW, MF)으로 설명한 회귀분석 결과이다. 기준 범주는 GK로 지정했다. 해석으로 옳은 것은?","pre":"> kleague$pos <- relevel(factor(kleague$pos), ref = \"GK\")\n> summary(lm(salary ~ career + pos, data = kleague))\nCoefficients:\n            Estimate Std. Error t value Pr(>|t|)\n(Intercept)   5.2000     1.1000   4.727 3.45e-05 ***\ncareer        1.2000     0.2500   4.800 2.76e-05 ***\nposFW         3.4000     1.1000   3.091  0.00384 **\nposMF         1.1000     1.0500   1.048  0.30180","o":["포지션 범주가 3개이므로 더미변수 3개가 모형에 들어갔다.","posMF가 유의하지 않으므로 MF 선수의 연봉은 0으로 예측된다.","경력이 같을 때 MF의 연봉은 GK의 1.1배이다.","경력이 같을 때 FW의 연봉은 GK보다 평균 3,400만 원 높다."],"a":4,"e":"범주 3개라 더미는 posFW, posMF 2개입니다. 계수 3.4(천만 원)는 기준 범주 GK와의 평균 차이이고, 배수가 아닙니다. posMF의 p-value 0.302는 MF와 GK의 차이가 유의하지 않다는 뜻일 뿐입니다.","x":["틀린 해석입니다. 범주가 3개면 기준 범주(GK)를 뺀 2개(posFW, posMF)만 더미변수로 들어갑니다.","틀린 해석입니다. posMF가 유의하지 않다는 것은 MF와 GK의 연봉 차이가 유의하지 않다는 뜻일 뿐, 연봉이 0이라는 뜻이 아닙니다.","틀린 해석입니다. 계수 1.1은 GK와의 차이(1.1천만 원 = 1,100만 원 더 많음)이지 배수가 아닙니다.","맞는 해석입니다. posFW 계수 3.4(천만 원)는 경력이 같을 때 FW가 기준 범주 GK보다 평균 3,400만 원 높다는 뜻입니다."]},{"id":"3-3-04","s":3,"c":3,"t":"결정계수 계산","k":"O","lv":3,"pg":15,"ref":"Q3-4","m":3,"n":33,"q":"회귀분석 결과 총제곱합(SST)이 200, 잔차제곱합(SSE)이 50이었다. 결정계수는?","o":["0.25","0.50","0.75","4.00"],"a":3,"e":"R² = 1 − SSE/SST = 1 − 50/200 = 0.75입니다. ①은 SSE/SST를 그대로 쓴 값이라 자주 고르는 오답입니다.","x":["SSE/SST(= 50/200)를 그대로 쓴 값입니다. 이것은 모형이 설명하지 못한 비율입니다.","식에 맞지 않는 값입니다. R² = 1 − SSE/SST = 1 − 0.25 = 0.75입니다.","R² = 1 − SSE/SST = 1 − 50/200 = 0.75입니다.","SST/SSE(= 200/50)를 계산한 값입니다. 결정계수는 0과 1 사이의 값입니다."]},{"id":"3-3-08","s":3,"c":3,"t":"다중공선성","k":"R","lv":3,"pg":16,"ref":"Q3-8","m":2,"n":33,"q":"다중공선성에 대한 설명으로 옳지 않은 것은?","o":["다중공선성이 있으면 결정계수가 반드시 낮아진다.","독립변수들 사이의 상관관계가 높을 때 발생한다.","분산팽창요인(VIF)이 10 이상이면 다중공선성을 의심한다.","해결 방법으로 변수 제거, 주성분분석, 릿지 회귀 등이 있다."],"a":1,"e":"오히려 R²는 높게 나오는데 개별 계수가 유의하지 않은 것이 대표적인 증상입니다. \"반드시\"처럼 단정하는 표현은 틀린 선지일 때가 많습니다.","x":["틀린 설명입니다. 다중공선성이 있어도 R²는 높게 나올 수 있고, 오히려 R²는 높은데 개별 계수가 유의하지 않은 것이 대표적인 증상입니다.","맞는 설명입니다. 독립변수들끼리 상관이 높으면 각 변수의 효과를 따로 떼어 추정하기 어려워집니다.","맞는 설명입니다. VIF가 10 이상이면 다중공선성이 심각하다고 봅니다.","맞는 설명입니다. 상관이 높은 변수를 빼거나, 주성분분석으로 변수를 묶거나, 릿지 회귀로 계수를 안정시키는 방법이 있습니다."]},{"id":"3-3-10","s":3,"c":3,"t":"변수선택법","k":"Q","lv":2,"pg":17,"ref":"Q3-10","m":1,"n":33,"q":"모든 독립변수를 포함한 모형에서 시작해, 기여도가 가장 작은 변수를 하나씩 제거해 나가는 방법은?","o":["전진선택법","후진제거법","단계적선택법","라쏘 회귀"],"a":2,"e":"전부 넣고 빼 나가면 후진제거법, 0개에서 더해 가면 전진선택법입니다. 라쏘는 벌점으로 계수를 0으로 만드는 정규화 방법이라 결이 다릅니다.","x":["전진선택법은 변수가 없는 모형에서 시작해 기여도가 큰 변수를 하나씩 추가합니다.","모든 변수를 넣고 시작해 기여도가 가장 작은 변수를 하나씩 빼는 방법이 후진제거법입니다.","단계적선택법은 변수를 추가하면서 이미 들어간 변수 중 기여도가 낮아진 것은 다시 빼는 방법으로, 추가와 제거를 함께 합니다.","라쏘는 벌점으로 계수를 0으로 만드는 정규화 방법으로, 변수를 하나씩 빼는 절차가 아닙니다."]},{"id":"3-3-06","s":3,"c":3,"t":"잔차 그림 진단","k":"P","lv":3,"pg":16,"ref":"Q3-6","m":2,"n":34,"q":"회귀분석 후 그린 잔차 vs 적합값 그림에서, 적합값이 커질수록 잔차가 깔때기처럼 넓게 퍼져 있었다. 위배가 의심되는 가정은?","o":["선형성","독립성","등분산성","정규성"],"a":3,"e":"잔차의 퍼짐(분산)이 일정하지 않으므로 등분산성 위배입니다. 잔차가 곡선 패턴을 그리면 선형성, Q-Q plot이 직선에서 벗어나면 정규성을 의심합니다.","x":["선형성 위배는 잔차가 U자 같은 곡선 패턴을 그릴 때 의심합니다.","독립성 위배는 잔차가 시간 순서에 따라 연달아 비슷한 값을 보일 때(자기상관) 의심하며, 더빈-왓슨 검정으로 확인합니다.","적합값에 따라 잔차의 퍼짐이 커지는 깔때기 모양은 분산이 일정하지 않다는 뜻이라 등분산성 위배입니다.","정규성은 Q-Q plot의 점들이 직선에서 벗어나는지, 샤피로-윌크 검정 결과로 확인합니다."]},{"id":"3-3-07","s":3,"c":3,"t":"더빈-왓슨 검정","k":"P","lv":3,"pg":16,"ref":"Q3-7","m":3,"n":34,"q":"더빈-왓슨(Durbin-Watson) 검정으로 확인하는 것은?","o":["잔차의 정규성","잔차의 자기상관(독립성)","독립변수 간 다중공선성","영향점의 존재"],"a":2,"e":"더빈-왓슨 통계량은 0~4 사이 값으로 2 근처면 잔차의 자기상관이 없다고 봅니다. 정규성은 샤피로-윌크, 다중공선성은 VIF로 봅니다.","x":["잔차의 정규성은 Q-Q plot이나 샤피로-윌크 검정으로 확인합니다.","더빈-왓슨 검정은 잔차의 자기상관(독립성)을 확인합니다. 통계량이 2 근처면 자기상관이 없다고 봅니다.","다중공선성은 분산팽창요인(VIF)으로 확인합니다.","영향점은 Cook's distance, 레버리지 같은 지표로 확인합니다."]},{"id":"3-3-11","s":3,"c":3,"t":"로지스틱 오즈비","k":"S","lv":5,"pg":17,"ref":"Q3-11","m":1,"n":34,"q":"로지스틱 회귀모형에서 변수 X의 회귀계수가 0.693으로 추정되었다(exp(0.693) ≈ 2). 옳은 해석은?","o":["X가 1 증가하면 성공 확률이 0.693 증가한다.","X가 1 증가하면 성공 확률이 2배가 된다.","X가 1 증가하면 성공의 오즈가 약 2배가 된다.","X가 1 증가하면 실패의 오즈가 약 2배가 된다."],"a":3,"e":"계수 β는 로그 오즈의 증가량이고, exp(β)는 오즈가 몇 배가 되는지를 뜻합니다. \"확률\"로 바꿔 쓴 ①, ②가 대표적인 함정입니다.","x":["계수 0.693은 확률이 아니라 로그 오즈의 증가량입니다.","exp(0.693) ≈ 2는 오즈가 2배가 된다는 뜻입니다. 확률이 2배가 되는 것은 아닙니다.","exp(β) ≈ 2이므로 X가 1 증가하면 성공의 오즈(성공 확률 ÷ 실패 확률)가 약 2배가 됩니다.","계수가 양수이므로 성공의 오즈가 커집니다. 실패의 오즈는 성공 오즈의 역수라 오히려 약 1/2이 됩니다."]},{"id":"3-4-06","s":3,"c":4,"t":"주성분분석 R 출력","k":"W","lv":5,"pg":20,"ref":"Q4-6","m":2,"n":35,"q":"다음은 R 내장 데이터 USArrests로 주성분분석을 한 결과이다. 누적 기여율 80% 이상을 기준으로 선택할 주성분 개수와, 제1주성분이 설명하는 분산 비율을 순서대로 고른 것은?","pre":"> summary(prcomp(USArrests, scale. = TRUE))\nImportance of components:\n                          PC1    PC2     PC3     PC4\nStandard deviation     1.5749 0.9949 0.59713 0.41645\nProportion of Variance 0.6201 0.2474 0.08914 0.04336\nCumulative Proportion  0.6201 0.8675 0.95664 1.00000","o":["1개, 62.0%","2개, 62.0%","2개, 86.8%","3개, 95.7%"],"a":2,"e":"PC1만으로는 62.0%라 부족하고, PC2까지 더하면 86.8%로 80%를 넘습니다. 제1주성분의 설명 비율은 Proportion 행의 0.6201입니다. ③은 누적값과 개별값을 섞은 오답입니다.","x":["PC1만으로는 누적 기여율이 62.0%라 80%에 못 미칩니다.","PC2까지의 누적 기여율이 86.8%로 처음 80%를 넘으므로 2개를 고르고, 제1주성분의 설명 비율은 Proportion of Variance의 0.6201(62.0%)입니다.","개수는 맞지만 86.8%는 PC1과 PC2를 합친 누적 비율입니다. 제1주성분 혼자 설명하는 비율은 62.0%입니다.","PC2까지 이미 86.8%로 80%를 넘었으므로 PC3까지 고를 필요가 없습니다."]},{"id":"3-4-07","s":3,"c":4,"t":"주성분분석의 특징","k":"W","lv":5,"pg":20,"ref":"Q4-7","m":3,"n":35,"q":"주성분분석에 대한 설명으로 옳지 않은 것은?","o":["상관이 높은 여러 변수를 적은 수의 주성분으로 요약한다.","제1주성분은 데이터의 분산을 가장 많이 설명한다.","단위가 서로 다른 변수는 표준화한 뒤 분석한다.","주성분들은 서로 상관관계가 높도록 만들어진다."],"a":4,"e":"주성분끼리는 서로 직교해서 상관이 0입니다. 그래서 다중공선성 문제를 피하는 용도로도 씁니다.","x":["맞는 설명입니다. 상관이 높은 여러 변수를 정보 손실을 줄이면서 적은 수의 주성분으로 요약합니다.","맞는 설명입니다. 제1주성분은 데이터의 분산을 가장 많이 설명하는 방향입니다.","맞는 설명입니다. 단위가 다르면 값이 큰 변수가 결과를 좌우하므로 표준화(상관행렬 사용)한 뒤 분석합니다.","틀린 설명입니다. 주성분들은 서로 직교해 상관이 0이 되도록 만들어집니다. 그래서 다중공선성을 피하는 용도로도 씁니다."]},{"id":"3-4-09","s":3,"c":4,"t":"지수평활법","k":"V","lv":5,"pg":19,"m":1,"n":35,"q":"최근 관측값일수록 더 큰 가중치를 주고, 과거로 갈수록 가중치를 지수적으로 줄여 가며 미래 값을 예측하는 방법은?","o":["단순 이동평균법","지수평활법","분해 시계열","차분"],"a":2,"e":"지수평활법은 모든 관측값을 쓰되 최근 값에 더 큰 가중치를 줍니다. 단순 이동평균법은 정해진 기간의 값에 같은 가중치를 주는 방법입니다.","x":["단순 이동평균법은 정해진 기간의 값들에 같은 가중치를 줘 평균을 냅니다.","최근 값일수록 큰 가중치를 주고 과거로 갈수록 가중치를 지수적으로 줄이는 방법이 지수평활법입니다.","분해 시계열은 시계열을 추세, 계절, 순환, 불규칙 요인으로 나누어 보는 방법입니다.","차분은 현재 값에서 이전 값을 빼 평균의 변화(추세)를 없애는 정상화 방법입니다."]},{"id":"3-4-01","s":3,"c":4,"t":"정상성 조건","k":"T","lv":5,"pg":19,"ref":"Q4-1","m":1,"n":36,"q":"정상 시계열에 대한 설명으로 옳지 않은 것은?","o":["평균이 모든 시점에서 일정하다.","분산이 시점에 의존하지 않는다.","공분산은 시차뿐 아니라 실제 시점에도 의존한다.","평균이 일정하지 않은 시계열은 차분으로 정상화할 수 있다."],"a":3,"e":"공분산은 <b>시차에만<\/b> 의존하고 실제 시점에는 의존하지 않아야 합니다. \"~뿐 아니라\"를 끼워 넣어 틀리게 만든 최근형 함정입니다.","x":["맞는 설명입니다. 정상 시계열은 평균이 시점과 관계없이 일정합니다.","맞는 설명입니다. 정상 시계열은 분산도 시점에 의존하지 않고 일정합니다.","틀린 설명입니다. 공분산은 두 시점 사이의 시차에만 의존하고, 실제 어느 시점인지에는 의존하지 않아야 합니다.","맞는 설명입니다. 평균이 일정하지 않으면(추세가 있으면) 차분으로 정상화합니다."]},{"id":"3-4-08","s":3,"c":4,"t":"MDS 스트레스","k":"X","lv":3,"pg":21,"ref":"Q4-8","m":2,"n":36,"q":"다차원척도법의 적합도를 나타내는 스트레스(stress) 값에 대한 설명으로 옳은 것은?","o":["0에 가까울수록 적합도가 좋다.","1에 가까울수록 적합도가 좋다.","음수일수록 개체 간 거리를 잘 보존한다.","클수록 원래 거리를 잘 재현한 것이다."],"a":1,"e":"스트레스는 원래 거리와 지도 위 거리의 어긋남이라서 작을수록, 즉 0에 가까울수록 좋습니다. 결정계수처럼 1에 가까울수록 좋다고 착각하게 만드는 선지에 주의하세요.","x":["스트레스는 원래 거리와 지도 위 거리의 어긋남이라 0에 가까울수록 적합도가 좋습니다.","1에 가까울수록 좋은 것은 결정계수 같은 지표입니다. 스트레스는 작을수록 좋습니다.","스트레스는 어긋남의 크기라 음수가 되지 않습니다.","스트레스가 클수록 원래 거리를 잘못 재현한 것입니다."]},{"id":"3-4-12","s":3,"c":4,"t":"계량적·비계량적 MDS","k":"X","lv":3,"pg":21,"m":3,"n":36,"q":"개체 간 거리 대신 '더 가깝다, 더 멀다' 같은 순서(서열척도) 정보만 있을 때 쓰는 다차원척도법은?","o":["비계량적 MDS","계량적 MDS","주성분분석","요인분석"],"a":1,"e":"구간·비율척도의 실제 거리가 있으면 계량적 MDS(R의 cmdscale), 순서 정보만 있으면 비계량적 MDS(MASS 패키지의 isoMDS)를 씁니다. 두 방법 모두 스트레스 값이 0에 가까울수록 적합도가 좋습니다.","x":["순서(서열척도) 정보만 있을 때는 비계량적 MDS를 씁니다. R에서는 MASS 패키지의 isoMDS를 씁니다.","계량적 MDS는 구간·비율척도로 잰 실제 거리가 있을 때 씁니다(R의 cmdscale).","주성분분석은 거리 정보가 아니라 변수들의 분산·상관 구조를 이용해 차원을 줄이는 방법입니다.","요인분석은 변수들 뒤에 숨은 공통 요인을 찾는 방법으로, 개체 간 거리를 지도로 나타내는 방법이 아닙니다."]},{"id":"3-4-03","s":3,"c":4,"t":"분해 시계열 요인","k":"V","lv":5,"pg":19,"ref":"Q4-3","m":3,"n":37,"q":"분해 시계열에서 경기 변동처럼 일정하지 않은 주기로 오르내리는 변동 요인은?","o":["추세 요인","계절 요인","순환 요인","불규칙 요인"],"a":3,"e":"주기가 고정된 것은 계절 요인, 주기가 일정하지 않은 오르내림은 순환 요인입니다. 어떤 요인으로도 설명되지 않는 나머지가 불규칙 요인입니다.","x":["추세 요인은 장기적으로 꾸준히 오르거나 내리는 경향입니다.","계절 요인은 요일, 월, 분기처럼 고정된 주기로 반복되는 변동입니다.","경기 변동처럼 주기가 일정하지 않게 오르내리는 변동은 순환 요인입니다.","불규칙 요인은 추세, 계절, 순환 요인으로 설명되지 않고 남는 우연한 변동입니다."]},{"id":"3-4-10","s":3,"c":4,"t":"AR·MA·ARIMA 모형","k":"U","lv":3,"pg":20,"m":2,"n":37,"q":"시계열 모형에 대한 설명으로 옳지 않은 것은?","o":["AR 모형은 현재 값을 과거 시점 값들의 선형 결합으로 표현한다.","MA 모형은 현재 값을 과거 백색잡음(오차)들의 선형 결합으로 표현한다.","비정상 시계열도 차분이나 변환 없이 ARMA 모형을 그대로 적용한다.","ARIMA(p, d, q)의 d는 정상 시계열로 만들기 위해 차분한 횟수이다."],"a":3,"e":"ARMA는 정상 시계열에 쓰는 모형입니다. 비정상 시계열은 차분(평균이 변할 때)이나 로그 변환(분산이 변할 때)으로 먼저 정상화한 뒤 다룹니다. 차분이 들어간 모형이 ARIMA입니다.","x":["맞는 설명입니다. AR(자기회귀) 모형은 현재 값을 과거 시점 값들의 선형 결합으로 표현합니다.","맞는 설명입니다. MA(이동평균) 모형은 현재 값을 과거 백색잡음들의 선형 결합으로 표현합니다.","틀린 설명입니다. ARMA는 정상 시계열에 쓰는 모형이라, 비정상 시계열은 차분이나 변환으로 먼저 정상화해야 합니다.","맞는 설명입니다. d는 정상 시계열로 만들기 위해 차분한 횟수입니다."]},{"id":"3-4-11","s":3,"c":4,"t":"주성분 개수 정하기","k":"W","lv":5,"pg":20,"m":1,"n":37,"q":"주성분분석에서 고유값(주성분의 분산)을 큰 순서대로 그린 뒤, 기울기가 급격히 완만해지는 지점을 보고 주성분 개수를 정하는 그래프는?","o":["덴드로그램","스크리 그림(scree plot)","ROC 곡선","산점도 행렬"],"a":2,"e":"스크리 그림에서 꺾이는 지점(elbow) 앞까지의 주성분을 고릅니다. 누적 기여율(보통 80% 안팎)도 함께 쓰는 기준입니다. k-means의 엘보우 기법과 모양은 비슷하지만 그리는 대상이 다릅니다.","x":["덴드로그램은 계층적 군집분석에서 개체들이 합쳐지는 과정을 나무 모양으로 그린 그림입니다.","고유값을 큰 순서대로 그려 기울기가 급격히 완만해지는 지점(elbow)으로 주성분 개수를 정하는 그래프가 스크리 그림입니다.","ROC 곡선은 분류 모형의 성능을 민감도와 1 − 특이도로 그린 그래프입니다.","산점도 행렬은 여러 변수의 짝마다 산점도를 그려 관계를 한눈에 보는 그림입니다."]},{"id":"3-4-02","s":3,"c":4,"t":"정상화 방법","k":"T","lv":5,"pg":19,"ref":"Q4-2","m":2,"n":38,"q":"분산(변동 폭)이 일정하지 않아 정상성을 만족하지 못하는 시계열을 정상화하는 방법으로 가장 적절한 것은?","o":["차분","로그 변환","계절 차분","이동평균"],"a":2,"e":"분산이 일정하지 않으면 로그 같은 변환으로 퍼짐을 안정시킵니다. 차분은 평균이 변할 때(추세), 계절 차분은 계절성이 있을 때 씁니다.","x":["차분은 평균이 일정하지 않을 때(추세가 있을 때) 쓰는 방법입니다. 분산이 일정하지 않은 문제는 차분이 아니라 변환으로 다룹니다.","분산이 일정하지 않을 때는 로그 같은 변환으로 퍼짐을 안정시킵니다. 값이 커질수록 변동 폭도 커지는 시계열에 특히 잘 맞습니다.","계절 차분은 일정한 주기로 반복되는 계절성이 있을 때 씁니다.","이동평균은 일정 기간의 평균으로 불규칙 변동을 매끄럽게 하는 평활 방법으로, 커지는 분산을 안정시키지는 못합니다."]},{"id":"3-4-04","s":3,"c":4,"t":"ACF·PACF로 모형 판별","k":"U","lv":3,"pg":20,"ref":"Q4-4","m":3,"n":38,"q":"어떤 정상 시계열의 ACF는 지수적으로 천천히 감소하고, PACF는 시차 2 이후 0으로 절단되었다. 가장 적절한 모형은?","o":["AR(2)","MA(2)","ARMA(2, 2)","백색잡음"],"a":1,"e":"PACF가 시차 p 이후 절단되면 AR(p)입니다. 반대로 ACF가 시차 2 이후 절단되었다면 MA(2)입니다.","x":["ACF가 천천히 감소하고 PACF가 시차 2 이후 절단되면 AR(2)입니다.","MA(2)는 반대로 ACF가 시차 2 이후 절단되고 PACF가 천천히 감소합니다.","ARMA는 ACF와 PACF가 모두 천천히 감소합니다. 여기서는 PACF가 절단되었습니다.","백색잡음은 시차 0을 빼면 ACF와 PACF가 모든 시차에서 0 근처라, 천천히 감소하는 ACF와 맞지 않습니다."]},{"id":"3-4-05","s":3,"c":4,"t":"ARIMA 차수","k":"U","lv":3,"pg":20,"ref":"Q4-5","m":1,"n":38,"q":"ARIMA(1, 2, 3) 모형에 대한 설명으로 옳은 것은?","o":["2번 차분하면 ARMA(1, 3)이 된다.","MA 모형의 차수는 2이다.","AR 모형의 차수는 3이다.","차분이 필요 없는 정상 시계열이다."],"a":1,"e":"(p, d, q) = (AR 차수, 차분 횟수, MA 차수)입니다. 가운데 숫자 2는 차분 횟수라서 두 번 차분하면 ARMA(1, 3)이 됩니다.","x":["가운데 숫자 2는 차분 횟수라, 두 번 차분하면 ARMA(1, 3)이 됩니다.","MA 차수는 마지막 숫자인 3입니다. 2는 차분 횟수입니다.","AR 차수는 첫 번째 숫자인 1입니다.","d = 2이므로 두 번 차분해야 정상 시계열이 되는 비정상 시계열입니다."]},{"id":"3-5-01","s":3,"c":5,"t":"추진 단계 순서","k":"Y","lv":4,"pg":22,"ref":"Q5-1","m":2,"n":39,"q":"데이터 마이닝 추진 단계를 순서대로 나열한 것은?","o":["목적 설정 → 데이터 준비 → 데이터 가공 → 기법 적용 → 검증","데이터 준비 → 목적 설정 → 데이터 가공 → 기법 적용 → 검증","목적 설정 → 데이터 가공 → 데이터 준비 → 검증 → 기법 적용","데이터 준비 → 데이터 가공 → 목적 설정 → 기법 적용 → 검증"],"a":1,"e":"무엇을 할지 정하고(목적 설정), 데이터를 모으고(준비), 분석에 맞게 다듬은(가공) 뒤, 기법을 적용하고 결과를 검증합니다.","x":["목적 설정 → 데이터 준비 → 데이터 가공 → 기법 적용 → 검증 순서입니다. 무엇을 할지 먼저 정해야 필요한 데이터를 모을 수 있습니다.","목적 설정이 가장 먼저입니다. 목적이 정해져야 어떤 데이터를 준비할지 알 수 있습니다.","데이터를 준비(수집)한 다음에 가공하고, 기법을 적용한 다음에 검증합니다. 두 곳의 순서가 바뀌었습니다.","목적 설정이 맨 앞에 와야 합니다. 목적 없이 데이터를 준비·가공하면 분석 방향을 잡을 수 없습니다."]},{"id":"3-5-07","s":3,"c":5,"t":"과대적합","k":"AC","lv":3,"pg":24,"ref":"Q5-7","m":3,"n":39,"q":"어떤 모형이 훈련 데이터에서는 정확도가 매우 높았지만 검증 데이터에서는 크게 떨어졌다. 현상과 대응으로 옳은 것은?","o":["과소적합: 모형을 더 복잡하게 만든다.","과대적합: 은닉층 노드를 더 늘린다.","과소적합: 훈련 데이터를 줄인다.","과대적합: 가지치기나 규제로 모형을 단순하게 만든다."],"a":4,"e":"훈련 데이터에만 지나치게 맞춘 과대적합입니다. 나무라면 가지치기, 회귀라면 릿지·라쏘 같은 규제, 신경망이라면 노드 수를 줄이는 식으로 단순하게 만듭니다.","x":["훈련 성능은 높고 검증 성능만 떨어지면 과소적합이 아니라 과대적합입니다. 모형을 더 복잡하게 하면 상황이 나빠집니다.","현상은 과대적합이 맞지만, 은닉층 노드를 늘리면 모형이 더 복잡해져 과대적합이 심해집니다.","과소적합이 아니고, 훈련 데이터를 줄이면 오히려 과대적합이 심해질 수 있습니다.","훈련 데이터에만 지나치게 맞춘 과대적합이므로 가지치기, 규제(릿지·라쏘), 노드 수 줄이기 등으로 모형을 단순하게 만듭니다."]},{"id":"3-5-08","s":3,"c":5,"t":"붓스트랩","k":"AC","lv":3,"pg":24,"ref":"Q5-8","m":1,"n":39,"q":"붓스트랩에 대한 설명으로 옳지 않은 것은?","o":["원래 데이터에서 복원추출로 같은 크기의 표본을 만든다.","데이터가 충분히 크면 한 번도 뽑히지 않는 관측치의 비율은 약 36.8%이다.","한 번도 뽑히지 않은 관측치는 검증용 데이터로 활용할 수 있다.","비복원추출이므로 같은 관측치가 두 번 이상 뽑히지 않는다."],"a":4,"e":"붓스트랩은 복원추출이라 같은 관측치가 여러 번 뽑힐 수 있고, 그래서 한 번도 안 뽑히는 관측치가 생깁니다. 그 비율은 (1 − 1/n)<sup>n<\/sup> ≈ e<sup>−1<\/sup> ≈ 0.368입니다.","x":["맞는 설명입니다. 원래 데이터에서 복원추출로 같은 크기의 표본을 여러 번 만듭니다.","맞는 설명입니다. 한 관측치가 n번 모두 안 뽑힐 확률은 (1 − 1/n)<sup>n<\/sup> ≈ e<sup>−1<\/sup> ≈ 0.368입니다.","맞는 설명입니다. 한 번도 뽑히지 않은 관측치(OOB)는 검증용 데이터로 쓸 수 있습니다.","틀린 설명입니다. 붓스트랩은 복원추출이라 같은 관측치가 여러 번 뽑힐 수 있습니다."]},{"id":"3-5-02","s":3,"c":5,"t":"지도·비지도 구분","k":"Y","lv":4,"pg":22,"ref":"Q5-2","m":3,"n":40,"q":"다음 중 비지도학습 기법에 해당하지 않는 것은?","o":["k-means","연관분석","SOM","랜덤포레스트"],"a":4,"e":"랜덤포레스트는 정답이 있는 데이터로 학습하는 분류·예측 모형(지도학습)입니다. SOM은 신경망이지만 비지도학습이라 자주 함정으로 쓰입니다.","x":["비지도학습입니다. 정답 없이 가까운 관측치끼리 k개 군집으로 묶습니다.","비지도학습입니다. 정답 없이 함께 일어나는 항목의 규칙을 찾습니다.","비지도학습입니다. 신경망 구조이지만 정답 없이 고차원 데이터를 저차원 격자에 군집화합니다.","랜덤포레스트는 정답(목표변수)이 있는 데이터로 학습하는 분류·예측 모형이라 지도학습입니다."]},{"id":"3-5-03","s":3,"c":5,"t":"정밀도 계산","k":"AA","lv":5,"pg":22,"ref":"Q5-3","m":2,"n":40,"q":"어떤 분류 모형의 오분류표가 아래와 같을 때 정밀도(Precision)는? (소수 셋째 자리에서 반올림)","tbl":{"h":["","예측 양성","예측 음성"],"r":[["실제 양성","80","20"],["실제 음성","30","70"]]},"o":["0.70","0.73","0.75","0.80"],"a":2,"e":"정밀도 = TP ÷ (TP + FP) = 80 ÷ 110 ≈ 0.73. 나머지 선지가 모두 다른 지표라는 점이 함정입니다. ①은 특이도, ③은 정확도(150 ÷ 200), ④는 재현율(80 ÷ 100)입니다.","x":["특이도 = TN ÷ (TN + FP) = 70 ÷ 100 = 0.70입니다. 정밀도가 아닙니다.","정밀도 = TP ÷ (TP + FP) = 80 ÷ 110 ≈ 0.73입니다. 양성으로 예측한 것 중 실제 양성의 비율입니다.","정확도 = (TP + TN) ÷ 전체 = 150 ÷ 200 = 0.75입니다.","재현율(민감도) = TP ÷ (TP + FN) = 80 ÷ 100 = 0.80입니다."]},{"id":"3-5-05","s":3,"c":5,"t":"상황에 맞는 지표","k":"AA","lv":5,"pg":22,"ref":"Q5-5","m":1,"n":40,"q":"암 진단 모형처럼 실제 환자를 놓치는 비용이 매우 큰 경우 가장 중요하게 봐야 하는 지표는?","o":["정밀도","재현율(민감도)","특이도","정확도"],"a":2,"e":"실제 양성(환자) 중 몇 명을 찾아냈는지가 재현율입니다. 반대로 정상 메일을 스팸으로 잘못 거르면 곤란한 스팸 필터라면 정밀도가 중요합니다.","x":["정밀도는 양성으로 예측한 것 중 실제 양성의 비율로, 잘못된 양성 판정을 줄여야 할 때 봅니다. 정상 메일을 거르면 곤란한 스팸 필터가 대표적입니다.","재현율은 실제 환자 중 몇 명을 찾아냈는지 보는 지표라, 환자를 놓치면 큰일 나는 암 진단에서 가장 중요합니다.","특이도는 실제 정상인 사람을 정상으로 맞힌 비율로, 환자를 놓치는지와는 관계가 없습니다.","정확도는 전체 중 맞힌 비율이라 환자가 드물면 모두 정상이라고 해도 높게 나옵니다. 환자를 놓치는 문제를 잡아내지 못합니다."]},{"id":"3-5-04","s":3,"c":5,"t":"특이도·F1 계산","k":"AA","lv":5,"pg":22,"ref":"Q5-4","m":3,"n":41,"q":"어떤 분류 모형의 오분류표가 아래와 같을 때 특이도와 F1 점수를 순서대로 고른 것은? (소수 셋째 자리에서 반올림)","tbl":{"h":["","예측 양성","예측 음성"],"r":[["실제 양성","80","20"],["실제 음성","30","70"]]},"o":["0.70, 0.76","0.30, 0.76","0.70, 0.80","0.75, 0.73"],"a":1,"e":"특이도 = 70 ÷ (70 + 30) = 0.70. F1 = 2 × 0.727 × 0.8 ÷ (0.727 + 0.8) ≈ 0.76이고, 2TP ÷ (2TP + FP + FN) = 160 ÷ 210으로 계산해도 같습니다. ②의 0.30은 FPR(1 − 특이도)입니다.","x":["특이도 = 70 ÷ (70 + 30) = 0.70이고, F1 = 2TP ÷ (2TP + FP + FN) = 160 ÷ 210 ≈ 0.76입니다.","0.30은 1 − 특이도인 FPR(거짓 양성 비율)입니다. F1은 맞습니다.","특이도는 맞지만 0.80은 재현율입니다. F1은 정밀도와 재현율의 조화평균이라 0.76입니다.","0.75는 정확도, 0.73은 정밀도입니다."]},{"id":"3-5-06","s":3,"c":5,"t":"ROC 곡선","k":"AB","lv":3,"pg":24,"ref":"Q5-6","m":2,"n":41,"q":"ROC 곡선에 대한 설명으로 옳지 않은 것은?","o":["x축은 1 − 특이도(FPR)이다.","y축은 민감도(TPR)이다.","AUC가 0.5이면 매우 우수한 모형이다.","AUC가 1에 가까울수록 좋은 모형이다."],"a":3,"e":"AUC 0.5는 대각선 아래 면적, 즉 무작위 분류 수준입니다. x축을 \"특이도\"로 바꾼 선지도 자주 나오니 \"1 −\"를 꼭 확인하세요.","x":["맞는 설명입니다. ROC 곡선의 x축은 1 − 특이도(거짓 양성 비율, FPR)입니다.","맞는 설명입니다. y축은 민감도(참 양성 비율, TPR)입니다.","틀린 설명입니다. AUC 0.5는 대각선 아래 면적으로, 무작위로 찍는 수준의 모형입니다.","맞는 설명입니다. AUC가 1에 가까울수록 곡선이 왼쪽 위로 붙어 분류 성능이 좋습니다."]},{"id":"3-5-09","s":3,"c":5,"t":"KNN","k":"Z","lv":2,"pg":25,"m":1,"n":41,"q":"k-최근접 이웃(KNN)에 대한 설명으로 옳지 않은 것은?","o":["새 관측치와 가장 가까운 k개 이웃의 다수결로 범주를 정한다.","변수의 단위에 따라 거리가 달라지므로 표준화가 필요하다.","k가 너무 작으면 잡음에 민감해 과대적합되기 쉽다.","학습 단계에서 회귀계수 같은 모수를 추정해 저장해 두고 예측한다."],"a":4,"e":"KNN은 미리 모형을 만들지 않고 예측할 때마다 거리를 계산하는 게으른 학습(lazy learning)입니다. 추정해 둘 모수가 없다는 점이 회귀 모형과 다릅니다.","x":["맞는 설명입니다. 새 관측치와 가장 가까운 k개 이웃의 다수결로 범주를 정합니다.","맞는 설명입니다. 거리로 이웃을 고르므로 단위가 큰 변수가 결과를 좌우하지 않도록 표준화가 필요합니다.","맞는 설명입니다. k가 너무 작으면 주변 잡음 하나에도 결과가 바뀌어 과대적합되기 쉽고, 너무 크면 과소적합되기 쉽습니다.","틀린 설명입니다. KNN은 모수를 추정해 두지 않고, 예측할 때마다 거리를 계산하는 게으른 학습(lazy learning)입니다."]},{"id":"3-6-03","s":3,"c":6,"t":"불순도 최댓값","k":"AD","lv":5,"pg":26,"ref":"Q6-3","m":2,"n":42,"q":"두 범주의 관측치가 정확히 반반(5개, 5개)인 마디의 엔트로피 지수와 지니 지수를 순서대로 고른 것은?","o":["1, 0.5","0.5, 1","0, 0","1, 1"],"a":1,"e":"반반이면 가장 불순합니다. 엔트로피 = −(0.5 × log<sub>2<\/sub>(0.5) + 0.5 × log<sub>2<\/sub>(0.5)) = 1, 지니 = 1 − (0.25 + 0.25) = 0.5입니다. 한 범주만 있으면 둘 다 0(③)입니다.","x":["반반이면 가장 불순해 최댓값이 나옵니다. 엔트로피 = −(0.5 × log<sub>2<\/sub>(0.5) + 0.5 × log<sub>2<\/sub>(0.5)) = 1, 지니 = 1 − (0.25 + 0.25) = 0.5입니다.","두 값의 순서를 바꿨습니다. 두 범주일 때 엔트로피의 최댓값은 1, 지니 지수의 최댓값은 0.5입니다.","한 범주만 있는 순수한 마디일 때의 값입니다. 반반이면 가장 불순합니다.","엔트로피는 1이 맞지만, 두 범주일 때 지니 지수는 최대 0.5입니다."]},{"id":"3-6-04","s":3,"c":6,"t":"의사결정나무 특징","k":"AD","lv":5,"pg":26,"ref":"Q6-4","m":3,"n":42,"q":"의사결정나무에 대한 설명으로 옳지 않은 것은?","o":["분류 결과를 규칙으로 표현할 수 있어 해석이 쉽다.","선형성, 정규성 같은 통계적 가정이 필요 없다.","가지치기는 과대적합을 막기 위해 사용한다.","분류 경계선 근처의 자료도 오차 없이 안정적으로 분류한다."],"a":4,"e":"경계값에서 칼같이 나누기 때문에 경계선 근처의 자료는 오히려 오차가 큽니다. 장점과 단점을 뒤집은 선지는 매번 나오는 패턴입니다.","x":["맞는 설명입니다. 'A이고 B이면 C'처럼 규칙으로 표현돼 해석이 쉽습니다.","맞는 설명입니다. 선형성, 정규성, 등분산성 같은 통계적 가정이 필요 없는 비모수적 방법입니다.","맞는 설명입니다. 나무가 너무 깊어지면 훈련 데이터에 과대적합되므로 불필요한 가지를 잘라 냅니다.","틀린 설명입니다. 경계값에서 칼같이 나누기 때문에 분류 경계선 근처의 자료는 오히려 오차가 큽니다."]},{"id":"3-6-09","s":3,"c":6,"t":"가중치 개수 계산","k":"AF","lv":5,"pg":27,"ref":"Q6-9","m":1,"n":42,"q":"입력층 노드 4개, 은닉층 노드 3개, 출력층 노드 2개인 완전 연결 신경망에서 편향을 제외한 가중치의 개수는?","o":["9개","18개","23개","24개"],"a":2,"e":"4 × 3 + 3 × 2 = 18개입니다. 편향까지 세면 18 + 3 + 2 = 23개(③)이고, ①은 노드 수의 합, ④는 4 × 3 × 2로 잘못 곱한 값입니다.","x":["노드 수를 더한 값(4 + 3 + 2)입니다. 가중치는 층과 층 사이의 연결선 수를 세야 합니다.","입력→은닉 연결 4 × 3 = 12개와 은닉→출력 연결 3 × 2 = 6개를 더해 18개입니다.","편향까지 센 값입니다. 은닉층 편향 3개와 출력층 편향 2개를 더하면 23개가 됩니다.","세 층의 노드 수를 모두 곱한 값(4 × 3 × 2)입니다. 연결선은 이웃한 두 층 사이에서만 생깁니다."]},{"id":"3-6-01","s":3,"c":6,"t":"지니 지수 계산","k":"AD","lv":5,"pg":26,"ref":"Q6-1","m":3,"n":43,"q":"어떤 마디에 A 범주 관측치가 6개, B 범주 관측치가 4개 있다. 이 마디의 지니 지수는?","o":["0.24","0.48","0.52","0.60"],"a":2,"e":"1 − (0.6² + 0.4²) = 1 − (0.36 + 0.16) = 0.48. ③의 0.52는 제곱의 합을 그대로 쓴 값, ①은 0.6 × 0.4로 계산한 값입니다.","x":["0.6 × 0.4로 계산한 값입니다. 두 범주일 때 지니 지수는 2 × 0.6 × 0.4 = 0.48이 됩니다.","지니 지수 = 1 − (0.6² + 0.4²) = 1 − 0.52 = 0.48입니다.","제곱의 합(0.36 + 0.16)을 그대로 쓴 값입니다. 1에서 빼야 지니 지수가 됩니다.","A 범주의 비율(6/10)일 뿐 지니 지수가 아닙니다."]},{"id":"3-6-08","s":3,"c":6,"t":"활성화 함수와 출력 범위","k":"AF","lv":5,"pg":27,"ref":"Q6-8","m":2,"n":43,"q":"활성화 함수와 출력 범위의 연결이 옳지 않은 것은?","o":["시그모이드 – 0 ~ 1","tanh – −1 ~ 1","ReLU – 0 이상","소프트맥스 – −1 ~ 1, 출력의 합이 0"],"a":4,"e":"소프트맥스의 출력은 0~1 사이이고 합이 1이라서 클래스별 확률로 읽습니다. 그래서 다중 클래스 분류의 출력층에 씁니다.","x":["맞는 연결입니다. 시그모이드는 출력을 0~1 사이로 바꿉니다.","맞는 연결입니다. tanh(쌍곡탄젠트)는 출력을 −1~1 사이로 바꿉니다.","맞는 연결입니다. ReLU는 음수는 0으로, 양수는 그대로 내보내 출력이 0 이상입니다.","틀린 연결입니다. 소프트맥스의 출력은 0~1 사이이고 합이 1이라 클래스별 확률로 읽습니다."]},{"id":"3-6-10","s":3,"c":6,"t":"회귀나무의 분리 기준","k":"AD","lv":5,"pg":26,"m":1,"n":43,"q":"목표변수가 연속형인 의사결정나무(회귀나무)의 분리 기준으로 옳은 것은?","o":["지니 지수","엔트로피 지수","카이제곱 통계량의 p-value","분산 감소량"],"a":4,"e":"연속형 목표변수는 F 통계량의 p-value나 분산 감소량으로 나눕니다. 지니 지수, 엔트로피 지수, 카이제곱 통계량은 목표변수가 범주형일 때의 기준입니다.","x":["지니 지수는 목표변수가 범주형일 때의 분리 기준입니다.","엔트로피 지수는 목표변수가 범주형일 때의 분리 기준입니다.","카이제곱 통계량의 p-value는 목표변수가 범주형일 때 CHAID가 쓰는 기준입니다.","목표변수가 연속형이면 분산 감소량이나 F 통계량의 p-value를 기준으로 나눕니다."]},{"id":"3-6-05","s":3,"c":6,"t":"앙상블 비교","k":"AE","lv":4,"pg":27,"ref":"Q6-5","m":2,"n":44,"q":"앙상블 기법에 대한 설명으로 옳은 것은?","o":["배깅은 이전 모형이 잘못 분류한 데이터에 가중치를 주어 다음 모형을 학습한다.","부스팅은 여러 모형을 서로 독립적으로 병렬 학습한다.","랜덤포레스트는 배깅에 더해 마디를 나눌 때 변수의 일부를 무작위로 선택한다.","앙상블 모형은 단일 의사결정나무보다 해석이 쉽다."],"a":3,"e":"①과 ②는 배깅과 부스팅의 설명을 서로 바꾼 것입니다. 앙상블은 여러 모형을 합치므로 단일 나무보다 해석이 어렵습니다.","x":["부스팅에 대한 설명입니다. 배깅은 붓스트랩 표본마다 모형을 독립적으로 만들어 투표로 합칩니다.","배깅에 대한 설명입니다. 부스팅은 앞 모형의 오차를 반영해 모형을 순차적으로 학습합니다.","맞는 설명입니다. 랜덤포레스트는 배깅처럼 붓스트랩 표본으로 나무를 여러 개 만들되, 마디마다 변수 일부만 무작위로 골라 나무끼리의 상관을 줄입니다.","틀린 설명입니다. 앙상블은 여러 모형을 합치므로 단일 나무보다 성능은 좋지만 해석은 어렵습니다."]},{"id":"3-6-06","s":3,"c":6,"t":"부스팅 알고리즘","k":"AE","lv":4,"pg":27,"ref":"Q6-6","m":3,"n":44,"q":"다음 중 부스팅 계열 알고리즘이 아닌 것은?","o":["AdaBoost","GBM","XGBoost","랜덤포레스트"],"a":4,"e":"랜덤포레스트는 배깅을 바탕으로 한 방법입니다. AdaBoost, GBM, XGBoost는 앞 모형의 오차를 줄여 가며 순차적으로 학습하는 부스팅 계열입니다.","x":["부스팅 계열입니다. 잘못 분류한 관측치의 가중치를 높여 다음 모형을 학습합니다.","부스팅 계열입니다. 앞 모형의 잔차(오차)를 경사하강법으로 줄여 나가며 순차적으로 학습합니다.","부스팅 계열입니다. GBM에 규제와 병렬 처리를 더해 속도와 성능을 높였습니다.","랜덤포레스트는 부스팅이 아니라 배깅을 바탕으로 한 방법입니다."]},{"id":"3-6-07","s":3,"c":6,"t":"인공신경망 일반","k":"AF","lv":5,"pg":27,"ref":"Q6-7","m":1,"n":44,"q":"인공신경망에 대한 설명으로 옳지 않은 것은?","o":["단층 퍼셉트론으로 XOR 문제를 해결할 수 있다.","다중 클래스 분류의 출력층에는 주로 소프트맥스 함수를 사용한다.","은닉층의 노드 수가 너무 많으면 과대적합될 수 있다.","역전파 알고리즘으로 출력 오차를 줄이도록 가중치를 조정한다."],"a":1,"e":"XOR은 직선 하나로 나눌 수 없는 문제라 단층 퍼셉트론으로는 풀 수 없고, 은닉층이 있는 다층 퍼셉트론이 필요합니다.","x":["틀린 설명입니다. XOR은 직선 하나로 나눌 수 없어 단층 퍼셉트론으로는 풀 수 없고, 은닉층이 있는 다층 퍼셉트론이 필요합니다.","맞는 설명입니다. 소프트맥스는 출력을 합이 1인 클래스별 확률로 바꿔 주어 다중 클래스 분류에 씁니다.","맞는 설명입니다. 은닉 노드가 너무 많으면 훈련 데이터의 잡음까지 학습해 과대적합되고, 너무 적으면 과소적합됩니다.","맞는 설명입니다. 역전파는 출력층의 오차를 입력층 쪽으로 거꾸로 전달하며 가중치를 조정합니다."]},{"id":"3-6-02","s":3,"c":6,"t":"알고리즘과 분리 기준","k":"AD","lv":5,"pg":26,"ref":"Q6-2","m":1,"n":45,"q":"의사결정나무 알고리즘과 범주형 목표변수의 분리 기준 연결이 옳지 않은 것은?","o":["CART – 지니 지수","C4.5 – 엔트로피 지수","CHAID – 카이제곱 통계량","C5.0 – 카이제곱 통계량"],"a":4,"e":"C5.0은 C4.5를 개선한 알고리즘이라 엔트로피 지수를 씁니다. 카이제곱은 CHAID의 기준입니다.","x":["맞는 연결입니다. CART는 범주형 목표변수에 지니 지수를 씁니다.","맞는 연결입니다. C4.5는 엔트로피 지수(정보 이득)를 씁니다.","맞는 연결입니다. CHAID는 카이제곱 통계량의 p-value를 씁니다.","틀린 연결입니다. C5.0은 C4.5를 개선한 알고리즘이라 엔트로피 지수를 씁니다."]},{"id":"3-6-11","s":3,"c":6,"t":"기울기 소실","k":"AF","lv":5,"pg":27,"m":2,"n":45,"q":"은닉층이 많은 신경망에서 시그모이드 활성화 함수를 쓰면, 역전파 과정에서 기울기가 0에 가까워져 입력층 쪽 가중치가 거의 갱신되지 않는다. 이 문제와 대표적인 대응으로 옳은 것은?","o":["과대적합: 은닉 노드 수 늘리기","기울기 소실: ReLU 함수 사용","다중공선성: 라쏘 회귀 사용","지역 최솟값: 학습률을 0으로 고정"],"a":2,"e":"시그모이드의 기울기는 최대 0.25라서 층을 거칠수록 곱해져 0에 가까워집니다. 이것이 기울기 소실이고, 양수 구간의 기울기가 1인 ReLU를 쓰면 줄어듭니다.","x":["과대적합은 훈련 데이터에만 지나치게 맞는 문제로, 여기서 설명한 기울기 문제와 다릅니다. 노드를 늘리면 과대적합은 오히려 심해집니다.","시그모이드의 기울기(최대 0.25)가 층마다 곱해져 0에 가까워지는 것이 기울기 소실이고, 양수 구간 기울기가 1인 ReLU를 쓰면 줄어듭니다.","다중공선성은 회귀분석에서 독립변수끼리 상관이 높은 문제로, 신경망의 기울기 문제와 관계없습니다.","지역 최솟값은 전체 최솟값이 아닌 곳에 갇히는 문제입니다. 학습률을 0으로 고정하면 가중치가 아예 갱신되지 않습니다."]},{"id":"3-7-01","s":3,"c":7,"t":"밀도 기반 군집","k":"AL","lv":4,"pg":29,"ref":"Q7-1","m":3,"n":45,"q":"점이 밀집한 지역을 하나의 군집으로 묶어 모양이 불규칙한 군집도 찾고, 어느 군집에도 속하지 않는 점을 노이즈로 구분하는 방법은?","o":["k-means","와드연결법","DBSCAN","SOM"],"a":3,"e":"밀도 기반 군집인 DBSCAN의 특징입니다. k-means는 둥근 모양의 군집을 가정하고 군집 수를 미리 정해야 하며, 모든 점을 어느 군집엔가 배정합니다.","x":["k-means는 군집 수를 미리 정하고 둥근 모양의 군집을 가정하며, 모든 점을 어느 군집엔가 배정해 노이즈를 따로 구분하지 않습니다.","와드연결법은 오차제곱합 증가량을 기준으로 합치는 계층적 군집 방법으로, 밀도를 기준으로 하지 않습니다.","점이 밀집한 지역을 군집으로 묶어 불규칙한 모양도 찾고, 밀도가 낮은 점은 노이즈로 구분하는 것이 DBSCAN입니다.","SOM은 고차원 데이터를 2차원 격자에 대응시키는 신경망 기반 군집 방법입니다."]},{"id":"3-7-02","s":3,"c":7,"t":"거리 계산","k":"AG","lv":4,"pg":29,"ref":"Q7-2","m":1,"n":46,"q":"두 점 A(1, 2)와 B(4, 6) 사이의 유클리드 거리와 맨해튼 거리를 순서대로 고른 것은?","o":["5, 7","7, 5","5, 5","25, 7"],"a":1,"e":"좌표 차이는 3과 4입니다. 유클리드 = √(3² + 4²) = √25 = 5, 맨해튼 = 3 + 4 = 7. ④의 25는 제곱근을 빠뜨린 값입니다.","x":["좌표 차이가 3과 4라 유클리드 = √(3² + 4²) = 5, 맨해튼 = 3 + 4 = 7입니다.","두 거리의 순서를 바꿨습니다. 차이의 절댓값을 더하는 맨해튼 거리가 7입니다.","유클리드 거리는 맞지만, 맨해튼 거리는 차이의 절댓값을 그대로 더한 3 + 4 = 7입니다.","25는 제곱합(3² + 4²)이고, 제곱근을 씌워야 유클리드 거리 5가 됩니다."]},{"id":"3-7-03","s":3,"c":7,"t":"마할라노비스 거리","k":"AG","lv":4,"pg":29,"ref":"Q7-3","m":2,"n":46,"q":"변수들의 분산뿐 아니라 변수 간 상관관계까지 고려하는 거리 측도는?","o":["유클리드 거리","맨해튼 거리","마할라노비스 거리","체비셰프 거리"],"a":3,"e":"표준화 거리는 표준편차(분산)만 반영하고, 마할라노비스 거리는 공분산 행렬로 변수 간 상관까지 반영합니다.","x":["유클리드 거리는 좌표 차이의 제곱합에 제곱근을 씌운 거리로, 분산이나 상관을 고려하지 않습니다.","맨해튼 거리는 좌표 차이의 절댓값을 더한 거리로, 분산이나 상관을 고려하지 않습니다.","마할라노비스 거리는 공분산 행렬을 써서 변수의 분산과 변수 간 상관관계까지 함께 고려합니다.","체비셰프 거리는 좌표 차이의 절댓값 중 가장 큰 값을 거리로 씁니다."]},{"id":"3-7-07","s":3,"c":7,"t":"k-means 특징","k":"AI","lv":5,"pg":31,"ref":"Q7-7","m":3,"n":46,"q":"k-평균 군집에 대한 설명으로 옳지 않은 것은?","o":["한 번 특정 군집에 배정된 관측치는 다른 군집으로 이동할 수 없다.","군집의 수 k를 사전에 정해야 한다.","초기 중심값을 어떻게 정하느냐에 따라 결과가 달라질 수 있다.","평균을 중심으로 쓰므로 이상값에 민감하다."],"a":1,"e":"k-means는 중심을 갱신하며 관측치를 다시 배정하므로 군집을 옮겨 다닐 수 있습니다. \"한 번 합쳐지면 끝\"은 계층적 군집의 특징이라, 두 방법의 특징을 바꿔 낸 함정입니다.","x":["틀린 설명입니다. k-means는 중심을 다시 계산하며 관측치를 재배정하므로 다른 군집으로 옮겨 갈 수 있습니다. 한 번 합쳐지면 끝인 것은 계층적 군집입니다.","맞는 설명입니다. k-means는 군집 수 k를 미리 정해야 합니다.","맞는 설명입니다. 초기 중심값에 따라 결과가 달라질 수 있어 여러 번 실행해 비교하기도 합니다.","맞는 설명입니다. 평균을 중심으로 쓰므로 이상값이 중심을 끌어당겨 결과가 흔들립니다. 실제 관측치를 중심으로 쓰는 k-medoids(PAM)가 이를 보완합니다."]},{"id":"3-7-05","s":3,"c":7,"t":"와드 연결법","k":"AH","lv":5,"pg":30,"ref":"Q7-5","m":1,"n":47,"q":"두 군집을 합쳤을 때 군집 내 오차제곱합의 증가량이 가장 작은 쌍을 합치는 방법은?","o":["단일연결법","중심연결법","평균연결법","와드연결법"],"a":4,"e":"와드연결법은 거리가 아니라 오차제곱합(정보 손실)의 증가량을 기준으로 해서 크기가 비슷한 군집을 만듭니다. 두 군집 중심 사이 거리를 쓰는 것은 중심연결법입니다.","x":["단일연결법은 두 군집에서 가장 가까운 관측치 사이의 거리를 기준으로 합칩니다.","중심연결법은 두 군집 중심(평균) 사이의 거리를 기준으로 합칩니다.","평균연결법은 모든 관측치 쌍 사이 거리의 평균을 기준으로 합칩니다.","군집을 합쳤을 때 군집 내 오차제곱합의 증가량이 가장 작은 쌍을 합치는 것이 와드연결법입니다."]},{"id":"3-7-06","s":3,"c":7,"t":"덴드로그램 읽기","k":"AH","lv":5,"pg":30,"ref":"Q7-6","m":2,"n":47,"q":"다음 덴드로그램을 높이 h = 2.5에서 자르면 몇 개의 군집이 만들어지는가?","fig":"dendro","o":["2개","3개","4개","6개"],"a":2,"e":"점선(h = 2.5)이 세로선 3개와 만나므로 {A, B}, {C, D}, {E, F} 세 군집입니다. 가장 먼저 합쳐진 쌍은 높이 1.0의 A와 B이고, h = 4에서 잘랐다면 2개입니다.","x":["높이 3과 6 사이(예: h = 4)에서 잘랐을 때의 군집 수입니다. h = 2.5는 그보다 아래입니다.","h = 2.5의 선이 세로선 3개와 만나므로 {A, B}, {C, D}, {E, F} 세 군집입니다.","높이 1.5와 2 사이에서 잘랐을 때의 군집 수입니다. E와 F는 높이 2에서 이미 합쳐졌습니다.","높이 1보다 아래에서 잘라 아직 아무것도 합쳐지지 않았을 때의 군집 수입니다."]},{"id":"3-7-09","s":3,"c":7,"t":"SOM","k":"AK","lv":2,"pg":31,"ref":"Q7-9","m":3,"n":47,"q":"SOM(자기조직화지도)에 대한 설명으로 옳지 않은 것은?","o":["비지도학습 방식의 인공신경망이다.","입력층과 2차원 격자 형태의 경쟁층으로 구성된다.","역전파 알고리즘으로 가중치를 학습한다.","고차원 데이터를 저차원 지도로 시각화할 수 있다."],"a":3,"e":"SOM은 경쟁 학습(승자 독식)으로 학습하며 역전파를 쓰지 않습니다. 그래서 같은 신경망이어도 일반적인 다층 신경망보다 빠릅니다.","x":["맞는 설명입니다. SOM은 정답 없이 학습하는 비지도학습 신경망입니다.","맞는 설명입니다. 입력층과 2차원 격자 모양의 경쟁층 두 층으로 이루어집니다.","틀린 설명입니다. SOM은 역전파가 아니라, 입력과 가장 가까운 노드가 이기는 경쟁 학습(승자 독식)으로 가중치를 조정합니다.","맞는 설명입니다. 고차원 데이터를 2차원 지도에 대응시켜 비슷한 데이터끼리 가까이 모이도록 시각화합니다."]},{"id":"3-7-04","s":3,"c":7,"t":"연결법 정의","k":"AH","lv":5,"pg":30,"ref":"Q7-4","m":3,"n":48,"q":"두 군집에서 가장 멀리 떨어진 관측치 사이의 거리를 군집 간 거리로 정의하는 방법은?","o":["단일연결법","완전연결법","평균연결법","와드연결법"],"a":2,"e":"가장 먼 쌍은 완전(최장)연결법, 가장 가까운 쌍은 단일(최단)연결법입니다. 이름의 '최장·최단'과 짝지어 외우세요.","x":["단일(최단)연결법은 두 군집에서 가장 가까운 관측치 사이의 거리를 씁니다.","가장 먼 관측치 사이의 거리를 쓰는 방법은 완전(최장)연결법입니다.","평균연결법은 두 군집의 모든 관측치 쌍 사이 거리의 평균을 씁니다.","와드연결법은 거리 대신 군집을 합쳤을 때 오차제곱합의 증가량을 기준으로 합니다."]},{"id":"3-7-08","s":3,"c":7,"t":"엘보우 기법","k":"AI","lv":5,"pg":31,"ref":"Q7-8","m":1,"n":48,"q":"k-means에서 k를 1, 2, 3, …으로 늘려 가며 군집 내 제곱합(WSS)을 그렸더니 k = 3 이후 감소 폭이 급격히 줄었다. 이 그래프로 k를 3으로 정하는 방법은?","o":["엘보우 기법","스크리 그림으로 주성분 수 정하기","덴드로그램 자르기","k-fold 교차검증"],"a":1,"e":"k에 따른 WSS가 꺾이는 지점을 고르는 것이 엘보우 기법입니다. 주성분분석의 스크리 그림도 꺾이는 지점을 보지만 대상이 고유값이라 다른 방법입니다.","x":["k에 따른 군집 내 제곱합(WSS)이 팔꿈치처럼 꺾이는 지점을 k로 고르는 것이 엘보우 기법입니다.","스크리 그림은 주성분분석에서 고유값을 그려 주성분 개수를 정하는 그래프로, k-means의 k를 정하는 방법이 아닙니다.","덴드로그램 자르기는 계층적 군집에서 군집 수를 정하는 방법입니다.","k-fold 교차검증은 데이터를 k개로 나눠 돌아가며 검증하는 모형 평가 방법으로, 여기의 k는 군집 수가 아닙니다."]},{"id":"3-7-10","s":3,"c":7,"t":"혼합분포 군집","k":"AJ","lv":2,"pg":31,"ref":"Q7-10","m":2,"n":48,"q":"혼합분포 군집에 대한 설명으로 옳지 않은 것은?","o":["데이터가 여러 확률분포의 혼합에서 나왔다고 가정한다.","EM 알고리즘으로 모수를 추정한다.","E단계에서는 각 관측치가 각 군집에 속할 확률을 구한다.","이상값에 강해서 이상값이 많아도 추정이 안정적이다."],"a":4,"e":"혼합분포 군집은 k-means처럼 이상값에 민감합니다. 그래서 이상값을 먼저 처리한 뒤 적용하는 것이 좋습니다.","x":["맞는 설명입니다. 데이터가 정규분포 같은 여러 확률분포가 섞인 것에서 나왔다고 가정합니다.","맞는 설명입니다. 각 분포의 모수와 가중치를 EM 알고리즘으로 추정합니다.","맞는 설명입니다. E단계에서 각 관측치가 각 군집에 속할 확률을 구하고, M단계에서 그 확률로 모수를 다시 추정합니다.","틀린 설명입니다. 혼합분포 군집은 k-means처럼 이상값에 민감하므로 이상값을 먼저 처리한 뒤 적용하는 것이 좋습니다."]},{"id":"3-8-01","s":3,"c":8,"t":"신뢰도·향상도 계산","k":"AN","lv":5,"pg":33,"ref":"Q8-1","m":2,"n":49,"q":"다음 거래 데이터에서 규칙 {축구화} → {양말}의 신뢰도와 향상도를 순서대로 고른 것은?","tbl":{"h":["거래","구매 품목"],"r":[["1","축구공, 축구화"],["2","축구화, 양말"],["3","축구공, 축구화, 양말"],["4","축구공, 물병"],["5","축구화, 양말, 물병"]]},"o":["0.75, 1.25","0.60, 1.25","0.75, 0.80","0.60, 0.80"],"a":1,"e":"축구화 포함 4건, 양말 포함 3건, 둘 다 3건입니다. 신뢰도 = 3 ÷ 4 = 0.75, 향상도 = 0.75 ÷ (3 ÷ 5) = 1.25로 1보다 커서 양의 관계입니다. ②, ④의 0.60은 지지도(3 ÷ 5)입니다.","x":["축구화가 든 4건 중 양말도 산 거래가 3건이라 신뢰도 = 0.75이고, 향상도 = 0.75 ÷ 양말 지지도(3/5 = 0.6) = 1.25입니다.","0.60은 두 품목을 함께 산 비율인 지지도(3/5)입니다. 신뢰도는 축구화를 산 거래 중 양말도 산 비율인 0.75입니다.","신뢰도는 맞지만, 향상도는 신뢰도를 양말의 지지도(0.6)로 나눈 1.25입니다. 0.80은 축구화의 지지도(4/5)입니다.","0.60은 지지도, 0.80은 축구화의 지지도라 둘 다 묻는 값이 아닙니다."]},{"id":"3-8-03","s":3,"c":8,"t":"규칙의 방향과 신뢰도","k":"AN","lv":5,"pg":33,"ref":"Q8-3","m":1,"n":49,"q":"다음 거래 데이터에서 규칙 {양말} → {축구화}의 지지도와 신뢰도를 순서대로 고른 것은?","tbl":{"h":["거래","구매 품목"],"r":[["1","축구공, 축구화"],["2","축구화, 양말"],["3","축구공, 축구화, 양말"],["4","축구공, 물병"],["5","축구화, 양말, 물병"]]},"o":["1.00, 0.60","0.60, 0.75","0.75, 1.00","0.60, 1.00"],"a":4,"e":"양말 포함 3건이 모두 축구화도 포함하므로 신뢰도 = 3 ÷ 3 = 1.00입니다. 지지도는 {축구화} → {양말}과 같은 0.60이지만 신뢰도(0.75)는 방향에 따라 달라집니다.","x":["지지도와 신뢰도의 순서를 바꿨습니다. 지지도가 0.60, 신뢰도가 1.00입니다.","0.75는 반대 방향 규칙 {축구화} → {양말}의 신뢰도입니다. 신뢰도는 규칙의 방향에 따라 달라집니다.","신뢰도는 맞지만 지지도는 전체 5건 중 두 품목을 함께 산 3건의 비율인 0.60입니다.","두 품목을 함께 산 거래가 5건 중 3건이라 지지도 0.60, 양말을 산 3건이 모두 축구화도 샀으니 신뢰도 1.00입니다."]},{"id":"3-8-04","s":3,"c":8,"t":"Apriori 원리","k":"AO","lv":3,"pg":34,"ref":"Q8-4","m":3,"n":49,"q":"Apriori 알고리즘에 대한 설명으로 옳은 것은?","o":["최소 지지도를 넘지 못한 항목집합을 포함하는 더 큰 집합은 빈발할 수 있으므로 반드시 다시 계산한다.","향상도가 1인 규칙이 가장 유용한 규칙이다.","빈발하지 않은 항목집합을 포함하는 집합은 빈발하지 않으므로 탐색에서 제외한다.","목표변수가 반드시 필요한 지도학습 기법이다."],"a":3,"e":"빈발하지 않은 조합의 상위 집합은 볼 필요가 없다는 것이 Apriori의 핵심입니다. 향상도 1은 독립이라 쓸모없는 규칙이고, 연관분석은 비지도학습입니다.","x":["틀린 설명입니다. 빈발하지 않은 항목집합을 포함하는 더 큰 집합도 빈발할 수 없으므로 다시 계산하지 않고 제외합니다.","틀린 설명입니다. 향상도 1은 두 품목이 서로 독립이라는 뜻이라 쓸모없는 규칙입니다. 1보다 클수록 유용합니다.","맞는 설명입니다. 빈발하지 않은 항목집합의 상위 집합은 빈발할 수 없어 탐색에서 빼므로 계산량이 크게 줄어듭니다.","틀린 설명입니다. 연관분석은 목표변수 없이 하는 비지도학습입니다."]},{"id":"3-8-02","s":3,"c":8,"t":"향상도 해석","k":"AN","lv":5,"pg":33,"ref":"Q8-2","m":3,"n":50,"q":"다음 거래 데이터에서 규칙 {축구공} → {축구화}의 향상도와 그 해석으로 옳은 것은?","tbl":{"h":["거래","구매 품목"],"r":[["1","축구공, 축구화"],["2","축구화, 양말"],["3","축구공, 축구화, 양말"],["4","축구공, 물병"],["5","축구화, 양말, 물병"]]},"o":["0.67, 음의 관계","0.83, 음의 관계","1.20, 양의 관계","1.33, 양의 관계"],"a":2,"e":"축구공 포함 3건 중 축구화도 산 거래는 2건이라 신뢰도 = 2/3 ≈ 0.67. 축구화의 지지도는 4/5 = 0.8이므로 향상도 = (2/3) ÷ (4/5) = 5/6 ≈ 0.83입니다. 1보다 작으니 축구공을 산 사람은 오히려 축구화를 덜 산 셈입니다. ①은 신뢰도를 향상도로 착각한 값입니다.","x":["0.67은 신뢰도(2/3)입니다. 향상도는 이를 축구화의 지지도(4/5)로 나눈 (2/3) ÷ (4/5) = 5/6 ≈ 0.83입니다.","신뢰도 2/3를 축구화의 지지도 4/5로 나누면 향상도 = 5/6 ≈ 0.83입니다. 1보다 작아 음의 관계입니다.","향상도를 거꾸로 (4/5) ÷ (2/3) = 1.2로 계산한 값입니다. 향상도 = 신뢰도 ÷ 결과 품목의 지지도입니다.","1.33은 축구화의 지지도(0.8)를 축구공의 지지도(0.6)로 나눈 값으로 향상도가 아닙니다. 향상도는 0.83으로 1보다 작습니다."]},{"id":"3-8-05","s":3,"c":8,"t":"연관분석의 장단점","k":"AP","lv":2,"pg":34,"m":1,"n":50,"q":"연관분석에 대한 설명으로 옳지 않은 것은?","o":["결과가 if-then 규칙이라 이해하기 쉽다.","목표변수 없이 분석할 수 있다.","품목 수가 늘어나도 계산량은 거의 늘지 않는다.","거래가 적은 품목은 규칙을 찾는 과정에서 빠지기 쉽다."],"a":3,"e":"품목이 늘면 따져야 할 조합의 수가 기하급수적으로 늘어 계산량이 커집니다. 그래서 Apriori처럼 최소 지지도로 후보를 미리 줄이는 알고리즘을 씁니다.","x":["맞는 설명입니다. '이것을 사면 저것도 산다'는 if-then 규칙이라 이해하기 쉽습니다.","맞는 설명입니다. 목표변수 없이 거래 데이터만으로 분석하는 비지도학습입니다.","틀린 설명입니다. 품목이 늘면 따져야 할 조합이 기하급수적으로 늘어 계산량이 크게 늘어납니다.","맞는 설명입니다. 거래가 적은 품목은 지지도가 낮아 최소 지지도 기준에서 걸러지기 쉽습니다."]},{"id":"3-8-06","s":3,"c":8,"t":"지지도·신뢰도·향상도 계산","k":"AN","lv":5,"pg":33,"m":2,"n":50,"q":"전체 거래 1,000건 중 A를 포함한 거래가 200건, B를 포함한 거래가 250건, A와 B를 함께 포함한 거래가 100건이다. 규칙 A → B의 지지도, 신뢰도, 향상도를 순서대로 고른 것은?","o":["0.10, 0.40, 2.00","0.10, 0.50, 2.00","0.20, 0.50, 2.00","0.10, 0.50, 0.50"],"a":2,"e":"지지도 = 100 ÷ 1,000 = 0.10, 신뢰도 = 100 ÷ 200 = 0.50, 향상도 = 0.50 ÷ (250 ÷ 1,000) = 2.00입니다. 0.40은 B → A의 신뢰도(100 ÷ 250), 0.20은 A의 지지도이고, 향상도는 규칙의 방향과 관계없이 같습니다.","x":["0.40은 반대 방향 B → A의 신뢰도(100 ÷ 250)입니다. A → B의 신뢰도는 100 ÷ 200 = 0.50입니다.","지지도 = 100 ÷ 1,000 = 0.10, 신뢰도 = 100 ÷ 200 = 0.50, 향상도 = 0.50 ÷ 0.25 = 2.00입니다.","0.20은 A만의 지지도(200 ÷ 1,000)입니다. 규칙의 지지도는 A와 B를 함께 포함한 비율인 0.10입니다.","향상도는 신뢰도를 B의 지지도(0.25)로 나눈 2.00입니다. 0.50은 신뢰도를 다시 쓴 값입니다."]},{"id":"1-2-13","s":1,"c":2,"t":"빅데이터의 영향","q":"빅데이터가 '정부'에 주는 영향으로 가장 적절한 것은?","o":["소비자 행동을 분석하고 시장 변동을 예측해 비즈니스 모델을 혁신하고 생산성을 높인다.","분석 비용이 낮아져 정치인이나 가수가 인지도를 높이는 등 각자의 목적에 따라 활용한다.","표본조사 대신 전수조사가 가능해져 인과관계를 밝히는 데 집중하게 된다.","기상, 인구 이동, 각종 통계 데이터를 모아 사회 변화를 추정하고 환경 탐색·상황 분석·미래 대응에 활용한다."],"a":4,"e":"빅데이터의 영향은 주체별로 정리합니다. 기업은 혁신·경쟁력 제고·생산성 향상, 정부는 환경 탐색·상황 분석·미래 대응, 개인은 목적에 따른 활용입니다.","x":["기업에 주는 영향입니다. 소비자 행동 분석과 시장 예측으로 혁신, 경쟁력 제고, 생산성 향상을 얻습니다.","개인에 주는 영향입니다. 빅데이터 서비스가 늘고 분석 비용이 낮아져 개인도 인지도 향상 같은 목적에 따라 활용합니다.","영향이 아니라 빅데이터가 만든 변화를 거꾸로 쓴 설명입니다. 표본조사에서 전수조사로 바뀐 것은 맞지만, 무게는 인과관계에서 상관관계로 옮겨 갔습니다.","정부에 주는 영향입니다. 기상·인구 이동·통계·법제 데이터 등을 모아 사회 변화를 추정하고 환경 탐색, 상황 분석, 미래 대응에 씁니다."],"m":2,"n":4},{"id":"1-3-11","s":1,"c":3,"t":"가치 패러다임의 변화","q":"빅데이터 시대의 가치 패러다임 변화를 과거부터 미래 순서로 바르게 나열한 것은?","o":["연결(Connection) → 디지털화(Digitalization) → 에이전시(Agency)","디지털화(Digitalization) → 연결(Connection) → 에이전시(Agency)","디지털화(Digitalization) → 에이전시(Agency) → 연결(Connection)","에이전시(Agency) → 디지털화(Digitalization) → 연결(Connection)"],"a":2,"e":"아날로그를 디지털로 바꾸는 디지털화(과거), 디지털화된 정보와 대상이 서로 이어지는 연결(현재), 늘고 복잡해진 연결을 효과적이고 믿을 만하게 관리해 주는 에이전시(미래) 순서입니다. 기출에서는 순서를 묻거나, 복잡한 연결을 관리하는 단계가 무엇인지(에이전시) 묻습니다.","x":["디지털화가 출발점입니다. 정보와 대상이 먼저 디지털로 바뀌어야 서로 연결될 수 있습니다.","디지털화(과거) → 연결(현재) → 에이전시(미래) 순서입니다.","에이전시는 연결이 늘고 복잡해진 뒤 그 연결을 관리하는 단계라 연결 다음에 옵니다.","에이전시는 가장 마지막(미래) 단계이고, 출발점은 디지털화입니다."],"m":3,"n":10},{"id":"1-1-12","s":1,"c":1,"t":"데이터베이스의 측면별 특징","q":"데이터베이스의 특징을 여러 측면에서 설명한 것으로 옳지 않은 것은?","o":["정보의 축적 및 전달 측면: 기계 가독성, 검색 가능성, 원격 조작성을 갖는다.","정보 이용 측면: 이용자의 요구에 따라 다양한 정보를 신속하게 얻고, 원하는 정보를 정확하고 경제적으로 찾을 수 있다.","정보기술 발전 측면: 다양한 정보를 신속하게 제공하는 인프라로서 경제·산업·사회 활동의 효율성을 높이고 국민 편의를 증진한다.","정보 관리 측면: 정보를 일정한 질서와 구조에 따라 정리·저장해 방대한 정보를 체계적으로 축적하고 추가·갱신하기 쉽다."],"a":3,"e":"③은 경제·산업적 측면의 설명입니다. 정보기술 발전 측면은 데이터베이스가 정보처리, 검색·관리 소프트웨어, 하드웨어, 네트워크 기술의 발전을 이끈다는 내용입니다. 기출에서는 기계 가독성·검색 가능성·원격 조작성이 어느 측면인지 묻는 형태로 자주 나옵니다.","x":["맞는 설명입니다. 컴퓨터가 읽고 쓸 수 있고(기계 가독성), 여러 방법으로 검색할 수 있고(검색 가능성), 통신망으로 멀리서도 바로 이용할 수 있다(원격 조작성)는 특징입니다.","맞는 설명입니다. 이용자가 원하는 정보를 신속하게, 정확하고 경제적으로 찾을 수 있다는 것이 정보 이용 측면입니다.","틀린 설명입니다. 경제·산업·사회 활동의 효율성과 국민 편의는 경제·산업적 측면입니다. 정보기술 발전 측면은 정보처리, 검색·관리 소프트웨어, 하드웨어, 네트워크 기술의 발전을 이끈다는 내용입니다.","맞는 설명입니다. 일정한 질서와 구조로 정리·저장해 방대한 정보를 체계적으로 쌓고 새 내용을 추가·갱신하기 쉽다는 것이 정보 관리 측면입니다."],"m":0,"n":0}];</script>

function LocalBackend(pid) {
  const k = n => 'p:' + pid + ':' + n;
  return {
    kind: 'local', pid,
    async load() { return { prog: lsGet(k('prog')), ses: lsGet(k('ses')), atts: lsGet(k('atts')) || [] }; },
    async saveProg(p) { lsSet(k('prog'), p); },
    async saveSes(s) { lsSet(k('ses'), s); },
    async putAtt() { lsSet(k('atts'), S.atts.slice(0, MAX_ATTS).map(stripFresh)); },
    async delAtt() { lsSet(k('atts'), S.atts.map(stripFresh)); },
    async reset() { lsSet(k('prog'), null); lsSet(k('ses'), null); lsSet(k('atts'), null); },
    subscribe() {}, close() {},
  };
}
function DocBackend(kind, api, paths) {
  const progRef = api.doc(paths.prog), sesRef = api.doc(paths.ses), attCol = api.collection(paths.atts);
  const unsub = [];
  return {
    kind,
    async load() {
      const [p, s, a] = await Promise.all([progRef.get(), sesRef.get(), attCol.orderBy('endedAt', 'desc').limit(MAX_ATTS).get()]);
      return { prog: p.exists ? p.data() : null, ses: s.exists ? (s.data() || {}).ses : null, atts: a.docs.map(d => d.data()) };
    },
    async saveProg(p) { await progRef.set(clone(p)); },
    async saveSes(s) { if (s) await sesRef.set({ v: 1, ses: clone(s) }); else await sesRef.delete(); },
    async putAtt(a) { await attCol.doc(a.id).set(stripFresh(clone(a))); },
    async delAtt(id) { await attCol.doc(id).delete(); },
    async reset(ids) { await progRef.set(clone(emptyProg())); await sesRef.delete(); for (const id of ids) await attCol.doc(id).delete(); },
    subscribe(onProg, onAtts) {
      unsub.push(progRef.onSnapshot(onProg, () => {}));
      unsub.push(attCol.orderBy('endedAt', 'desc').limit(MAX_ATTS).onSnapshot(onAtts, () => {}));
    },
    close() { unsub.splice(0).forEach(f => { try { f(); } catch (e) { /* 무시 */ } }); },
  };
}

function statOf(ids) {

  for (const id of ids) { const r = S.prog.q[id]; if (r) { tries += r[0]; right += r[1]; seen++; } const w = S.prog.w[id]; if (w && !w.done) wrong++; }
  return { tries, right, seen, wrong, n: ids.length };
}
const idsWhere = fn => BANK.filter(fn).map(q => q.id);
function unitIds(key) {
  if (String(key).startsWith('lv')) { const l = +String(key).slice(2); return BANK.filter(q => q.s === 3 && q.lv === l).sort((a, b) => a.c - b.c || (a.id < b.id ? -1 : 1)).map(q => q.id); }
  const [s, c] = String(key).split('-').map(Number);
  return idsWhere(q => q.s === s && q.c === c).sort();
}
function unitTitle(key) {
  if (String(key).startsWith('lv')) { const l = +String(key).slice(2); return { title: `빈출 ${l}단계 · ${LV_NAME[l]}`, sub: `3과목 · ${LV_RULE[l]}` }; }

}
function noteIds(tab, subj) {
  let ids;
  if (tab === 'star') ids = Object.keys(S.prog.b).sort((a, b) => S.prog.b[b] - S.prog.b[a]);
  else ids = Object.keys(S.prog.w).filter(id => (tab === 'done' ? S.prog.w[id].done : !S.prog.w[id].done)).sort((a, b) => (S.prog.w[b].at || 0) - (S.prog.w[a].at || 0));
  return ids.filter(id => QM.has(id) && (!subj || QM.get(id).s === subj));
}
function qState(id) {
  const r = S.prog.q[id], w = S.prog.w[id];
  if (!r) return 'none';
  if (w && !w.done) return 'bad';
  return r[2] ? 'ok' : 'bad';

function grade(ses) {
  const bs = { 1: [0, 0], 2: [0, 0], 3: [0, 0] };
  let correct = 0, answered = 0;
  ses.qids.forEach((id, i) => {
    const q = QM.get(id), p = ses.picks[i];
    if (p > 0) answered++;
    if (!(ses.mode === 'exam' || p > 0)) return;
    bs[q.s][1]++;
    if (p === q.a) { bs[q.s][0]++; correct++; }
  });
  const total = bs[1][1] + bs[2][1] + bs[3][1];
  const out = { correct, total, answered, bs, full: !!ses.full && ses.mode === 'exam' };
  if (out.full) {
    out.score = correct * 2;
    out.fails = [1, 2, 3].filter(s => bs[s][1] && bs[s][0] / bs[s][1] < 0.4);

function buildSet(kind, key, filter) {
  let qids = [], title = '', full = false;
  if (kind === 'mock') {
    const m = +key;
    qids = BANK.filter(q => q.m === m).sort((a, b) => a.n - b.n).map(q => q.id);
    title = `모의고사 ${m}회`; full = true;
  } else if (kind === 'random') {
    // 교재 밖 보충 문제(sup)는 실전처럼 푸는 랜덤 모의고사에 넣지 않는다
    for (const s of [1, 2, 3]) for (const c of Object.keys(RANDOM_MOCK[s])) qids = qids.concat(sample(idsWhere(q => q.s === s && q.c === +c && !q.sup), RANDOM_MOCK[s][c]));
    title = '랜덤 모의고사'; full = true;
  } else if (kind === 'unit') {
    qids = unitIds(key);
    const ut = unitTitle(key);
    title = String(key).startsWith('lv') ? ut.title : `${SUBJ[+String(key)[0]].name} · ${ut.title}`;
    if (filter === 'unseen') { qids = qids.filter(id => !S.prog.q[id]); title += ' · 안 푼 문제'; }
    if (filter === 'wrong') { qids = qids.filter(id => S.prog.w[id] && !S.prog.w[id].done); title += ' · 틀린 문제'; }
  } else if (kind === 'subject') {
    qids = idsWhere(q => q.s === +key); title = `${SUBJ[+key].name} 전체`;
  } else if (kind === 'rand') {
    const [s, n] = String(key).split(':').map(Number);
    qids = sample(idsWhere(q => (!s || q.s === s) && !q.sup), n); title = `랜덤 ${n}문제${s ? ' · ' + SUBJ[s].name : ''}`;
  } else if (kind === 'wrong') {
    qids = shuffle(noteIds('todo', +key || 0)); title = '오답 다시 풀기';
  } else if (kind === 'star') {
    qids = noteIds('star', +key || 0); title = '북마크 문제';

/* ================= 풀이 화면 ================= */
function modeName(m) { return { exam: '실전 모드', study: '해설 모드', read: '훑어보기' }[m] || ''; }
let tick = null;
function enterQuiz() {
  S.route = 'quiz'; S.ui.sheetOpen = false;
  closeModal();
  render();
  window.scrollTo(0, 0);
  startTick();
}
function startTick() {
  clearInterval(tick);
  let last = now();
  tick = setInterval(() => {
    if (S.route !== 'quiz' || !S.ses) { clearInterval(tick); return; }
    const t = now(), dt = (t - last) / 1000; last = t;
    if (document.hidden && S.ses.mode !== 'exam') return;
    S.ses.elapsed += dt;
    const el = $('#timer');
    if (S.ses.mode === 'exam') {
      const left = S.ses.limit - S.ses.elapsed;
      if (el) { el.textContent = fmtClock(left); el.classList.toggle('warn', left <= 300); }
      if (left <= 0) { toast('시간이 끝나 답안을 자동으로 제출했어요.'); finishSession(true); return; }
    } else if (el) el.textContent = fmtClock(S.ses.elapsed);
    if (Math.floor(S.ses.elapsed) % 20 === 0) Store.saveSes(0);
  }, 1000);
}

    </aside>
    <div class="scrim-sheet ${S.ui.sheetOpen ? 'open' : ''}" data-act="sheet-close"></div>
    <nav class="mbar" aria-label="문제 이동"><button class="btn" data-act="prev" id="mprev">${I.left}<span>이전</span></button><button class="btn" data-act="sheet">${I.grid}<span id="mcount"></span></button><button class="btn primary" data-act="next" id="mnext"></button></nav>`;

function sheetHTML() {

  let h = '', lastS = 0;
  ses.qids.forEach((id, i) => {
    const q = QM.get(id);
    if (q.s !== lastS) { if (lastS) h += '</div>'; h += `<div class="sp-sec">${SUBJ[q.s].name} ${SUBJ[q.s].full}</div><div class="sp-grid">`; lastS = q.s; }

function cellState(i) {

  return { cls: p ? 'm' : '', a: p };
}

function updateSheet(i) {
  const ses = S.ses, n = ses.qids.length;

  document.querySelectorAll('.cell.cur').forEach(el => el.classList.remove('cur'));
  const cur = $('#c' + ses.idx);
  if (cur) { cur.classList.add('cur'); const box = $('#sp-b'); if (box && box.scrollHeight > box.clientHeight) { const t = cur.offsetTop - box.offsetTop - box.clientHeight / 2; box.scrollTo({ top: Math.max(0, t) }); } }
  const answered = ses.picks.filter(p => p).length, done = ses.done.filter(Boolean).length;
  const cnt = ses.mode === 'study' ? done : (ses.mode === 'read' ? n : answered);
  const set = (id, v) => { const el = $(id); if (el) el.textContent = v; };
  set('#sp-cnt', `${cnt}/${n}`);
  set('#mcount', `${cnt}/${n}`);

  set('#sp-left', ses.mode === 'exam' ? (n - answered ? `안 푼 문제 ${n - answered}개` : '모든 문제에 답을 표시했어요') : ses.mode === 'study' ? `채점한 문제 ${done}개` : '정답이 표시된 답안지예요');

  h += `<ol class="opts ${opt.reveal ? 'locked' : ''} ${notes ? 'has-x' : ''}">${q.o.map((o, k) => {

function expHTML(q, pick, mode) {

  const ref = q.s === 3 ? `합격 노트 ${q.pg}쪽 · 빈출 ${q.lv}단계 ${LV_NAME[q.lv]}${q.ref ? ` · 노트 예시 문제 ${q.ref}` : ''}` : `${SUBJ[q.s].name} · ${esc(CH[q.s][q.c])}`;
  const sup = q.sup ? `<p class="sup-note"><b>교재 밖 보충</b>${esc(q.sup)}</p>` : '';

function metaChips(q) {

}
function renderCard(dir) {

  const endLabel = ses.mode === 'exam' ? '답안 제출' : (ses.mode === 'read' ? '그만 보기' : '결과 보기');
  $('#qcard').innerHTML = `<article class="card qcard ${dir ? 'in-' + dir : ''}" aria-labelledby="qno">
    <div class="qhead"><span class="qno" id="qno">${i + 1}</span>${metaChips(q)}

      <span class="kbd">키보드 1~4 선택 · ←/→ 이동</span>
      ${last ? `<button class="btn primary" data-act="${endAct}">${endLabel}</button>` : `<button class="btn primary" data-act="next">다음${I.right}</button>`}</div>
  </article>`;
  const mn = $('#mnext'), mp = $('#mprev');

function go(i, dir) {
  const ses = S.ses; if (!ses) return;
  const j = Math.max(0, Math.min(ses.qids.length - 1, i));
  if (j === ses.idx && !S.ui.sheetOpen) return;
  ses.idx = j;
  closeSheet();
  renderCard(dir);
  Store.saveSes();
  const card = $('#qcard'); if (card && card.getBoundingClientRect().top < 0) window.scrollTo({ top: 0 });
}
function closeSheet() { S.ui.sheetOpen = false; const sh = $('#sheet'), sc = $('.scrim-sheet'); if (sh) sh.classList.remove('open'); if (sc) sc.classList.remove('open'); }
function pick(v) {
  const ses = S.ses, i = ses.idx, q = QM.get(ses.qids[i]);
  if (ses.mode === 'read' || (ses.mode === 'study' && ses.done[i])) return;
  if (ses.mode === 'exam') {
    ses.picks[i] = ses.picks[i] === v ? 0 : v;
    renderCard(); updateSheet(i); Store.saveSes();
    return;
  }
  ses.picks[i] = v; ses.done[i] = 1;
  applyResult(q.id, v, v === q.a, now());
  Store.saveProg(); Store.saveSes();
  renderCard(); updateSheet(i);
  revealScroll();
}
// 채점 직후: 선지별 해설이 붙어 길어진 선지 목록이 화면에 최대한 들어오도록 내린다. 목록 윗부분은 가리지 않는다.
function revealScroll() {
  const ol = document.querySelector('#qcard .opts'); if (!ol) return;
  const r = ol.getBoundingClientRect(), bar = $('#qbar');
  const topLim = (bar ? bar.getBoundingClientRect().bottom : 0) + 8;
  const botLim = window.innerHeight - (isNarrow() ? 84 : 20);
  const d = Math.min(r.bottom - botLim, r.top - topLim);
  if (d > 24) window.scrollBy({ top: d, behavior: 'smooth' });
}
function finishSession(auto) {
  const ses = S.ses; if (!ses) return;
  clearInterval(tick); closeModal();
  if (ses.mode === 'read') { S.ses = null; Store.saveSes(0); S.route = ses.kind === 'unit' ? 'unit' : 'home'; render(); return; }
  const g = grade(ses);
  if (ses.mode === 'study' && g.answered === 0) { S.ses = null; Store.saveSes(0); S.route = ses.kind === 'unit' ? 'unit' : 'home'; render(); toast('채점한 문제가 없어 기록을 남기지 않았어요.'); return; }
  const at = now();
  if (ses.mode === 'exam') ses.qids.forEach((id, i) => applyResult(id, ses.picks[i], ses.picks[i] === QM.get(id).a, at));
  const att = {
    v: 1, id: 'a' + uid36(), kind: ses.kind, key: ses.key, title: ses.title, mode: ses.mode, full: g.full,
    startedAt: ses.startedAt, endedAt: at, dur: Math.round(ses.elapsed),
    qids: ses.qids.slice(), picks: ses.picks.slice(), correct: g.correct, total: g.total, bs: g.bs,
  };
  if (g.full) { att.score = g.score; att.pass = g.pass; att.fails = g.fails; }
  if (auto) att.auto = 1;
  Store.addAtt(att);
  Store.saveProg();
  S.ses = null; Store.saveSes(0);
  S.res = { att, fresh: true, back: ses.kind === 'unit' ? 'unit' : (g.full ? 'mocks' : 'home') };
  S.ui.rvFilter = 'all'; S.ui.rvOpen = null;
  S.route = 'result';
  render(); window.scrollTo(0, 0);
}

/* ================= 결과 ================= */
function viewResult() {
  if (!S.res) return viewRecords();
  const a = S.res.att;
  const counted = (id, i) => a.mode === 'exam' || a.picks[i];
  const wrongIds = a.qids.filter((id, i) => counted(id, i) && a.picks[i] !== QM.get(id).a);
  let stamp, why = '';
  if (a.full) {
    stamp = `<span class="stamp ${a.pass ? 'pass' : 'fail'}">${a.pass ? '합격' : '불합격'}</span>`;
    if (!a.pass) {
      const r = [];
      if (a.score < 60) r.push(`총점이 60점에 ${60 - a.score}점 모자라요`);
      if (a.fails && a.fails.length) r.push(a.fails.map(s => `${SUBJ[s].name} 과락(${a.bs[s][0]}/${a.bs[s][1]})`).join(', '));
      why = r.join(' · ') + '.';
    } else why = '총점 60점 이상, 모든 과목 40% 이상이에요.';
  } else stamp = `<span class="stamp plain">${a.mode === 'exam' ? '채점 결과' : '해설 모드 결과'}</span>`;
  const big = a.full ? `<div class="score"><b>${a.score}</b><span>점</span></div>` : `<div class="score"><b>${pct(a.correct, a.total)}</b><span>%</span></div>`;
  const subjRows = [1, 2, 3].filter(s => a.bs[s] && a.bs[s][1]).map(s => barRow(`${SUBJ[s].name}<small>${a.full ? `${a.bs[s][0] * 2}점 / ${a.bs[s][1] * 2}점` : SUBJ[s].full}</small>`, { right: a.bs[s][0], tries: a.bs[s][1] }, true)).join('');
  const f = S.ui.rvFilter;
  const items = a.qids.map((id, i) => ({ id, i, q: QM.get(id), p: a.picks[i] })).filter(x => counted(x.id, x.i))
    .filter(x => f === 'all' || (f === 'wrong' ? x.p !== x.q.a : x.p === x.q.a));
  const cntAll = a.qids.filter(counted).length;
  const list = items.map(x => {
    const ok = x.p === x.q.a, open = S.ui.rvOpen === x.i;
    return `<li class="rv ${open ? 'open' : ''}"><button class="rv-h" data-act="rv" data-i="${x.i}" aria-expanded="${open}">
      <span class="n">${x.i + 1}</span><span class="mk">${ok ? MARK.ok : MARK.bad}</span>
      <span class="tt"><b>${esc(x.q.t)}</b><small>${SUBJ[x.q.s].name} · ${esc(CH[x.q.s][x.q.c])}</small></span>
      <span class="ab">${ok ? `정답 ${cn(x.q.a)}` : `<em>${x.p ? '내 답 ' + cn(x.p) : '안 풂'}</em> · 정답 ${cn(x.q.a)}`}</span></button>
      ${open ? `<div class="rv-body"><div class="qhead">${metaChips(x.q)}<span class="qtools"><button class="tool star" data-act="star-id" data-id="${x.id}" aria-pressed="${!!S.prog.b[x.id]}" aria-label="북마크">${I.star}</button></span></div>${qBody(x.q, { pick: x.p, reveal: true })}${expHTML(x.q, x.p, a.mode)}</div>` : ''}</li>`;
  }).join('');
  const back = S.res.fresh ? (S.res.back || 'home') : 'records';
  return `<div class="page-h"><button class="back" data-act="res-back" data-r="${back}">${I.left}${{ home: '홈', mocks: '모의고사', unit: '단원', records: '기록' }[back]}</button>
      <h1>${esc(a.title)}</h1><p class="lead">${modeName(a.mode)} · ${fmtDate(a.endedAt, true)}${a.auto ? ' · 시간 종료로 자동 제출' : ''}</p></div>
    <div class="res">
      <section class="card res-a">${stamp}${big}<div class="meta">${a.correct}/${a.total}문항 정답 · ${fmtDur(a.dur)}</div>${why ? `<p class="why">${why}</p>` : ''}
        <div class="res-acts">${wrongIds.length ? `<button class="btn primary" data-act="start-retry" data-key="${a.id}">틀린 ${wrongIds.length}문제 다시 풀기</button>` : ''}<button class="btn" data-act="nav" data-r="notes">오답 노트</button></div>
        ${S.res.fresh && wrongIds.length ? `<p class="muted small">틀리거나 안 푼 ${wrongIds.length}문제를 오답 노트에 담았어요.</p>` : ''}</section>
      <section class="card res-b"><h3>과목별 ${a.full ? '점수' : '정답률'}</h3><div class="bars">${subjRows}</div>${a.full ? '<p class="muted small">세로선은 과락 기준 40%예요.</p>' : ''}</section>

/* ================= 오답 노트 ================= */

/* ================= 기록 ================= */

    case 'start-star': beginSession('star', d.key, 'study', {}); break;

    case 'discard': modal(`<h2>진행 중인 풀이를 지울까요?</h2><p class="sub">${esc(S.ses ? S.ses.title : '')}에 표시한 답이 기록 없이 사라져요.</p><div class="acts"><button class="btn quiet" data-act="close">취소</button><button class="btn primary" data-act="discard-yes">지우기</button></div>`); break;
    case 'discard-yes': closeModal(); S.ses = null; Store.saveSes(0); render(); toast('진행 중인 풀이를 지웠어요.'); break;
    case 'pick': pick(+d.v); break;
    case 'prev': go(S.ses.idx - 1, 'r'); break;
    case 'next': go(S.ses.idx + 1, 'l'); break;
    case 'go': go(+d.i); break;
    case 'sheet': S.ui.sheetOpen = true; $('#sheet').classList.add('open'); $('.scrim-sheet').classList.add('open'); updateSheet(null); break;
    case 'sheet-close': closeSheet(); break;
    case 'star': toggleStar(S.ses.qids[S.ses.idx]); renderCard(); break;
    case 'star-id': toggleStar(d.id); el.setAttribute('aria-pressed', String(!!S.prog.b[d.id])); break;
    case 'flag': S.ses.flags[S.ses.idx] = S.ses.flags[S.ses.idx] ? 0 : 1; renderCard(); updateSheet(S.ses.idx); Store.saveSes(); break;
    case 'fs': { const v = (fontStep() + 1) % 3; lsSet('fs', v); document.documentElement.style.setProperty('--qs', [1, 1.1, 1.22][v]); toast(['글자 크기: 기본', '글자 크기: 크게', '글자 크기: 아주 크게'][v]); break; }
    case 'submit-ask': {
      const left = S.ses.picks.filter(p => !p).length, fl = S.ses.flags.filter(Boolean).length;
      closeSheet();
      modal(`<h2>답안을 제출할까요?</h2><p class="sub">${left ? `아직 답을 표시하지 않은 문제가 ${left}개 있어요. 표시하지 않은 문제는 틀린 것으로 채점돼요.` : '모든 문제에 답을 표시했어요.'}${fl ? ` 검토 표시한 문제가 ${fl}개 있어요.` : ''}</p>
        <div class="acts"><button class="btn quiet" data-act="close">계속 풀기</button><button class="btn primary" data-act="submit">제출하고 채점하기</button></div>`);

    }

      const done = ses.done.filter(Boolean).length;

    case 'rv': S.ui.rvOpen = S.ui.rvOpen === +d.i ? null : +d.i; render(); break;
    case 'rvf': S.ui.rvFilter = d.v; S.ui.rvOpen = null; render(); break;
    case 'res-back': go2(d.r); break;
    case 'ntab': S.ui.notesTab = d.v; S.ui.open = null; render(); break;
    case 'nsubj': S.ui.notesSubj = +d.v; S.ui.open = null; render(); break;

    case 'note-undo': { const w = S.prog.w[d.id]; if (w) { w.done = 0; Store.saveProg(); } S.ui.open = null; render(); toast('다시 풀 문제로 옮겼어요.'); break; }
    case 'note-del': delete S.prog.w[d.id]; Store.saveProg(); S.ui.open = null; render(); toast('오답 노트에서 지웠어요.'); break;
    case 'att': { const a = S.atts.find(x => x.id === d.id); if (a) { S.res = { att: a, fresh: false }; S.ui.rvFilter = 'all'; S.ui.rvOpen = null; go2('result'); } break; }
    case 'rs': S.ui.randSubj = +d.v; render(); break;
    case 'rn': S.ui.randN = +d.v; render(); break;
    case 'reset-ask': modal(`<h2>기록을 모두 지울까요?</h2><p class="sub">푼 문제, 오답 노트, 북마크, 응시 기록이 모두 사라지고 되돌릴 수 없어요.</p><div class="acts"><button class="btn quiet" data-act="close">취소</button><button class="btn danger-fill" data-act="reset-yes">모두 지우기</button></div>`); break;
    case 'reset-yes': closeModal(); Store.resetAll().then(() => { render(); toast('기록을 모두 지웠어요.'); }); break;
    case 'import': importLocal(d.id); break;
    case 'import-no': S.ui.importFrom = null; render(); break;
    case 'profile': selectProfile(d.id); break;
    case 'switch-profile': closeModal(); switchToProfiles(); break;
    case 'to-login': closeModal(); toLogin(); break;
    case 'local-mode': S.localChosen = true; lsSet('localmode', 1); S.route = 'login'; render(); break;
    case 'auth-tab': S.ui.authTab = d.v; S.ui.authErr = ''; render(); break;
    case 'g-login': googleLogin(); break;

});
document.addEventListener('submit', e => {

});
function toggleStar(id) {
  if (S.prog.b[id]) { delete S.prog.b[id]; toast('북마크를 해제했어요.'); }
  else { S.prog.b[id] = now(); toast('북마크했어요. 오답 노트의 북마크에서 볼 수 있어요.'); }

}

/* 프로필·로그인 동작 */
async function selectProfile(id) {
  const p = Profiles.use(id); if (!p) return;
  await Store.detach();
  await Store.attach(LocalBackend(p.id), { id: p.id, name: p.name, avatar: '', email: '' });
  go2('home');
}
async function createProfile(name) {
  const p = Profiles.create(name);
  await Store.detach();
  await Store.attach(LocalBackend(p.id), { id: p.id, name: p.name, avatar: '', email: '' });
  go2('home');
  toast(`${p.name} 프로필로 시작했어요.`);
}
async function switchToProfiles() { await Store.detach(); Profiles.clearCurrent(); S.localChosen = true; go2('login'); }
async function toLogin() { await Store.detach(); S.localChosen = false; lsSet('localmode', null); Profiles.clearCurrent(); go2('login'); }
async function googleLogin() {
  try {
    await FB.load();
    S.ui.authBusy = true; S.ui.authErr = ''; render();
    const p = new firebase.auth.GoogleAuthProvider();
    try { await FB.auth.signInWithPopup(p); }
    catch (e) {
      if (e && (e.code === 'auth/popup-blocked' || e.code === 'auth/operation-not-supported-in-this-environment')) { await FB.auth.signInWithRedirect(p); return; }
      throw e;
    }
  } catch (e) { S.ui.authBusy = false; S.ui.authErr = authMsg(e); render(); }
}
async function emailAuth() {
  const email = (($('#f-email') || {}).value || '').trim(), pw = ($('#f-pw') || {}).value || '', name = (($('#f-name') || {}).value || '').trim();
  if (!email || !pw) { S.ui.authErr = '이메일과 비밀번호를 입력해 주세요.'; render(); return; }
  S.ui.authBusy = true; S.ui.authErr = ''; render();
  try {
    await FB.load();
    if (S.ui.authTab === 'signup') {
      const cred = await FB.auth.createUserWithEmailAndPassword(email, pw);
      if (name && cred.user) { await cred.user.updateProfile({ displayName: name }); S.me.name = name; renderChrome(); }
    } else await FB.auth.signInWithEmailAndPassword(email, pw);
  } catch (e) { S.ui.authBusy = false; S.ui.authErr = authMsg(e); render(); const f = $('#f-email'); if (f) f.value = email; }
}
async function pwReset() {
  const email = (($('#f-email') || {}).value || '').trim();
  if (!email) { S.ui.authErr = '비밀번호를 재설정할 이메일을 먼저 입력해 주세요.'; render(); return; }
  try { await FB.load(); await FB.auth.sendPasswordResetEmail(email); toast('비밀번호 재설정 메일을 보냈어요. 메일함을 확인해 주세요.'); }
  catch (e) { S.ui.authErr = authMsg(e); render(); }
}
async function logout() { try { await Store.detach(); await FB.auth.signOut(); } catch (e) { /* 무시 */ } S.ui.authTab = 'login'; S.ui.authErr = ''; S.route = 'login'; render(); }

/* 키보드·터치 */
document.addEventListener('keydown', e => {
  if ($('#modal')) { if (e.key === 'Escape') closeModal(); return; }
  if (S.route !== 'quiz' || !S.ses) return;
  if (e.target.closest && e.target.closest('input,textarea,select')) return;
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (/^[1-4]$/.test(e.key)) { pick(+e.key); e.preventDefault(); }
  else if (e.key === 'ArrowRight') { go(S.ses.idx + 1, 'l'); e.preventDefault(); }
  else if (e.key === 'ArrowLeft') { go(S.ses.idx - 1, 'r'); e.preventDefault(); }
  else if (e.key === 'Enter' && S.ses.mode === 'study' && S.ses.done[S.ses.idx] && S.ses.idx < S.ses.qids.length - 1) { go(S.ses.idx + 1, 'l'); e.preventDefault(); }
});
let touch = null;
document.addEventListener('touchstart', e => {
  if (S.route !== 'quiz' || S.ui.sheetOpen || $('#modal') || e.touches.length !== 1) { touch = null; return; }
  if (!e.target.closest('#qcard') || e.target.closest('.out, .qt-wrap, .fig')) { touch = null; return; }
  const t = e.touches[0]; touch = { x: t.clientX, y: t.clientY, t: now() };
}, { passive: true });
document.addEventListener('touchend', e => {
  if (!touch || S.route !== 'quiz' || !S.ses) return;
  const t = e.changedTouches[0], dx = t.clientX - touch.x, dy = t.clientY - touch.y, dt = now() - touch.t;
  touch = null;
  if (Math.abs(dx) > 70 && Math.abs(dx) > Math.abs(dy) * 1.8 && dt < 700) { if (dx < 0) go(S.ses.idx + 1, 'l'); else go(S.ses.idx - 1, 'r'); }
}, { passive: true });
document.addEventListener('visibilitychange', () => { if (document.hidden) Store.flush(); });
window.addEventListener('pagehide', () => Store.flush());

/* ================= 시작 ================= */
async function boot(hot) {
  S.ui.unitMode = ['study', 'exam', 'read'].includes(lsGet('umode')) ? lsGet('umode') : 'study';
  if (hot && hot.ses) S.ses = sanitizeSes(hot.ses);
  if (hot && hot.route && hot.route !== 'login') { S.route = hot.route === 'result' ? 'home' : hot.route; if (hot.unit) S.ui.unit = hot.unit; }
  if (S.route === 'quiz' && !S.ses) S.route = 'home';
  migrateV1();
  Store.onRemote = () => { if (S.route !== 'quiz') render(); else renderChrome(); };
  render();
  if (S.route === 'quiz') startTick();

  const C = window.claude;
  if (C && typeof C.use === 'function') {
    try {
      const [user, db] = await Promise.all([C.use('user').catch(() => null), C.use('db').catch(() => null)]);
      const me = user ? await user.me() : null;
      if (db && me && me.id) {
        const base = 'data/users/' + me.id;
        await Store.attach(DocBackend('claude', db, { prog: base + '/progress', ses: base + '/session', atts: base + '/profile/attempts' }), { id: me.id, name: me.name || '', avatar: me.avatarUrl || '', email: '' });
        if (S.route !== 'quiz') render(); else renderChrome();
        return;
      }
    } catch (e) { /* 아래 기기 저장으로 */ }
  }
  if (FB.cfg) {
    try {
      await FB.load();
      if (lsGet('localmode')) {
        S.localChosen = true;
        const cur = Profiles.current();
        if (cur) { await Store.attach(LocalBackend(cur.id), { id: cur.id, name: cur.name, avatar: '', email: '' }); if (S.route !== 'quiz') render(); else renderChrome(); }
        else { S.route = 'login'; render(); }
      }
      FB.auth.onAuthStateChanged(onFbUser);
      return;
    } catch (e) { toast('로그인 기능을 불러오지 못해 이 기기 저장으로 시작해요.'); S.localChosen = true; }
  }
  const cur = Profiles.current();
  if (cur) {
    await Store.attach(LocalBackend(cur.id), { id: cur.id, name: cur.name, avatar: '', email: '' });
    if (S.route !== 'quiz') render(); else renderChrome();
  } else { S.route = 'login'; render(); }
}
try { window.claude && window.claude.hot && window.claude.hot.snapshot && window.claude.hot.snapshot(() => ({ route: S.route, ses: S.ses, unit: S.ui.unit })); } catch (e) { /* 없음 */ }
const start = data => boot(data || {});
if (window.claude && window.claude.hot && window.claude.hot.ready) window.claude.hot.ready(start);
else start((window.claude && window.claude.hot && window.claude.hot.data) || {});
})();

</script>
