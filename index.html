<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>ADsP 합격 CBT</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400..900&display=swap">
<style>
/* ADsP 합격 CBT — 휴대폰 기준으로 먼저 짜고, 861px 이상에서 넓힌다 */
:root{
  --bg:#F2F5F3; --card:#FFFFFF; --card-2:#F7F9F8; --sunk:#EAEFEC;
  --ink:#121A17; --ink-2:#46534D; --ink-3:#77847E; --line:#E0E6E2; --line-2:#C9D2CD;
  --pine:#1D4D3F; --pine-2:#2E7F63; --on-pine:#FFFFFF; --pine-tint:#E2EEE8;
  --ok:#1B7A51; --on-ok:#FFFFFF; --ok-tint:#E1F2E8;
  --bad:#C2333E; --on-bad:#FFFFFF; --bad-tint:#FBE8E9;
  --flag:#A86A00; --flag-tint:#FBEFD6;
  --shadow:0 1px 2px rgba(16,36,28,.05),0 10px 30px rgba(16,36,28,.10);
  --font:"Pretendard Variable",Pretendard,"Noto Sans KR",-apple-system,BlinkMacSystemFont,system-ui,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
  --qs:1;
  --nav-h:60px;
  --r:14px;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D1412; --card:#151E1B; --card-2:#19241F; --sunk:#1E2925;
    --ink:#E4ECE8; --ink-2:#B1BDB7; --ink-3:#85928C; --line:#26332E; --line-2:#36453F;
    --pine:#6AC59C; --pine-2:#8BD6B2; --on-pine:#0D1412; --pine-tint:#1A2D25;
    --ok:#5BC98F; --on-ok:#0D1412; --ok-tint:#16301F;
    --bad:#FF7C85; --on-bad:#0D1412; --bad-tint:#3A1A1F;
    --flag:#E8B451; --flag-tint:#33290F;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 12px 32px rgba(0,0,0,.35);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D1412; --card:#151E1B; --card-2:#19241F; --sunk:#1E2925;
  --ink:#E4ECE8; --ink-2:#B1BDB7; --ink-3:#85928C; --line:#26332E; --line-2:#36453F;
  --pine:#6AC59C; --pine-2:#8BD6B2; --on-pine:#0D1412; --pine-tint:#1A2D25;
  --ok:#5BC98F; --on-ok:#0D1412; --ok-tint:#16301F;
  --bad:#FF7C85; --on-bad:#0D1412; --bad-tint:#3A1A1F;
  --flag:#E8B451; --flag-tint:#33290F;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 12px 32px rgba(0,0,0,.35);
  color-scheme:dark;
}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.6;letter-spacing:-.01em;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;font-feature-settings:"tnum" 1;word-break:keep-all;overflow-wrap:break-word}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--card)}
button,input{font:inherit;color:inherit;letter-spacing:inherit}
button{touch-action:manipulation}
img,svg{max-width:100%}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--pine-2);outline-offset:2px;border-radius:8px}
.wrap{width:100%;max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.muted{color:var(--ink-3)}
.small{font-size:13px;margin:8px 0 0}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

/* ---------- 상단·하단 탐색 ---------- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--card);border-bottom:1px solid var(--line)}
.top-in{display:flex;align-items:center;gap:16px;min-height:56px}
.brand{display:flex;align-items:center;gap:10px;background:none;border:0;padding:0;font-weight:800;font-size:17px;letter-spacing:-.02em;cursor:pointer;white-space:nowrap}
.brand-mark{display:inline-flex;gap:3px;align-items:center;padding:6px 7px;border-radius:9px;background:var(--pine)}
.brand-mark i{width:6px;height:9px;border-radius:50%;border:1.5px solid var(--on-pine);opacity:.85}
.brand-mark i:first-child{background:var(--on-pine);opacity:1}
.brand-mark.big{padding:10px 12px;border-radius:14px;gap:5px;margin-bottom:6px;align-self:flex-start}
.brand-mark.big i{width:10px;height:15px;border-width:2px}
.tnav{display:none;gap:2px;flex:1;min-width:0}
.tnav button{background:none;border:0;padding:17px 12px 15px;font-weight:600;font-size:15px;color:var(--ink-3);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap}
.tnav button[aria-current="page"]{color:var(--ink);border-bottom-color:var(--pine)}
.tnav button:hover{color:var(--ink)}
.tnav .cnt{font-size:11px;font-weight:700;background:var(--bad);color:var(--on-bad);border-radius:99px;padding:1px 6px;margin-left:5px;vertical-align:2px}
.who{margin-left:auto;display:flex;align-items:center;gap:8px;background:none;border:1px solid var(--line);border-radius:99px;padding:3px 10px 3px 3px;cursor:pointer;max-width:200px;min-height:40px}
.av{width:32px;height:32px;border-radius:50%;flex:none;object-fit:cover;background:var(--sunk)}
.av.ini{display:inline-grid;place-items:center;background:var(--pine-tint);color:var(--pine);font-weight:700;font-size:14px}
.av.lg{width:48px;height:48px;font-size:20px}
.who-t{display:flex;flex-direction:column;line-height:1.2;min-width:0;text-align:left}
.who-t b{font-size:13.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who-t small{display:none;font-size:11px;color:var(--ink-3);white-space:nowrap}
.bnav{position:fixed;left:0;right:0;bottom:0;z-index:35;display:flex;background:var(--card);border-top:1px solid var(--line);padding:4px max(6px,env(safe-area-inset-right,0px)) env(safe-area-inset-bottom,0px) max(6px,env(safe-area-inset-left,0px))}
.bnav button{flex:1;position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;background:none;border:0;padding:6px 0 7px;min-height:var(--nav-h);justify-content:center;font-size:11.5px;font-weight:600;color:var(--ink-3);cursor:pointer}
.bnav svg{width:24px;height:24px}
.bnav button[aria-current="page"]{color:var(--pine)}
.bnav button[aria-current="page"] svg{stroke-width:2.2}
.bnav .dot{position:absolute;top:4px;left:calc(50% + 6px);font-style:normal;font-size:10px;font-weight:700;line-height:16px;min-width:16px;padding:0 4px;border-radius:99px;background:var(--bad);color:var(--on-bad)}

/* ---------- 페이지 ---------- */
main.page{padding-block:20px calc(var(--nav-h) + 40px)}
body.in-login main.page{padding-bottom:40px}
.page-h{margin-bottom:16px}
.page-h h1,.auth h1{font-size:24px;line-height:1.3;font-weight:800;letter-spacing:-.025em;margin:0;text-wrap:balance}
.lead{color:var(--ink-2);margin:6px 0 0;font-size:15px;max-width:62ch}
.back{display:inline-flex;align-items:center;gap:2px;background:none;border:0;padding:6px 6px 6px 0;margin:-4px 0 6px;color:var(--ink-2);font-weight:600;font-size:14px;cursor:pointer}
.back svg{width:18px;height:18px}
h2.sec{font-size:13px;font-weight:700;color:var(--ink-3);letter-spacing:.02em;margin:28px 0 10px;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.sec-n{font-weight:500;color:var(--ink-3)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r)}
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.panel + .panel{margin-top:10px}
.empty{background:var(--card);border:1px dashed var(--line-2);border-radius:var(--r);padding:18px;color:var(--ink-2);font-size:15px}
.empty b{display:block;color:var(--ink);margin-bottom:2px}
.banner{background:var(--flag-tint);border:1px solid color-mix(in srgb,var(--flag) 30%,transparent);border-radius:12px;padding:10px 14px;font-size:14px;margin:0 0 14px;color:var(--ink)}
.banner.row{display:flex}
.foot{margin-top:32px;color:var(--ink-3);font-size:13px;line-height:1.65;max-width:72ch}

/* ---------- 버튼·칩 ---------- */
.btn{appearance:none;display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:46px;padding:10px 16px;border-radius:12px;border:1px solid var(--line-2);background:var(--card);color:var(--ink);font-weight:700;font-size:15px;line-height:1.2;cursor:pointer;white-space:nowrap;text-decoration:none}
.btn:hover{border-color:var(--ink-3)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--pine);border-color:var(--pine);color:var(--on-pine)}
.btn.primary:hover{filter:brightness(1.06)}
.btn.quiet{background:transparent;border-color:transparent;color:var(--ink-2)}
.btn.quiet:hover{background:var(--sunk)}
.btn.sm{min-height:38px;padding:7px 12px;font-size:14px;border-radius:10px}
.btn.block{width:100%}
.btn.danger{color:var(--bad)}
.btn.danger-fill{background:var(--bad);border-color:var(--bad);color:var(--on-bad)}
.btn[disabled]{opacity:.42;cursor:not-allowed;transform:none}
.btn svg{width:18px;height:18px;flex:none}
.btn .n{font-size:12.5px;font-weight:700;opacity:.75;margin-left:2px}
.icon-btn{display:inline-grid;place-items:center;width:42px;height:42px;border-radius:12px;border:0;background:none;color:var(--ink-2);cursor:pointer;flex:none}
.icon-btn:hover{background:var(--sunk)}
.icon-btn svg{width:22px;height:22px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;color:var(--ink-2);background:var(--sunk);border-radius:7px;padding:3px 8px;white-space:nowrap;line-height:1.5}
.chip.lvc b{font-weight:700}
.chip.sup{color:var(--flag);background:var(--flag-tint);font-weight:700}
.exp .sup-note{margin-top:10px;padding:9px 12px;border-radius:10px;background:var(--flag-tint);color:var(--ink);font-size:calc(14px * var(--qs));line-height:1.6}
.exp .sup-note b{display:block;color:var(--flag);font-size:12.5px;font-weight:800;margin-bottom:2px}
.lv{display:inline-flex;align-items:center;gap:2px;vertical-align:middle}
.lv i{width:4px;height:11px;border-radius:1px;background:var(--line-2)}
.lv[data-lv="5"] i:nth-child(-n+5),.lv[data-lv="4"] i:nth-child(-n+4),.lv[data-lv="3"] i:nth-child(-n+3),.lv[data-lv="2"] i:nth-child(-n+2),.lv[data-lv="1"] i:nth-child(-n+1){background:var(--pine)}
.seg{display:flex;gap:4px;background:var(--sunk);border-radius:13px;padding:4px;margin:0 0 14px;overflow-x:auto;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:1;min-width:max-content;border:0;background:none;border-radius:10px;padding:10px 12px;font-weight:700;font-size:14.5px;color:var(--ink-3);cursor:pointer;white-space:nowrap}
.seg button[aria-selected="true"],.seg button[aria-checked="true"]{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.seg button .n{font-size:12px;margin-left:5px;opacity:.7}
.seg.small{margin-bottom:8px}
.seg.small button{padding:8px 10px;font-size:14px}
.seg-note{margin:0 0 14px;color:var(--ink-3);font-size:13.5px}
.pick,.chips-row{display:flex;gap:6px;flex-wrap:wrap}
.chips-row{margin:0 0 12px}
.pick button,.chips-row button{border:1px solid var(--line-2);background:var(--card);border-radius:99px;padding:8px 14px;font-size:14px;font-weight:600;cursor:pointer;color:var(--ink-2);min-height:38px}
.pick button[aria-pressed="true"],.chips-row button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--card)}

/* ---------- 홈 ---------- */
.hero{background:var(--pine);color:var(--on-pine);border-radius:18px;padding:18px 18px 16px;position:relative;overflow:hidden}
.hero-top{display:flex;align-items:center;gap:14px}
.dday{font-size:34px;line-height:1;font-weight:800;letter-spacing:-.03em;background:rgba(255,255,255,.14);border-radius:12px;padding:10px 12px;white-space:nowrap}
.hero-k{margin:0;font-size:13px;opacity:.85;font-weight:600}
.hero h1{margin:2px 0 0;font-size:20px;line-height:1.3;font-weight:800;letter-spacing:-.025em}
.goal{display:grid;gap:7px;margin:16px 0 0}
.goal div{display:grid;grid-template-columns:44px minmax(0,1fr) 44px;gap:8px;align-items:center;font-size:13px;font-weight:600}
.goal b{text-align:right;font-weight:700}
.dots{display:flex;gap:2px;flex-wrap:nowrap;overflow:hidden}
.dots i{flex:1 1 0;max-width:10px;min-width:3px;height:12px;border-radius:99px;border:1.3px solid rgba(255,255,255,.55)}
.dots i.on{background:#fff;border-color:#fff}
.hero-note{margin:12px 0 0;font-size:12.5px;opacity:.85}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .hero{background:#173A30;color:#E8F3EE}}
:root[data-theme="dark"] .hero{background:#173A30;color:#E8F3EE}
.resume{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:12px;background:var(--card);border:1.5px solid var(--pine);border-radius:var(--r);padding:12px 14px}
.resume > div:first-child{flex:1;min-width:180px}
.resume b{display:block;font-size:15px}
.resume small{color:var(--ink-2);font-size:13px}
.quick{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:12px}
.qa{display:flex;flex-direction:column;align-items:flex-start;gap:3px;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;cursor:pointer;min-height:112px}
.qa:hover{border-color:var(--line-2)}
.qa[aria-disabled="true"]{opacity:.6}
.qa-i{display:inline-grid;place-items:center;width:38px;height:38px;border-radius:11px;background:var(--pine-tint);color:var(--pine);margin-bottom:6px}
.qa-i svg{width:22px;height:22px}
.qa b{font-size:15.5px;font-weight:800}
.qa small{font-size:12.5px;color:var(--ink-3);line-height:1.45}
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;min-width:0}
.kpi small{display:block;color:var(--ink-3);font-size:12.5px;font-weight:600}
.kpi b{display:block;font-size:24px;line-height:1.3;font-weight:800;letter-spacing:-.02em;margin-top:2px}
.kpi b em{font-style:normal;font-size:13px;color:var(--ink-3);font-weight:600;margin-left:2px}
.bars{display:flex;flex-direction:column;gap:14px}
.bar-row{display:grid;grid-template-columns:minmax(0,1fr) 64px;grid-template-areas:"l v" "b b";gap:6px 10px;align-items:end}
.bar-row .bl{grid-area:l;font-size:14.5px;font-weight:700;min-width:0}
.bar-row .bl small{display:inline;font-weight:500;color:var(--ink-3);font-size:12.5px;margin-left:6px}
.bar-row .bv{grid-area:v;font-size:14px;font-weight:800;text-align:right;white-space:nowrap;line-height:1.25}
.bar-row .bv small{display:block;font-weight:500;color:var(--ink-3);font-size:11.5px}
.bar{grid-area:b;position:relative;height:10px;background:var(--sunk);border-radius:99px}
.bar i{position:absolute;left:0;top:0;bottom:0;border-radius:99px;background:var(--pine)}
.bar i.low{background:var(--bad)}
.bar .mk{position:absolute;top:-3px;bottom:-3px;width:2px;border-radius:2px;background:var(--ink-3);opacity:.6}

/* ---------- 단원별 ---------- */
.subj-sum{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:0 0 10px}
.subj-sum > div{flex:1;min-width:180px}
.subj-sum b{display:block;font-size:16px;font-weight:800}
.subj-sum small{color:var(--ink-3);font-size:13px}
.list{display:flex;flex-direction:column;background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.urow{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:14px 12px 14px 16px;cursor:pointer;min-height:72px}
.urow:first-child{border-top:0}
.urow:hover{background:var(--card-2)}
.urow.static{cursor:default;opacity:.75}
.urow .ut{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.urow .ut b{font-size:15.5px;font-weight:700;line-height:1.35}
.urow .ut small{color:var(--ink-3);font-size:12.5px;line-height:1.4}
.urow .ut small em{font-style:normal;color:var(--bad);font-weight:600}
.ubar{display:block;height:4px;border-radius:99px;background:var(--sunk);overflow:hidden;margin-top:4px;max-width:240px}
.ubar i{display:block;height:100%;background:var(--pine);border-radius:99px}
.chev{color:var(--ink-3);display:grid;place-items:center}
.chev svg{width:18px;height:18px}
.rand{display:flex;flex-direction:column;gap:14px}
.rand .lab{display:block;font-size:12.5px;color:var(--ink-3);font-weight:600;margin-bottom:6px}
.ustats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:0 0 14px}
.ustats div{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.ustats b{display:block;font-size:20px;font-weight:800;line-height:1.3}
.ustats b em{font-style:normal;font-size:12.5px;color:var(--ink-3);font-weight:600;margin-left:1px}
.ustats b.red{color:var(--bad)}
.ustats small{color:var(--ink-3);font-size:12px;font-weight:600}
.uacts{display:flex;flex-direction:column;gap:8px}
.uacts-3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.btn2{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:58px;border:1px solid var(--line-2);border-radius:12px;background:var(--card);cursor:pointer;padding:6px 4px;line-height:1.3}
.btn2:hover{border-color:var(--ink-3)}
.btn2 b{font-size:14.5px;font-weight:700}
.btn2 small{font-size:12px;color:var(--ink-3);font-weight:600}
.btn2[disabled]{opacity:.42;cursor:not-allowed}
.cn{display:inline-grid;place-items:center;width:1.3em;height:1.3em;border-radius:50%;border:1.5px solid currentColor;font-size:.8em;font-weight:800;line-height:1;vertical-align:.1em;margin:0 1px;font-variant-numeric:tabular-nums}
.qlist{list-style:none;margin:0;padding:0;background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.qlist li + li{border-top:1px solid var(--line)}
.qrow{display:grid;grid-template-columns:26px 22px minmax(0,1fr) auto;gap:8px;align-items:center;width:100%;text-align:left;background:none;border:0;padding:12px 14px;cursor:pointer;min-height:64px}
.qrow:hover{background:var(--card-2)}
.qrow .qn{font-size:13px;font-weight:700;color:var(--ink-3);text-align:right}
.mk svg{width:22px;height:22px;display:block}
.mk-ok{stroke:var(--ok)}.mk-bad{stroke:var(--bad)}.mk-none{fill:var(--line-2)}
.qrow .qt{min-width:0}
.qrow .qt b{display:block;font-size:14.5px;font-weight:700;line-height:1.35}
.qrow .qt small{display:block;color:var(--ink-3);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qrow .qm{display:flex;align-items:center;gap:6px}
.qrow .qm em{font-style:normal;font-size:12px;font-weight:700;color:var(--bad)}
.star-on{color:var(--flag);display:grid}
.star-on svg{width:16px;height:16px;fill:currentColor}

/* ---------- 모의고사 ---------- */
.mocks{display:grid;grid-template-columns:1fr;gap:10px}
.mock{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:center}
.mock-t{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.mock h3{margin:0;font-size:17px;font-weight:800;letter-spacing:-.02em}
.mock p{margin:0;font-size:13px;color:var(--ink-3);grid-column:1}
.mock .btn{grid-column:2;grid-row:1/span 2}
.mock .best{font-size:12.5px;font-weight:700;color:var(--ink-3)}
.mock .best.pass{color:var(--ok)}.mock .best.fail{color:var(--bad)}
.mock.rand{background:var(--card-2)}
.att{list-style:none;margin:0;padding:0;background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.att li + li{border-top:1px solid var(--line)}
.att button{width:100%;display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:12px 16px;background:none;border:0;cursor:pointer;text-align:left;min-height:62px}
.att button:hover{background:var(--card-2)}
.att .t b{display:block;font-weight:700;font-size:14.5px}
.att .t small{color:var(--ink-3);font-size:12px}
.att .s{font-weight:800;font-size:16px;text-align:right;white-space:nowrap;line-height:1.25}
.att .s small{display:block;font-weight:500;font-size:11.5px;color:var(--ink-3)}
.pill{font-size:12px;font-weight:800;padding:3px 8px;border-radius:7px;white-space:nowrap}
.pill.pass{background:var(--ok-tint);color:var(--ok)}.pill.fail{background:var(--bad-tint);color:var(--bad)}

/* ---------- 대화상자·알림 (휴대폰에서는 아래에서 올라오는 시트) ---------- */
.scrim{position:fixed;inset:0;z-index:60;background:rgba(8,16,12,.45);display:flex;align-items:flex-end;justify-content:center}
.dlg{background:var(--card);width:100%;max-height:92dvh;overflow:auto;border-radius:20px 20px 0 0;padding:20px max(18px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));box-shadow:var(--shadow);animation:up .2s ease}
@keyframes up{from{transform:translateY(24px);opacity:.6}}
.dlg h2{margin:0;font-size:20px;font-weight:800;letter-spacing:-.02em;line-height:1.35}
.dlg .sub{margin:6px 0 0;color:var(--ink-2);font-size:15px}
.dlg .acts{display:flex;justify-content:flex-end;gap:8px;margin-top:18px;flex-wrap:wrap}
.dlg .acts .btn{flex:1}
.who-head{display:flex;align-items:center;gap:12px;margin-bottom:6px}
.modes{display:flex;flex-direction:column;gap:8px;margin:16px 0 0;border:0;padding:0}
.modes legend{font-size:12.5px;color:var(--ink-3);font-weight:700;margin-bottom:6px;padding:0}
.mode{display:flex;gap:12px;align-items:flex-start;border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer}
.mode:has(input:checked){border-color:var(--pine);background:var(--pine-tint)}
.mode input{margin:3px 0 0;accent-color:var(--pine);width:18px;height:18px;flex:none}
.mode b{display:block;font-size:15.5px}
.mode small{display:block;color:var(--ink-2);font-size:13.5px;line-height:1.45}
.toast{position:fixed;left:50%;bottom:calc(var(--nav-h) + 18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:70;background:var(--ink);color:var(--card);padding:11px 16px;border-radius:12px;font-size:14.5px;font-weight:600;box-shadow:var(--shadow);width:max-content;max-width:calc(100% - 32px);text-align:center}
body.in-quiz .toast{bottom:calc(84px + env(safe-area-inset-bottom,0px))}
body.in-login .toast{bottom:calc(24px + env(safe-area-inset-bottom,0px))}

/* ---------- 풀이 화면 ---------- */
.qbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--card);border-bottom:1px solid var(--line)}
.qbar-in{display:flex;align-items:center;gap:6px;min-height:56px;padding-left:max(8px,env(safe-area-inset-left,0px))}
.qbar .ttl{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.25}
.qbar .ttl b{font-size:15px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qbar .ttl small{color:var(--ink-3);font-size:12.5px;font-weight:600}
.timer{font-size:15px;font-weight:800;padding:6px 10px;border-radius:10px;background:var(--sunk);white-space:nowrap;font-variant-numeric:tabular-nums}
.timer.warn{background:var(--flag-tint);color:var(--flag)}
.wide-only{display:none!important}
.prog{height:3px;background:var(--sunk)}
.prog i{display:block;height:100%;width:0;background:var(--pine);transition:width .2s}
main.qgrid{display:block;padding-block:12px calc(96px + env(safe-area-inset-bottom,0px))}
.qcard{padding:16px 16px 18px;border-radius:16px}
.qcard.in-l{animation:inl .18s ease}.qcard.in-r{animation:inr .18s ease}
@keyframes inl{from{opacity:.4;transform:translateX(14px)}}
@keyframes inr{from{opacity:.4;transform:translateX(-14px)}}
.qhead{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.qno{display:inline-grid;place-items:center;min-width:32px;height:28px;padding:0 8px;border-radius:9px;background:var(--pine);color:var(--on-pine);font-weight:800;font-size:14px}
.qtools{margin-left:auto;display:flex;gap:6px}
.tool{display:inline-grid;place-items:center;width:38px;height:38px;border:1px solid var(--line);background:var(--card);border-radius:11px;color:var(--ink-3);cursor:pointer}
.tool svg{width:19px;height:19px}
.tool.star[aria-pressed="true"]{color:var(--flag);border-color:color-mix(in srgb,var(--flag) 45%,transparent);background:var(--flag-tint)}
.tool.star[aria-pressed="true"] svg{fill:currentColor}
.tool.flag[aria-pressed="true"]{color:var(--card);background:var(--ink);border-color:var(--ink)}
.stem{font-size:calc(17.5px * var(--qs));line-height:1.65;margin:0;font-weight:700;letter-spacing:-.015em;word-break:keep-all;overflow-wrap:anywhere}
.stem code,.ot code,.ox code,.exp code{font-family:var(--mono);font-size:.86em;background:var(--sunk);padding:1px 5px;border-radius:5px;font-weight:500}
.out{margin:14px 0 2px;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--card-2)}
.out-lab{display:block;font-size:11.5px;font-weight:700;color:var(--ink-3);padding:6px 12px;border-bottom:1px solid var(--line);letter-spacing:.03em}
.out pre{margin:0;padding:12px;overflow-x:auto;font:500 calc(12.5px * var(--qs))/1.55 var(--mono);color:var(--ink);-webkit-overflow-scrolling:touch}
.qt-wrap{overflow-x:auto;margin:14px 0 2px}
table.qt{border-collapse:collapse;font-size:calc(14.5px * var(--qs));min-width:min(100%,320px)}
table.qt th,table.qt td{border:1px solid var(--line-2);padding:7px 12px;text-align:center;white-space:nowrap}
table.qt th{background:var(--card-2);font-weight:700}
table.qt td:first-child{text-align:left}
.fig{margin:14px 0 2px;max-width:440px}
.fig svg{display:block;width:100%;height:auto}
.fig text{font-family:var(--font);fill:var(--ink-2)}
.fig .ax{stroke:var(--ink-3);stroke-width:1}
.fig .ln{stroke:var(--ink);stroke-width:1.6;fill:none}
.fig .box{fill:var(--pine-tint);stroke:var(--ink);stroke-width:1.6}
.fig .cut{stroke:var(--bad);stroke-width:1.5;stroke-dasharray:5 4}
.fig .cutl{fill:var(--bad);font-weight:700}
.fig .pt{fill:var(--card);stroke:var(--ink);stroke-width:1.6}
.fig .cell{fill:var(--card-2);stroke:var(--line-2);stroke-width:1}
.fig .qn{font-size:26px;font-weight:800;fill:var(--ink)}
.fig .lab{font-size:12px;fill:var(--ink-3)}
.opts{list-style:none;margin:16px 0 0;padding:0;display:flex;flex-direction:column;gap:8px}
.opt{width:100%;display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:10px;align-items:start;text-align:left;border:1.5px solid var(--line);background:var(--card);border-radius:14px;padding:12px 12px 12px 12px;min-height:54px;cursor:pointer;font-size:calc(16px * var(--qs));line-height:1.55;font-weight:500;color:var(--ink);word-break:keep-all;overflow-wrap:anywhere}
.opt:hover{border-color:var(--line-2)}
.opt .bub{width:28px;height:28px;border-radius:50%;border:1.5px solid var(--ink-3);display:grid;place-items:center;font-size:13.5px;font-weight:800;color:var(--ink-2)}
.opt .ot{padding-top:1px}
.opt .tag{font-size:11.5px;font-weight:800;border-radius:7px;padding:2px 7px;margin-top:3px;white-space:nowrap}
.opt.sel{border-color:var(--ink);background:var(--card-2)}
.opt.sel .bub{background:var(--ink);border-color:var(--ink);color:var(--card)}
.opt.right{border-color:var(--ok);background:var(--ok-tint)}
.opt.right .bub{background:var(--ok);border-color:var(--ok);color:var(--on-ok)}
.opt.right .tag{background:var(--ok);color:var(--on-ok)}
.opt.wrong{border-color:var(--bad);background:var(--bad-tint)}
.opt.wrong .bub{background:var(--bad);border-color:var(--bad);color:var(--on-bad)}
.opt.wrong .tag{background:var(--bad);color:var(--on-bad)}
.opts.locked .opt{cursor:default}
.opts.locked:not(.has-x) .opt:not(.right):not(.wrong){opacity:.7}
/* 선지별 해설: 채점 뒤 각 선지 아래에 붙는다 */
.opts.has-x .opt{row-gap:8px}
.opts.has-x .opt:not(.right):not(.wrong) .bub{opacity:.55}
.opt .ox{grid-column:2/-1;display:block;padding-top:8px;border-top:1px dashed var(--line-2);font-size:calc(14.5px * var(--qs));line-height:1.65;font-weight:400;color:var(--ink-2);letter-spacing:-.005em}
.opt.right .ox,.opt.wrong .ox{color:var(--ink)}
.opt.right .ox{border-top-color:var(--ok);border-top-color:color-mix(in srgb,var(--ok) 40%,transparent)}
.opt.wrong .ox{border-top-color:var(--bad);border-top-color:color-mix(in srgb,var(--bad) 40%,transparent)}
.sr{position:absolute;width:1px;height:1px;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.exp{margin-top:16px;border-top:1px dashed var(--line-2);padding-top:14px}
.verdict{display:flex;align-items:center;gap:8px;font-weight:800;font-size:15.5px;margin-bottom:6px}
.verdict svg{width:24px;height:24px;flex:none}
.verdict.ok{color:var(--ok)}.verdict.bad{color:var(--bad)}.verdict.read{color:var(--ink-2)}
.exp p{margin:0;font-size:calc(15.5px * var(--qs));line-height:1.75;color:var(--ink);word-break:keep-all;overflow-wrap:anywhere}
.exp .ref{margin-top:10px;font-size:12.5px;color:var(--ink-3)}
.qnav{display:none;align-items:center;gap:10px;margin-top:20px}
.qnav .grow{flex:1}
.kbd{font-size:12px;color:var(--ink-3)}
.mbar{position:fixed;left:0;right:0;bottom:0;z-index:50;display:flex;gap:8px;background:var(--card);border-top:1px solid var(--line);padding:10px max(12px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
.mbar .btn{flex:1;min-height:50px;padding-inline:10px}
.mbar .btn:nth-child(2){flex:.9;color:var(--ink-2)}
/* 답안지: 휴대폰에서는 아래 시트 */
.sheet-panel{position:fixed;left:0;right:0;bottom:0;z-index:56;background:var(--card);border-radius:20px 20px 0 0;display:flex;flex-direction:column;max-height:min(78dvh,680px);transform:translateY(105%);visibility:hidden;transition:transform .22s ease,visibility 0s linear .22s;padding-bottom:env(safe-area-inset-bottom,0px);box-shadow:var(--shadow)}
.sheet-panel.open{transform:none;visibility:visible;transition:transform .22s ease}
.scrim-sheet{display:none}
.scrim-sheet.open{display:block;position:fixed;inset:0;z-index:55;background:rgba(8,16,12,.4)}
.sp-h{display:flex;align-items:center;gap:8px;padding:12px 10px 4px 18px}
.sp-h b{font-size:16px;font-weight:800}
.sp-h span{font-size:13px;color:var(--ink-3);font-weight:700;margin-right:auto}
.sp-legend{display:flex;gap:14px;padding:0 18px 8px;font-size:12px;color:var(--ink-3)}
.sp-legend span{display:inline-flex;align-items:center;gap:5px}
.lg{width:12px;height:12px;border-radius:4px;display:inline-block;border:1.5px solid var(--line-2)}
.lg.m{background:var(--ink);border-color:var(--ink)}.lg.ok{background:var(--ok);border-color:var(--ok)}.lg.bad{background:var(--bad);border-color:var(--bad)}
.lg.fl{border-radius:50%;background:var(--flag);border-color:var(--flag);width:9px;height:9px}
.sp-b{overflow-y:auto;padding:0 14px 8px;overscroll-behavior:contain}
.sp-sec{font-size:12px;font-weight:800;color:var(--ink-3);padding:10px 4px 6px}
.sp-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.cell{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;height:52px;border-radius:11px;border:1.5px solid var(--line);background:var(--card);cursor:pointer;line-height:1.15;padding:0}
.cell b{font-size:12px;font-weight:700;color:var(--ink-3)}
.cell span{font-size:15px;font-weight:800;min-height:17px}
.cell.m{background:var(--ink);border-color:var(--ink)}
.cell.m b,.cell.m span{color:var(--card)}
.cell.ok{background:var(--ok-tint);border-color:var(--ok)}
.cell.ok span{color:var(--ok)}
.cell.bad{background:var(--bad-tint);border-color:var(--bad)}
.cell.bad span{color:var(--bad)}
.cell.cur{box-shadow:0 0 0 2.5px var(--pine-2)}
.cell .fl{position:absolute;top:5px;right:5px;width:7px;height:7px;border-radius:50%;background:var(--flag)}
.sp-f{border-top:1px solid var(--line);padding:12px 16px 14px;display:flex;flex-direction:column;gap:10px}
.sp-f p{margin:0;font-size:13.5px;color:var(--ink-2);font-weight:600}

/* ---------- 결과 ---------- */
.res{display:grid;grid-template-columns:1fr;gap:10px}
.res-a{padding:18px;display:flex;flex-direction:column;gap:8px;min-width:0}
.stamp{align-self:flex-start;font-weight:900;font-size:20px;letter-spacing:.18em;padding:5px 12px 5px 16px;border:2.5px solid currentColor;border-radius:10px;transform:rotate(-3deg);margin-bottom:2px}
.stamp.pass{color:var(--ok)}.stamp.fail{color:var(--bad)}.stamp.plain{color:var(--ink-2);letter-spacing:.04em;transform:none;font-size:16px}
.score{display:flex;align-items:baseline;gap:6px}
.score b{font-size:52px;line-height:1;font-weight:900;letter-spacing:-.04em}
.score span{font-size:18px;color:var(--ink-2);font-weight:700}
.res-a .meta{font-size:14px;color:var(--ink-3);font-weight:600}
.res-a .why{margin:0;font-size:15px;color:var(--ink-2)}
.res-acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.res-acts .btn{flex:1}
.res-b{padding:16px}
.res-b h3{margin:0 0 12px;font-size:13px;color:var(--ink-3);font-weight:700}
.res + .chips-row{margin-top:18px}
.rv-list{list-style:none;margin:0;padding:0;background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.rv + .rv{border-top:1px solid var(--line)}
.rv-h{width:100%;display:grid;grid-template-columns:26px 24px minmax(0,1fr);grid-template-areas:"n m t" ". . a";gap:2px 8px;align-items:center;padding:11px 14px;background:none;border:0;cursor:pointer;text-align:left;min-height:60px}
.rv-h:hover{background:var(--card-2)}
.rv-h .n{grid-area:n;font-size:13px;font-weight:700;color:var(--ink-3);text-align:right}
.rv-h .mk{grid-area:m}
.rv-h .tt{grid-area:t;min-width:0}
.rv-h .tt b{display:block;font-weight:700;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rv-h .tt small{color:var(--ink-3);font-size:12px}
.rv-h .ab{grid-area:a;font-size:13px;font-weight:700;color:var(--ink-2);white-space:nowrap}
.rv-h .ab em{font-style:normal;color:var(--bad)}
.rv-body,.ni-body{padding:4px 14px 16px;border-top:1px dashed var(--line)}
.rv-body .qhead,.ni-body .qhead{margin:12px 0 10px}
.rv.open,.ni.open{background:var(--card)}

/* ---------- 오답 노트 ---------- */
.note-acts{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.note-acts p{margin:0;flex:1;min-width:220px;color:var(--ink-2);font-size:14px}
.block-m{width:100%}
.nl{list-style:none;margin:0;padding:0;background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.ng{font-size:12px;font-weight:800;color:var(--ink-3);padding:12px 16px 6px;background:var(--card-2);border-top:1px solid var(--line)}
.nl > .ng:first-child{border-top:0}
.ni + .ni{border-top:1px solid var(--line)}
.ni-h{width:100%;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;align-items:center;padding:12px 16px;background:none;border:0;cursor:pointer;text-align:left;min-height:62px}
.ni-h:hover{background:var(--card-2)}
.ni-h .tt{min-width:0}
.ni-h .tt b{display:block;font-weight:700;font-size:14.5px}
.ni-h .tt span{display:block;color:var(--ink-3);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ni-h .meta{font-size:12px;color:var(--ink-3);text-align:right;white-space:nowrap}
.ni-h .meta em{font-style:normal;color:var(--bad);font-weight:700}
.ni-body .row{margin-top:14px}

/* ---------- 기록 ---------- */
details.fold{padding:0}
details.fold summary{list-style:none;cursor:pointer;padding:14px 16px;font-weight:700;font-size:15px;display:flex;align-items:center;justify-content:space-between}
details.fold summary::-webkit-details-marker{display:none}
details.fold summary::after{content:"";width:9px;height:9px;border-right:2px solid var(--ink-3);border-bottom:2px solid var(--ink-3);transform:rotate(45deg);margin-top:-4px;transition:transform .15s}
details.fold[open] summary::after{transform:rotate(-135deg);margin-top:4px}
details.fold .bars{padding:2px 16px 16px}

/* ---------- 로그인 ---------- */
.login-page{max-width:460px}
.auth{padding:22px 18px 18px;display:flex;flex-direction:column;gap:10px;margin-top:8px}
.auth .lead{margin:0 0 6px}
.gbtn{gap:10px}
.gbtn svg{width:20px;height:20px}
.or{display:flex;align-items:center;gap:10px;color:var(--ink-3);font-size:13px;margin:4px 0}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
.form{display:flex;flex-direction:column;gap:10px}
.fld{display:flex;flex-direction:column;gap:5px}
.fld span{font-size:13px;font-weight:700;color:var(--ink-2)}
.fld input{width:100%;min-height:48px;border:1.5px solid var(--line-2);border-radius:12px;padding:10px 14px;background:var(--card);font-size:16px;color:var(--ink)}
.fld input:focus{outline:none;border-color:var(--pine)}
.err{margin:0;color:var(--bad);font-size:14px;font-weight:600}
.plist{list-style:none;margin:6px 0;padding:0;display:flex;flex-direction:column;gap:8px}
.plist button{width:100%;display:flex;align-items:center;gap:12px;background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:10px 12px;cursor:pointer;text-align:left;min-height:62px}
.plist button:hover{border-color:var(--pine)}
.plist .pt{flex:1;min-width:0}
.plist .pt b{display:block;font-size:15.5px}
.plist .pt small{color:var(--ink-3);font-size:12.5px}
.plist svg{width:18px;height:18px;color:var(--ink-3)}
.plist .av{width:38px;height:38px;font-size:16px}

/* ---------- 넓은 화면 ---------- */
@media (min-width:861px){
  body{font-size:15px}
  .tnav{display:flex}
  .bnav{display:none}
  .who-t small{display:block}
  .who{margin-left:0}
  main.page{padding-block:28px 64px}
  .page-h h1,.auth h1{font-size:28px}
  .hero{padding:24px 26px 20px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:0 32px;align-items:center}
  .hero-top{grid-row:1/span 2}
  .goal{margin:0}
  .hero-note{grid-column:2}
  .dday{font-size:44px;padding:12px 14px}
  .hero h1{font-size:24px}
  .quick{grid-template-columns:repeat(4,minmax(0,1fr))}
  .kpis{grid-template-columns:repeat(4,minmax(0,1fr))}
  .kpi b{font-size:28px}
  .bar-row{grid-template-columns:200px minmax(0,1fr) 72px;grid-template-areas:"l b v";align-items:center;gap:12px}
  .bar-row .bl small{display:block;margin-left:0}

  /* 풀이 화면 */

<script>window.ADSP_BANK = [{"id":"1-1-04","s":1,"c":1,"t":"형식지의 예","m":1,"n":1,"q":"다음 중 형식지에 해당하는 것은?","o":["오랜 경험으로 몸에 익힌 코치의 선수 컨디션 판단 요령","자전거를 넘어지지 않고 타는 감각","구단이 정리해 배포한 훈련 매뉴얼","숙련 요리사가 감으로 맞추는 간"],"a":3,"e":"형식지는 문서, 매뉴얼, 교과서처럼 겉으로 드러나 쉽게 전달하고 공유할 수 있는 지식입니다. 나머지는 경험으로 체화돼 말로 설명하기 어려운 암묵지입니다.","x":["코치의 판단 요령은 오랜 경험으로 몸에 밴 것이라 말이나 글로 전하기 어려운 암묵지입니다.","자전거 타는 감각은 직접 해 봐야 익힐 수 있는 대표적인 암묵지입니다.","문서로 정리해 배포한 매뉴얼은 누구나 읽고 공유할 수 있는 형식지입니다.","감으로 맞추는 간은 숙련으로 체화된 암묵지입니다."]},{"id":"1-1-06","s":1,"c":1,"t":"데이터 웨어하우스의 특징","m":2,"n":1,"q":"데이터 웨어하우스의 특징이 아닌 것은?","o":["주제 지향적(subject-oriented)","통합적(integrated)","시계열적(time-variant)","휘발적(volatile)"],"a":4,"e":"데이터 웨어하우스의 데이터는 한 번 적재되면 갱신·삭제하지 않고 읽기 위주로 쓰는 비휘발적(non-volatile) 데이터입니다. 실시간 갱신이 잦은 것은 운영 시스템(OLTP)입니다.","x":["데이터 웨어하우스의 특징입니다. 업무 처리 단위가 아니라 고객, 상품처럼 분석할 주제를 중심으로 데이터를 모읍니다.","데이터 웨어하우스의 특징입니다. 여러 운영 시스템의 데이터를 일관된 형식과 코드로 통합해 저장합니다.","데이터 웨어하우스의 특징입니다. 시간에 따른 변화를 볼 수 있도록 과거 데이터를 시점별로 쌓아 둡니다.","특징이 아닙니다. 데이터 웨어하우스는 한 번 적재한 데이터를 갱신·삭제하지 않고 읽기 위주로 쓰는 비휘발적(non-volatile) 저장소입니다."]},{"id":"1-1-07","s":1,"c":1,"t":"OLTP와 OLAP","m":3,"n":1,"q":"OLAP에 대한 설명으로 옳은 것은?","o":["주문·결제처럼 데이터를 실시간으로 입력·갱신하는 운영 시스템이다.","정규화된 테이블에서 짧은 트랜잭션을 빠르게 처리하는 데 초점을 둔다.","다차원 데이터를 여러 관점에서 분석해 의사결정을 지원한다.","데이터를 수정하고 삭제하는 작업이 대부분을 차지한다."],"a":3,"e":"OLAP(온라인 분석 처리)은 데이터 웨어하우스의 데이터를 차원별로 집계·분석해 의사결정을 돕습니다. 나머지는 데이터 갱신 위주인 OLTP(온라인 트랜잭션 처리)의 설명입니다.","x":["주문·결제를 실시간으로 입력·갱신하는 것은 OLTP(온라인 트랜잭션 처리)의 설명입니다.","정규화된 테이블에서 짧은 트랜잭션을 빠르게 처리하는 것은 OLTP의 특징입니다.","OLAP은 데이터 웨어하우스의 데이터를 차원별로 나누고 집계해 의사결정을 지원하는 분석 처리입니다.","수정·삭제 작업이 대부분인 것은 OLTP입니다. OLAP은 주로 조회와 집계를 합니다."]},{"id":"1-1-11","s":1,"c":1,"t":"NoSQL","m":0,"n":0,"q":"NoSQL에 대한 설명으로 옳지 않은 것은?","o":["Not Only SQL의 약자로 비관계형 데이터베이스를 말한다.","MongoDB, HBase, Cassandra 등이 대표적이다.","대용량·비정형 데이터를 여러 서버에 나눠 저장하고 수평으로 확장하기 쉽다.","고정된 스키마와 테이블 간 조인을 기본으로 사용한다."],"a":4,"e":"고정 스키마와 조인은 관계형 데이터베이스(RDBMS)의 특징입니다. NoSQL은 데이터 모델을 단순하게 해 유연한 스키마와 수평 확장에 강합니다.","x":["맞는 설명입니다. NoSQL은 Not Only SQL의 줄임말로, 관계형이 아닌 데이터베이스를 통틀어 부릅니다.","맞는 설명입니다. MongoDB(문서형), HBase·Cassandra(컬럼형)가 대표적인 NoSQL입니다.","맞는 설명입니다. 데이터를 여러 서버에 나눠 저장하고 서버를 늘려 확장(수평 확장)하기 쉬워 대용량·비정형 데이터에 강합니다.","틀린 설명입니다. 고정 스키마와 테이블 간 조인은 관계형 데이터베이스(RDBMS)의 특징이고, NoSQL은 스키마가 유연하고 조인을 거의 쓰지 않습니다."],"sup":"ADP 2과목(데이터 처리 기술)에 나오는 내용이에요. ADsP 공식 출제 범위의 핵심은 아니라서 참고로만 보세요."},{"id":"1-1-01","s":1,"c":1,"t":"DIKW 피라미드","m":2,"n":2,"q":"DIKW 피라미드에서 '지식(Knowledge)'에 해당하는 것은?","o":["A 마트는 연필 한 자루를 100원, B 마트는 200원에 판다.","A 마트의 연필이 B 마트보다 100원 싸다.","연필은 더 싼 A 마트에서 사야겠다.","A 마트의 다른 상품도 B 마트보다 쌀 것이다."],"a":3,"e":"가격 자체는 데이터, 두 값을 비교해 얻은 '더 싸다'는 정보입니다. 그 정보를 내 의사결정에 연결한 것이 지식이고, 다른 상품도 쌀 것이라고 넓혀 추론하는 것은 지혜(Wisdom)입니다.","x":["가공하지 않은 가격 값 그 자체라서 데이터입니다.","두 데이터를 비교해 '더 싸다'는 의미를 뽑아냈으니 정보입니다.","'더 싸다'는 정보를 '어디서 살지'라는 내 판단으로 연결했으니 지식입니다.","지식을 바탕으로 다른 상품까지 넓혀 추론한 창의적 판단이라 지혜입니다."]},{"id":"1-1-05","s":1,"c":1,"t":"데이터베이스의 특징","m":3,"n":2,"q":"데이터베이스의 일반적인 특징으로 옳지 않은 것은?","o":["고정된 데이터: 한 번 저장된 데이터는 갱신하거나 삭제하지 않는다.","통합된 데이터: 같은 내용의 데이터가 중복되지 않도록 관리한다.","저장된 데이터: 컴퓨터가 접근할 수 있는 저장 매체에 저장된다.","공용 데이터: 여러 사용자가 서로 다른 목적으로 함께 이용한다."],"a":1,"e":"데이터베이스는 새 데이터의 삽입, 기존 데이터의 갱신·삭제가 일어나도 현재의 정확한 데이터를 유지하는 '변화되는 데이터'입니다.","x":["틀린 설명입니다. 데이터베이스는 삽입·갱신·삭제가 계속 일어나도 현재의 정확한 상태를 유지하는 '변화되는 데이터'입니다.","맞는 설명입니다. 같은 데이터를 여러 곳에 중복 저장하지 않아야 값이 서로 어긋나는 문제를 막을 수 있습니다.","맞는 설명입니다. 디스크 같은 저장 매체에 저장돼 컴퓨터가 언제든 접근할 수 있습니다.","맞는 설명입니다. 하나의 데이터베이스를 여러 사용자와 응용 프로그램이 함께 씁니다."]},{"id":"1-1-10","s":1,"c":1,"t":"메타데이터","m":1,"n":2,"q":"데이터에 관한 구조화된 데이터로, 다른 데이터를 설명해 주는 데이터는?","o":["메타데이터","인덱스","레코드","트랜잭션"],"a":1,"e":"메타데이터는 데이터의 구조, 의미, 출처처럼 데이터를 설명하는 데이터입니다. 인덱스는 데이터를 빠르게 찾기 위해 레코드의 위치를 정리해 둔 구조입니다.","x":["메타데이터는 데이터의 구조, 의미, 출처, 형식처럼 다른 데이터를 설명하는 데이터(data about data)입니다.","인덱스는 데이터를 빨리 찾도록 키 값과 위치를 정리해 둔 구조입니다. 데이터를 설명하는 것이 아니라 검색을 돕습니다.","레코드는 테이블의 한 행처럼 서로 관련된 필드를 묶은 데이터 단위입니다.","트랜잭션은 계좌 이체 한 건처럼 데이터베이스의 상태를 바꾸는 하나의 논리적 작업 단위입니다."]},{"id":"1-2-10","s":1,"c":2,"t":"알고리즈미스트","m":0,"n":0,"q":"빅데이터 알고리즘 때문에 부당하게 피해를 입은 사람을 구제하기 위해, 알고리즘과 코딩을 해석하는 일을 맡는 전문 인력은?","o":["데이터 엔지니어","알고리즈미스트(algorithmist)","데이터 사이언티스트","데이터 아키텍트"],"a":2,"e":"데이터 오용을 막는 통제 방안이 '알고리즘 접근 허용'이고, 그 역할을 맡는 전문가가 알고리즈미스트입니다.","x":["데이터 엔지니어는 데이터를 수집·저장·처리하는 파이프라인과 인프라를 만드는 사람입니다.","알고리즈미스트는 알고리즘과 코드를 해석해 알고리즘 때문에 부당한 피해를 입은 사람을 구제하는 전문가로, 데이터 오용의 통제 방안(알고리즘 접근 허용)을 맡습니다.","데이터 사이언티스트는 데이터를 분석해 가치와 통찰을 이끌어 내는 사람으로, 피해 구제가 주 역할이 아닙니다.","데이터 아키텍트는 데이터의 구조와 표준, 저장 체계를 설계하는 사람입니다."]},{"id":"1-1-02","s":1,"c":1,"t":"암묵지와 형식지의 상호작용","m":2,"n":3,"q":"개인에게 체화된 암묵지를 언어나 문서 같은 형식지로 바꾸는 과정은?","o":["공통화(Socialization)","표출화(Externalization)","연결화(Combination)","내면화(Internalization)"],"a":2,"e":"공통화는 암묵지를 경험으로 나누는 단계, 표출화는 암묵지를 형식지로 바꾸는 단계, 연결화는 형식지끼리 결합하는 단계, 내면화는 형식지를 다시 자기 것(암묵지)으로 체득하는 단계입니다.","x":["공통화는 함께 일하고 경험하며 암묵지를 다른 사람의 암묵지로 나누는 과정입니다. 형식지로 바뀌지 않습니다.","개인의 암묵지를 말, 글, 매뉴얼 같은 형식지로 드러내는 과정이 표출화입니다.","연결화는 이미 형식지가 된 지식끼리 결합해 새로운 형식지를 만드는 과정입니다.","내면화는 형식지를 읽고 실천하며 다시 자기 것(암묵지)으로 익히는 과정으로, 방향이 반대입니다."]},{"id":"1-1-03","s":1,"c":1,"t":"정성적 데이터","m":3,"n":3,"q":"정성적 데이터에 대한 설명으로 옳은 것은?","o":["수치나 기호로 표현되어 저장·검색·분석이 쉽다.","지역별 기온과 강수량이 대표적인 예이다.","항상 정해진 형식의 표로 저장된다.","언어나 문자로 표현되어 저장·검색·분석에 비용이 많이 든다."],"a":4,"e":"선수 인터뷰나 설문 서술형 응답처럼 언어·문자로 된 데이터가 정성적 데이터입니다. 수치·기호로 된 정량적 데이터보다 다루기 어렵고 비용이 많이 듭니다.","x":["정량적 데이터에 대한 설명입니다. 수치나 기호로 되어 있어 저장·검색·분석이 쉽습니다.","기온과 강수량은 숫자로 측정한 정량적 데이터입니다.","정성적 데이터는 인터뷰나 서술형 응답처럼 형태가 일정하지 않아, 정해진 형식의 표에 담기 어려운 경우가 많습니다.","정성적 데이터는 언어·문자로 되어 있어 형태가 제각각이라 저장·검색·분석에 시간과 비용이 많이 듭니다."]},{"id":"1-1-08","s":1,"c":1,"t":"기업 내부 데이터베이스 솔루션","m":1,"n":3,"q":"인사, 재무, 생산, 물류 등 기업의 경영 활동 전반을 하나의 시스템으로 통합해 관리하는 것은?","o":["CRM","SCM","KMS","ERP"],"a":4,"e":"ERP(전사적 자원 관리)의 설명입니다. CRM은 고객 관계 관리, SCM은 원자재 조달부터 고객까지의 공급망 관리, KMS는 지식 관리 시스템입니다.","x":["CRM(고객 관계 관리)은 고객 데이터를 분석해 고객을 확보하고 유지하는 데 쓰는 시스템입니다.","SCM(공급망 관리)은 원자재 조달부터 생산, 유통, 고객 전달까지의 흐름을 관리하는 시스템입니다.","KMS(지식 관리 시스템)는 조직 안의 지식을 모으고 공유하는 시스템입니다.","ERP(전사적 자원 관리)는 인사, 재무, 생산, 물류 등 경영 활동 전반을 하나의 시스템으로 통합해 관리합니다."]},{"id":"1-3-02","s":1,"c":3,"t":"데이터 사이언스의 구성 요소","m":0,"n":0,"q":"데이터 사이언스의 핵심 구성 요소에 해당하지 않는 것은?","o":["하드웨어 설계","Analytics(분석)","IT(데이터 관리)","비즈니스 분석"],"a":1,"e":"데이터 사이언스는 분석(Analytics), 데이터를 다루는 IT(데이터 관리), 그리고 비즈니스 분석이 만나는 영역입니다.","x":["구성 요소가 아닙니다. 하드웨어 설계는 데이터 사이언스의 세 영역(분석, IT, 비즈니스 분석)에 들어가지 않습니다.","구성 요소입니다. 수학, 통계, 머신러닝, 패턴 인식처럼 데이터를 분석하는 역량입니다.","구성 요소입니다. 프로그래밍, 데이터 웨어하우징, 고성능 컴퓨팅처럼 데이터를 수집·저장·처리하는 데이터 관리 영역입니다.","구성 요소입니다. 커뮤니케이션, 프레젠테이션, 스토리텔링, 시각화처럼 분석 결과를 비즈니스에 연결하는 영역입니다."]},{"id":"1-1-09","s":1,"c":1,"t":"BI와 BA","m":1,"n":4,"q":"미리 정해 둔 리포트로 과거와 현재의 성과를 보여 주는 데 그치지 않고, 통계·수학적 분석으로 미래를 예측하고 최적의 의사결정을 돕는 데 초점을 둔 것은?","o":["BA(Business Analytics)","BI(Business Intelligence)","OLTP","EAI"],"a":1,"e":"BI가 리포트 중심으로 '무슨 일이 있었는가'를 보여 준다면, BA는 통계·수학적 분석으로 '앞으로 어떻게 될까, 무엇을 해야 할까'에 답하는 데 초점을 둡니다.","x":["BA는 통계·수학적 분석으로 미래를 예측하고 최적의 의사결정을 돕는 데 초점을 둡니다.","BI는 미리 정한 리포트로 과거와 현재의 성과를 보여 주는 데 초점을 둡니다. 문제에서 '그치지 않고' 넘어선 대상이 BI입니다.","OLTP는 주문·결제처럼 데이터를 실시간으로 입력·갱신하는 운영 시스템으로, 예측이나 분석 도구가 아닙니다.","EAI(전사적 애플리케이션 통합)는 기업 안의 여러 시스템을 연결해 데이터를 주고받게 하는 통합 방식입니다."]},{"id":"1-2-01","s":1,"c":2,"t":"빅데이터 3V","m":3,"n":4,"q":"가트너가 정의한 빅데이터의 특징 3V에 해당하지 않는 것은?","o":["Volume(규모)","Value(가치)","Variety(다양성)","Velocity(속도)"],"a":2,"e":"3V는 규모(Volume), 다양성(Variety), 속도(Velocity)입니다. 가치(Value)는 여기에 더해 4V를 말할 때 들어갑니다.","x":["3V에 해당합니다. 기존 방식으로는 다루기 어려울 만큼 데이터의 양이 방대하다는 특징입니다.","3V에 해당하지 않습니다. 가치(Value)는 3V에 더해 4V를 말할 때 추가되는 요소입니다.","3V에 해당합니다. 정형 데이터뿐 아니라 텍스트, 이미지 같은 반정형·비정형 데이터까지 종류가 다양하다는 특징입니다.","3V에 해당합니다. 데이터가 빠르게 생성되고, 그만큼 빠르게 처리·분석해야 한다는 특징입니다."]},{"id":"1-2-11","s":1,"c":2,"t":"데이터 산업의 진화","m":0,"n":0,"q":"데이터 산업의 진화 과정을 순서대로 나열한 것은?","o":["데이터 처리 → 데이터 분석 → 데이터 통합 → 데이터 연결 → 데이터 권리","데이터 통합 → 데이터 처리 → 데이터 분석 → 데이터 권리 → 데이터 연결","데이터 처리 → 데이터 통합 → 데이터 연결 → 데이터 분석 → 데이터 권리","데이터 처리 → 데이터 통합 → 데이터 분석 → 데이터 연결 → 데이터 권리"],"a":4,"e":"업무를 처리하던 데이터 처리 시대에서 데이터를 한곳에 모으는 통합 시대, 빅데이터를 분석하는 분석 시대, 기업·기관 간 데이터를 잇는 연결 시대를 거쳐, 개인이 자기 데이터의 활용을 결정하는 권리 시대(마이데이터)로 진화했습니다.","x":["분석과 통합의 순서가 바뀌었습니다. 데이터를 먼저 한곳에 모아야(통합) 그다음에 분석할 수 있습니다.","처음은 업무를 전산화한 데이터 처리 시대이고, 연결 시대가 권리 시대보다 먼저입니다.","분석과 연결의 순서가 바뀌었습니다. 빅데이터 분석 시대를 지나 기관 사이 데이터를 잇는 연결 시대가 옵니다.","처리(업무 전산화) → 통합(한곳에 모음) → 분석(빅데이터 분석) → 연결(기관 간 연결) → 권리(마이데이터) 순서입니다."],"sup":"빅데이터분석기사 교재에 나오는 내용이에요. ADsP 공식 교재와 최근 기출에서는 확인되지 않아 참고로만 보세요."},{"id":"1-2-06","s":1,"c":2,"t":"빅데이터 활용 기본 테크닉","m":1,"n":5,"q":"'택배 차량을 어떻게 배치해야 가장 효율적으로 배송할 수 있을까?'를 해결하는 데 가장 적합한 빅데이터 활용 기본 테크닉은?","o":["연관 규칙 학습","유전 알고리즘","유형 분석","감정 분석"],"a":2,"e":"유전 알고리즘은 최적화가 필요한 문제를 생물의 진화(선택, 교차, 돌연변이)를 흉내 내 점진적으로 풉니다. '최대 시청률을 얻으려면 어떤 프로그램을 어느 시간대에 편성할까'도 같은 유형입니다.","x":["연관 규칙 학습은 '커피를 사는 사람이 탄산음료도 사는가?'처럼 변수 사이의 관계를 찾는 기법이라 배치 최적화 문제와 맞지 않습니다.","차량 배치처럼 가장 좋은 해를 찾는 최적화 문제는, 진화(선택·교차·돌연변이)를 흉내 내 해를 점점 개선하는 유전 알고리즘이 맞습니다.","유형 분석은 '이 사용자는 어떤 집단에 속하는가?'처럼 대상을 분류하는 기법입니다.","감정 분석은 글에 담긴 긍정·부정 같은 감정을 읽어 내는 기법입니다."]},{"id":"1-2-07","s":1,"c":2,"t":"빅데이터 활용 기본 테크닉","m":2,"n":5,"q":"빅데이터 활용 기본 테크닉과 활용 예의 연결이 옳지 않은 것은?","o":["연관 규칙 학습: 커피를 사는 사람이 탄산음료도 많이 사는가?","회귀 분석: 구매자의 나이가 구매하는 차량 종류에 어떤 영향을 주는가?","유형 분석: 새로운 환불 정책에 대한 고객의 평가는 어떤가?","소셜 네트워크 분석: 고객들 사이의 관계망에서 영향력 있는 사람은 누구인가?"],"a":3,"e":"새 정책에 대한 고객의 평가(긍정·부정)를 읽어 내는 것은 감정 분석입니다. 유형 분석은 '이 사용자는 어떤 특성을 가진 집단에 속하는가?'처럼 사용자나 문서를 분류하는 기법입니다.","x":["맞는 연결입니다. 함께 일어나는 구매 패턴을 찾는 것이 연관 규칙 학습입니다.","맞는 연결입니다. 한 변수(나이)가 다른 변수(차량 종류)에 주는 영향을 보는 것이 회귀 분석입니다.","틀린 연결입니다. 새 정책에 대한 고객의 평가를 읽어 내는 것은 감정 분석입니다. 유형 분석은 사용자나 문서를 특성에 따라 분류하는 기법입니다.","맞는 연결입니다. 관계망에서 영향력 있는 사람을 찾는 것이 소셜 네트워크 분석입니다."]},{"id":"1-2-09","s":1,"c":2,"t":"위기 요인과 통제 방안","m":3,"n":5,"q":"범죄를 저지를 가능성이 높다는 예측만으로 아직 범죄를 저지르지 않은 사람을 체포하는 상황에 해당하는 위기 요인과 통제 방안은?","o":["사생활 침해: 동의에서 책임으로","데이터 오용: 알고리즘 접근 허용","책임 원칙 훼손: 알고리즘 접근 허용","책임 원칙 훼손: 결과 기반 책임 원칙 고수"],"a":4,"e":"예측만으로 불이익을 주면 '행동한 결과에 책임진다'는 원칙이 무너집니다. 그래서 실제 행동의 결과로만 책임을 묻는 결과 기반 책임 원칙을 지켜야 합니다.","x":["사생활 침해는 개인정보가 본래 목적 밖에서 쓰여 생기는 문제입니다. 이 상황의 핵심은 행동이 아닌 예측으로 책임을 물었다는 점입니다.","데이터 오용은 분석 결과를 지나치게 믿거나 잘못 써서 생기는 피해이고, 알고리즘 접근 허용이 그 통제 방안입니다. 이 상황과는 맞지 않습니다.","위기 요인(책임 원칙 훼손)은 맞지만, 알고리즘 접근 허용은 데이터 오용의 통제 방안입니다.","예측만으로 불이익을 주는 것은 책임 원칙 훼손이고, 실제 행동의 결과로만 책임을 묻는 결과 기반 책임 원칙 고수로 막습니다."]},{"id":"1-2-03","s":1,"c":2,"t":"빅데이터의 기능(비유)","m":1,"n":6,"q":"빅데이터에 대한 비유와 설명의 연결로 옳지 않은 것은?","o":["산업혁명의 석탄·철: 사회·경제 전반에 혁명적 변화를 가져온다.","21세기의 원유: 산업의 생산성을 높이고 새로운 산업을 만든다.","렌즈: 현미경처럼 데이터로 사회와 산업을 새롭게 들여다보게 한다.","플랫폼: 한 기업이 데이터를 독점하도록 외부 접근을 막는 폐쇄형 구조이다."],"a":4,"e":"플랫폼 비유는 여러 주체가 함께 활용하도록 만든 구조물이라는 뜻입니다. 페이스북이 자사 데이터를 외부 개발자(서드 파티)가 활용하게 한 것이 대표적인 예입니다.","x":["맞는 연결입니다. 산업혁명 때 석탄과 철처럼 사회·경제 전반에 혁명적인 변화를 가져온다는 비유입니다.","맞는 연결입니다. 원유처럼 각 산업의 생산성을 높이고 기존에 없던 새로운 산업을 만들어 낸다는 비유입니다.","맞는 연결입니다. 현미경이 생물학을 바꿨듯 데이터로 사회와 산업을 새롭게 들여다보게 한다는 비유로, 구글 Ngram Viewer가 예로 나옵니다.","틀린 연결입니다. 플랫폼은 여러 주체가 함께 활용하도록 열어 둔 공동 기반이라는 뜻입니다. 페이스북이 자사 데이터를 외부 개발자에게 열어 준 것이 대표적인 예입니다."]},{"id":"1-2-04","s":1,"c":2,"t":"빅데이터가 만드는 본질적 변화","m":3,"n":6,"q":"빅데이터가 만들어 내는 본질적인 변화로 옳지 않은 것은?","o":["사전처리에서 사후처리로","표본조사에서 전수조사로","상관관계에서 인과관계로","질(quality)에서 양(quantity)으로"],"a":3,"e":"빅데이터 시대에는 이유(인과관계)를 다 밝히지 않아도 상관관계만으로 의미 있는 예측을 할 수 있게 되어, 인과관계에서 상관관계로 무게가 옮겨 갔습니다.","x":["맞는 변화입니다. 미리 정한 형식으로 가공해 모으던 방식(사전처리)에서, 일단 많이 모은 뒤 필요할 때 다양하게 조합해 쓰는 방식(사후처리)으로 바뀌었습니다.","맞는 변화입니다. 데이터 수집·처리 비용이 낮아져 표본 대신 전체 데이터를 분석할 수 있게 됐습니다.","틀린 변화입니다. 방향이 반대로, 인과관계에서 상관관계로 무게가 옮겨 갔습니다. 이유를 몰라도 상관관계만으로 쓸모 있는 예측을 할 수 있기 때문입니다.","맞는 변화입니다. 데이터가 충분히 많으면 일부 오류가 섞여도 전체 결과에 주는 영향이 작아져, 질보다 양이 중요해졌습니다."]},{"id":"1-2-08","s":1,"c":2,"t":"위기 요인과 통제 방안","m":2,"n":6,"q":"빅데이터 시대의 위기 요인과 통제 방안의 연결로 옳은 것은?","o":["사생활 침해: 동의에서 책임으로(개인정보 사용 주체가 책임지도록)","책임 원칙 훼손: 알고리즘 접근 허용","데이터 오용: 결과 기반 책임 원칙 고수","사생활 침해: 예측 결과만으로 사전에 책임을 묻는 제도 강화"],"a":1,"e":"사생활 침해는 '동의에서 책임으로', 책임 원칙 훼손은 '결과 기반 책임 원칙 고수', 데이터 오용은 '알고리즘 접근 허용(알고리즈미스트)'으로 통제합니다. 책임 원칙 훼손과 데이터 오용의 통제 방안을 서로 바꾼 선지가 함정입니다.","x":["맞는 연결입니다. 개인정보 제공자의 '동의'에 기대던 방식에서, 정보를 사용하는 주체가 책임을 지는 방식으로 바꾸는 것이 사생활 침해의 통제 방안입니다.","틀린 연결입니다. 알고리즘 접근 허용은 데이터 오용의 통제 방안이고, 책임 원칙 훼손은 결과 기반 책임 원칙 고수로 막습니다.","틀린 연결입니다. 결과 기반 책임 원칙 고수는 책임 원칙 훼손의 통제 방안이고, 데이터 오용은 알고리즘 접근 허용으로 막습니다.","틀린 연결입니다. 예측만으로 미리 책임을 묻는 것은 통제 방안이 아니라 책임 원칙 훼손이라는 위기 그 자체입니다."]},{"id":"1-2-02","s":1,"c":2,"t":"빅데이터 출현 배경","m":2,"n":7,"q":"빅데이터 출현 배경으로 가장 거리가 먼 것은?","o":["저장 기술의 발전과 저장 장치 가격의 하락","전수조사 대신 표본조사를 중시하는 분석 방식의 확산","클라우드 컴퓨팅 보편화로 데이터 처리 비용 감소","스마트폰과 SNS 확산으로 생성되는 데이터의 급증"],"a":2,"e":"빅데이터는 기술 발전으로 표본이 아닌 전체 데이터를 다룰 수 있게 되면서 등장했습니다. 표본조사에서 전수조사로 바뀐 것은 오히려 빅데이터가 만든 변화입니다.","x":["출현 배경입니다. 저장 기술이 발전하고 저장 장치 값이 싸져 방대한 데이터를 버리지 않고 쌓아 둘 수 있게 됐습니다.","거리가 멉니다. 빅데이터는 오히려 표본조사에서 전수조사로 바뀌는 변화를 이끌었습니다. 처리 기술이 좋아져 전체 데이터를 다룰 수 있게 됐기 때문입니다.","출현 배경입니다. 클라우드 컴퓨팅이 보편화되면서 대용량 데이터를 처리하는 비용이 크게 낮아졌습니다.","출현 배경입니다. 스마트폰과 SNS가 퍼지면서 사람들이 만들어 내는 데이터가 폭발적으로 늘었습니다."]},{"id":"1-2-05","s":1,"c":2,"t":"빅데이터 가치 산정의 어려움","m":1,"n":7,"q":"빅데이터의 가치를 정확히 산정하기 어려운 이유로 옳지 않은 것은?","o":["재사용·재조합 등 데이터를 활용하는 방식이 다양해졌다.","기존에 없던 새로운 가치를 만들어 낸다.","데이터 저장 비용이 꾸준히 올라 비용을 추정할 수 없다.","분석 기술이 발전해 지금은 쓸모없는 데이터도 나중에 가치가 생길 수 있다."],"a":3,"e":"가치 산정이 어려운 이유는 데이터 활용 방식의 다양화, 새로운 가치 창출, 분석 기술의 발전 세 가지입니다. 저장 비용은 오히려 크게 낮아졌습니다.","x":["맞는 이유입니다. 재사용, 재조합, 다목적 개발 등 활용 방식이 다양해져 언제 어디서 누가 쓸지 알 수 없습니다.","맞는 이유입니다. 기존에 없던 새로운 가치를 만들어 내므로 그 가치를 미리 따지기 어렵습니다.","틀린 이유입니다. 저장 비용은 오히려 크게 낮아졌습니다. 가치 산정이 어려운 이유는 활용 방식의 다양화, 새로운 가치 창출, 분석 기술의 발전입니다.","맞는 이유입니다. 분석 기술이 발전하면 지금은 쓸모없는 데이터도 나중에 큰 가치를 낼 수 있습니다."]},{"id":"1-2-12","s":1,"c":2,"t":"빅데이터 활용 3요소","m":3,"n":7,"q":"빅데이터 활용에 필요한 3요소로 옳은 것은?","o":["데이터, 자본, 인력","하드웨어, 소프트웨어, 네트워크","수집, 저장, 분석","데이터, 기술, 인력"],"a":4,"e":"모든 것의 데이터화(데이터), 진화하는 알고리즘과 인공지능(기술), 데이터 사이언티스트와 알고리즈미스트(인력)가 빅데이터 활용의 3요소입니다.","x":["자본은 3요소가 아닙니다. 데이터·인력과 함께 들어가는 것은 기술입니다.","하드웨어, 소프트웨어, 네트워크는 정보 시스템의 구성 요소에 가까운 묶음이라 빅데이터 활용 3요소가 아닙니다.","수집, 저장, 분석은 데이터를 다루는 처리 단계일 뿐 활용 3요소가 아닙니다.","데이터(모든 것의 데이터화), 기술(진화하는 알고리즘·인공지능), 인력(데이터 사이언티스트·알고리즈미스트)이 3요소입니다."]},{"id":"1-3-05","s":1,"c":3,"t":"인문학적 사고가 중요해진 이유","m":3,"n":8,"q":"데이터 사이언티스트에게 인문학적 사고가 중요해진 외부 환경의 변화로 옳지 않은 것은?","o":["저장·처리 기술이 발전해 데이터 처리 비용이 낮아짐","단순한 세계화에서 복잡한 세계화로 변화","비즈니스의 중심이 제품 생산에서 서비스로 이동","경제와 산업의 논리가 생산에서 시장 창조로 변화"],"a":1,"e":"인문학 열풍의 배경은 복잡한 세계화(컨버전스에서 디버전스로), 제품에서 서비스로의 이동, 생산에서 시장 창조로의 변화입니다. ①처럼 다른 목록(빅데이터 출현 배경)의 내용을 섞거나, 변화의 방향을 거꾸로 쓴 선지가 함정입니다.","x":["인문학적 사고가 중요해진 이유가 아닙니다. 데이터 처리 비용이 낮아진 것은 빅데이터의 출현 배경입니다. 인문학 열풍의 배경은 나머지 세 가지입니다.","맞는 설명입니다. 단순한 세계화에서 복잡한 세계화(컨버전스에서 디버전스)로 바뀌면서 다양한 사회와 문화를 이해하는 능력이 중요해졌습니다.","맞는 설명입니다. 비즈니스의 중심이 서비스로 옮겨 가면서 고객의 경험과 필요를 이해하는 능력이 중요해졌습니다.","맞는 설명입니다. 경제와 산업의 논리가 생산에서 시장 창조로 바뀌어, 사람과 문화를 이해하는 인문학적 통찰이 필요해졌습니다."]},{"id":"1-3-06","s":1,"c":3,"t":"전략 도출을 위한 가치 기반 분석","m":1,"n":8,"q":"빅데이터 분석에서 '전략 도출을 위한 가치 기반 분석'에 대한 설명으로 옳은 것은?","o":["부서 단위로 당면한 업무 문제를 해결하는 데 집중한다.","사업 성과를 이끄는 요소와 차별화 기회에 대한 전략적 인사이트를 준다.","데이터의 크기가 클수록 저절로 좋은 인사이트가 나온다.","업계 내부의 기존 경쟁자만 분석 대상으로 삼는다."],"a":2,"e":"부서 단위의 문제 해결은 일차원적 분석입니다. 가치 기반 분석은 사업 성과를 견인하는 요소와 차별화 기회를 찾고, 산업 외부의 새로운 경쟁자까지 고려합니다. 빅데이터의 핵심은 크기가 아니라 어떤 통찰을 얻느냐입니다.","x":["일차원적 분석에 대한 설명입니다. 부서 단위의 당면 문제 해결에 머물면 전략적 인사이트로 이어지지 않습니다.","가치 기반 분석은 사업 성과를 이끄는 요소와 차별화 기회를 찾아 전략적 인사이트를 줍니다.","틀린 설명입니다. 빅데이터의 핵심은 크기가 아니라 어떤 시각과 통찰을 얻느냐입니다.","틀린 설명입니다. 가치 기반 분석은 업계 내부뿐 아니라 산업 밖에서 들어오는 새로운 경쟁자와 환경 변화까지 고려합니다."]},{"id":"1-3-07","s":1,"c":3,"t":"빅데이터 회의론","m":2,"n":8,"q":"빅데이터 회의론이 생겨난 원인으로 거리가 먼 것은?","o":["데이터 분석은 의사결정에 쓸 수 없다는 사실이 증명된 점","막대한 투자에 비해 효과가 불분명하다는 의문","과거 CRM 같은 솔루션 도입 실패에서 온 부정적 학습 효과","빅데이터 성공 사례라고 소개된 것 중 상당수가 기존 분석 프로젝트였던 점"],"a":1,"e":"회의론은 투자 효과에 대한 의문, 공급자 중심 기술 유행이 남긴 부정적 학습 효과, 기존 분석 사례를 빅데이터로 포장한 경우가 많았던 점에서 생겼습니다. 분석의 가치 자체가 부정된 것은 아닙니다.","x":["거리가 멉니다. 분석이 의사결정에 쓸모없다고 증명된 적은 없습니다. 회의론은 분석 자체가 아니라 투자 효과와 과장된 사례에 대한 의심에서 나왔습니다.","원인입니다. 막대한 투자에 비해 실제 효과가 불분명하다는 의문이 회의론을 키웠습니다.","원인입니다. 과거 CRM처럼 공급자가 앞세운 솔루션을 도입했다가 효과를 못 본 경험이 부정적 학습 효과로 남았습니다.","원인입니다. 빅데이터 성공 사례로 소개된 것 중 상당수가 기존 분석 프로젝트를 빅데이터로 포장한 것이었습니다."]},{"id":"1-3-01","s":1,"c":3,"t":"데이터 사이언스의 정의","m":1,"n":9,"q":"데이터 사이언스에 대한 설명으로 옳지 않은 것은?","o":["통계학처럼 정형화된 실험 데이터의 분석에만 초점을 둔다.","데이터로부터 의미 있는 정보를 추출해 내는 학문이다.","정형 데이터뿐 아니라 텍스트, 이미지 같은 비정형 데이터도 다룬다.","분석에 그치지 않고 결과를 구현하고 효과적으로 전달하는 과정까지 포함한다."],"a":1,"e":"통계학이 주로 정형화된 데이터를 분석한다면, 데이터 사이언스는 정형·비정형을 가리지 않고 분석하고 그 결과를 구현·전달하는 과정까지 아우르는 총체적 접근입니다.","x":["틀린 설명입니다. 정형화된 데이터 분석에 집중하는 것은 통계학이고, 데이터 사이언스는 정형·비정형을 가리지 않고 다룹니다.","맞는 설명입니다. 데이터로부터 의미 있는 정보를 추출해 내는 학문이라는 것이 데이터 사이언스의 기본 정의입니다.","맞는 설명입니다. 텍스트, 이미지, 음성처럼 형태가 정해지지 않은 비정형 데이터까지 분석 대상으로 삼습니다.","맞는 설명입니다. 분석에서 끝나지 않고 결과를 구현하고 효과적으로 전달하는 과정까지 포함하는 총체적 접근입니다."]},{"id":"1-3-03","s":1,"c":3,"t":"하드 스킬과 소프트 스킬","m":2,"n":9,"q":"데이터 사이언티스트에게 요구되는 역량 중 소프트 스킬(soft skill)에 해당하지 않는 것은?","o":["창의적 사고와 호기심을 바탕으로 한 통찰력 있는 분석","스토리텔링과 시각화를 활용한 설득력 있는 전달","다른 분야 전문가와의 협력을 위한 커뮤니케이션","분석 기술에 대한 숙련과 최적의 분석 설계 노하우"],"a":4,"e":"분석 기술의 숙련과 빅데이터 이론 지식은 하드 스킬입니다. 소프트 스킬은 통찰력 있는 분석, 설득력 있는 전달, 다분야 간 협력입니다.","x":["소프트 스킬입니다. 창의적 사고, 호기심, 논리적 비판을 바탕으로 한 통찰력 있는 분석에 해당합니다.","소프트 스킬입니다. 스토리텔링과 시각화로 결과를 설득력 있게 전달하는 능력입니다.","소프트 스킬입니다. 다른 분야 전문가와 협력하는 커뮤니케이션 능력(다분야 간 협력)입니다.","하드 스킬입니다. 분석 기술의 숙련, 최적 분석 설계 노하우, 빅데이터 이론 지식은 하드 스킬에 속합니다."]},{"id":"1-3-09","s":1,"c":3,"t":"개인정보 비식별 조치","m":3,"n":9,"q":"개인정보 비식별 조치 기법과 예시의 연결이 옳지 않은 것은?","o":["가명처리: 홍길동 → 임꺽정","총계처리: 학생별 키 → 학과 학생 평균 키 175cm","데이터 삭제: 홍길동 → 홍OO","데이터 범주화: 35세 → 30~40세"],"a":3,"e":"이름 일부를 OO로 가리는 것은 데이터 마스킹입니다. 데이터 삭제는 주민등록번호처럼 식별에 쓰이는 값 자체를 지우거나 '90년대생, 남자' 수준으로 줄이는 방법입니다.","x":["맞는 연결입니다. 이름을 다른 이름으로 바꿔 알아보기 어렵게 하는 가명처리입니다.","맞는 연결입니다. 개인의 값을 합계나 평균 같은 통계값으로 바꾸는 총계처리입니다.","틀린 연결입니다. 이름 일부를 OO로 가리는 것은 데이터 마스킹입니다. 데이터 삭제는 주민등록번호처럼 식별에 쓰이는 값 자체를 지우는 방법입니다.","맞는 연결입니다. 정확한 값을 구간으로 바꾸는 데이터 범주화입니다."]},{"id":"1-3-04","s":1,"c":3,"t":"데이터 사이언티스트의 역량","m":1,"n":10,"q":"데이터 사이언티스트에게 요구되는 역량으로 가장 거리가 먼 것은?","o":["데이터 관리: 분석할 데이터를 이해하고 다루는 능력","분석 모델링: 통계·분석 기법으로 모형을 만드는 능력","네트워크 구축: 사내 통신망과 보안 장비를 설치·운영하는 능력","소프트 스킬: 커뮤니케이션, 스토리텔링, 협업 능력"],"a":3,"e":"데이터 사이언티스트에게는 데이터 관리와 분석 모델링 같은 하드 스킬, 비즈니스에 대한 이해, 커뮤니케이션·스토리텔링·협업 같은 소프트 스킬이 함께 필요합니다. 통신망과 보안 장비를 설치·운영하는 일은 인프라 엔지니어의 영역입니다.","x":["필요한 역량입니다. 분석할 데이터를 이해하고 모으고 정리할 수 있어야 분석을 시작할 수 있습니다.","필요한 역량입니다. 통계와 분석 기법으로 모형을 만들고 평가하는 능력은 하드 스킬의 핵심입니다.","거리가 멉니다. 통신망과 보안 장비를 설치·운영하는 일은 네트워크·인프라 엔지니어의 일이지 데이터 사이언티스트의 핵심 역량이 아닙니다.","필요한 역량입니다. 분석 결과를 설득력 있게 전달하고 다른 분야 전문가와 협업하는 소프트 스킬은 하드 스킬만큼 중요합니다."]},{"id":"1-3-08","s":1,"c":3,"t":"개인정보 비식별 조치","m":2,"n":10,"q":"'홍길동, 35세, 서울 거주, 한국대 재학'을 '홍OO, 35세, 서울 거주, OO대학 재학'으로 바꾸는 개인정보 비식별 조치 기법은?","o":["가명처리","총계처리","데이터 마스킹","데이터 범주화"],"a":3,"e":"식별할 수 있는 값의 일부를 OO처럼 가리는 것이 데이터 마스킹입니다. 홍길동을 임꺽정으로 바꾸면 가명처리, 35세를 30~40세로 바꾸면 데이터 범주화입니다.","x":["가명처리는 홍길동을 임꺽정처럼 다른 값으로 바꾸는 방법입니다. 여기서는 값을 바꾸지 않고 일부만 가렸습니다.","총계처리는 학생별 키 대신 학과 평균 키를 보여 주는 것처럼 개인 값을 합계나 평균으로 바꾸는 방법입니다.","이름과 학교 이름의 일부를 OO로 가렸으므로 데이터 마스킹입니다.","데이터 범주화는 35세를 30~40세처럼 구간으로 바꾸는 방법입니다. 여기서 나이는 그대로 남아 있습니다."]},{"id":"1-3-10","s":1,"c":3,"t":"가명정보","m":0,"n":0,"q":"2020년 개정된 데이터 3법에서 도입한 가명정보에 대한 설명으로 옳은 것은?","o":["시간·비용·기술 등을 합리적으로 고려할 때 다른 정보를 사용해도 더 이상 개인을 알아볼 수 없도록 처리해 개인정보 보호법이 적용되지 않는다.","추가 정보를 사용하거나 결합하지 않으면 특정 개인을 알아볼 수 없도록 처리한 정보이다.","정보주체의 동의 없이는 통계 작성 목적으로도 쓸 수 없다.","이름만 지우면 별도 관리 없이 누구에게나 공개할 수 있다."],"a":2,"e":"가명정보는 추가 정보 없이는 개인을 알아볼 수 없게 처리한 정보로, 통계 작성·과학적 연구·공익적 기록 보존 목적이면 동의 없이 활용할 수 있습니다. 합리적으로 고려해도 더 이상 개인을 알아볼 수 없어 법 적용에서 빠지는 것은 익명정보입니다.","x":["익명정보에 대한 설명입니다(개인정보 보호법 제58조의2). 가명정보는 추가 정보와 결합하면 다시 알아볼 수 있어 여전히 개인정보 보호법이 적용됩니다.","가명정보는 추가 정보를 쓰거나 결합하지 않으면 특정 개인을 알아볼 수 없게 처리한 정보입니다.","틀린 설명입니다. 가명정보는 통계 작성, 과학적 연구, 공익적 기록 보존 목적이면 정보주체의 동의 없이 활용할 수 있습니다.","틀린 설명입니다. 가명정보도 개인정보라서 추가 정보를 따로 보관하는 등 안전 조치를 해야 하고, 아무에게나 공개할 수 없습니다."],"sup":"2020년 개정 개인정보 보호법(데이터 3법) 내용이에요. 정의는 법 조문(제2조)과 같지만 ADsP 교재 핵심 범위 밖의 시사 내용이라 참고로만 보세요."},{"id":"2-1-01","s":2,"c":1,"t":"분석 주제 유형","m":1,"n":11,"q":"분석 대상(What)은 알고 있지만 분석 방법(How)을 모를 때 해당하는 분석 주제 유형은?","o":["Optimization","Solution","Insight","Discovery"],"a":2,"e":"대상과 방법을 모두 알면 Optimization, 대상만 알면 Solution, 방법만 알면 Insight, 둘 다 모르면 Discovery입니다.","x":["분석 대상과 방법을 모두 알 때의 유형입니다. 이미 아는 문제를 더 잘 푸는 최적화를 합니다.","분석 대상(What)은 알지만 방법(How)을 모르면, 해결 방법을 찾아내는 Solution 유형입니다.","방법은 알지만 대상을 모를 때의 유형입니다. 기존 분석 방법으로 새로운 통찰을 찾습니다.","대상과 방법을 모두 모를 때의 유형입니다. 새로운 문제 자체를 발견합니다."]},{"id":"2-1-04","s":2,"c":1,"t":"데이터 유형","m":3,"n":11,"q":"다음 중 반정형 데이터에 해당하는 것은?","o":["관계형 데이터베이스에 저장된 회원 테이블","JSON 형식으로 받은 경기 기록 API 응답","경기 하이라이트 영상","감독 인터뷰 녹음 파일"],"a":2,"e":"XML, HTML, JSON, 로그처럼 스키마(구조 정보)를 데이터 안에 담고 있는 형태가 반정형 데이터입니다. 관계형 DB 테이블은 정형, 영상과 음성은 비정형 데이터입니다.","x":["관계형 DB 테이블은 정해진 스키마에 맞춰 저장된 정형 데이터입니다.","JSON은 키 이름 같은 구조 정보(메타데이터)를 데이터 안에 함께 담고 있는 반정형 데이터입니다.","영상은 정해진 구조가 없는 비정형 데이터입니다.","음성 녹음 파일은 비정형 데이터입니다."]},{"id":"2-1-05","s":2,"c":1,"t":"방법론의 생성 과정","m":0,"n":0,"q":"개인의 암묵지가 조직의 방법론으로 만들어지고 다시 개인에게 체득되는 과정을 순서대로 나열한 것은?","o":["형식화 → 체계화 → 내재화","체계화 → 형식화 → 내재화","내재화 → 형식화 → 체계화","형식화 → 내재화 → 체계화"],"a":1,"e":"암묵지를 문서로 만드는 형식화, 형식지를 방법론으로 정리하는 체계화, 방법론을 다시 개인의 암묵지로 체득하는 내재화 순서로 순환합니다.","x":["암묵지를 문서로 만드는 형식화 → 형식지를 방법론으로 정리하는 체계화 → 방법론을 다시 개인이 체득하는 내재화 순서입니다.","체계화는 형식화된 지식을 방법론으로 정리하는 단계라 형식화보다 먼저 올 수 없습니다.","내재화는 완성된 방법론을 개인이 체득하는 마지막 단계입니다.","내재화가 마지막 단계이고, 체계화가 그보다 먼저입니다."]},{"id":"2-1-07","s":2,"c":1,"t":"KDD 분석 방법론","m":2,"n":11,"q":"KDD 분석 방법론에 대한 설명으로 옳지 않은 것은?","o":["분석 목표는 데이터 마이닝 결과 평가 단계에서 처음 설정한다.","데이터셋 선택 → 데이터 전처리 → 데이터 변환 → 데이터 마이닝 → 결과 평가 순서로 진행한다.","잡음, 이상값, 결측값을 찾아 처리하는 것은 데이터 전처리 단계이다.","학습용과 검증용 데이터를 나누는 것은 데이터 변환 단계이다."],"a":1,"e":"KDD는 데이터셋을 고르기 전에 비즈니스 도메인을 이해하고 프로젝트 목표를 먼저 정합니다. 결과 평가 단계는 마이닝 결과를 해석·평가하고 발견한 지식을 활용하는 단계입니다.","x":["틀린 설명입니다. KDD는 데이터셋을 고르기 전에 비즈니스 도메인을 이해하고 프로젝트 목표를 먼저 정합니다.","맞는 설명입니다. KDD는 데이터셋 선택 → 전처리 → 변환 → 데이터 마이닝 → 결과 평가의 5단계로 진행합니다.","맞는 설명입니다. 잡음, 이상값, 결측값을 찾아 제거하거나 처리하는 것이 데이터 전처리 단계입니다.","맞는 설명입니다. 변수 선택, 차원 축소, 학습용·검증용 데이터 분리가 데이터 변환 단계에서 이뤄집니다."]},{"id":"2-1-02","s":2,"c":1,"t":"목표 시점별 분석 기획","m":1,"n":12,"q":"당면한 분석 과제를 빠르게 해결하는 '과제 중심적 접근'의 특징으로 옳은 것은?","o":["접근 방식은 Problem Solving이다.","1차 목표는 Accuracy & Deploy이다.","과제 유형은 Long Term View이다.","지속적인 분석 문화 내재화를 목표로 한다."],"a":1,"e":"과제 중심적 접근은 Speed & Test, Quick-Win, Problem Solving이 특징입니다. Accuracy & Deploy, Long Term View, Problem Definition은 장기적인 마스터 플랜 접근의 특징입니다.","x":["과제 중심적 접근은 당면한 문제를 빠르게 해결하는 Problem Solving 방식입니다.","Accuracy &amp; Deploy는 장기적인 마스터 플랜 접근의 1차 목표입니다. 과제 중심적 접근의 1차 목표는 Speed &amp; Test입니다.","Long Term View는 마스터 플랜 접근의 과제 유형입니다. 과제 중심적 접근은 빠른 성과를 내는 Quick-Win이 과제 유형입니다.","분석 문화를 꾸준히 내재화하는 것은 장기적인 마스터 플랜 접근의 목표입니다."]},{"id":"2-1-03","s":2,"c":1,"t":"분석 기획 시 고려사항","m":2,"n":12,"q":"분석 기획 시 고려사항으로 거리가 먼 것은?","o":["사용할 수 있는 데이터의 유형(정형·반정형·비정형)을 먼저 확인한다.","유사한 분석 시나리오와 솔루션(유스케이스)이 있으면 최대한 활용한다.","분석 수행 중 생길 수 있는 장애 요소를 미리 계획한다.","정확도를 최우선으로 하고, 사용자가 결과를 이해하기 쉬운지는 고려하지 않는다."],"a":4,"e":"정확도를 높이려다 비용과 기간이 늘 수 있고, 사용자가 결과를 이해하고 활용하지 못하면 소용이 없습니다. 정확도와 이해도의 균형, 지속적인 교육과 변화 관리도 장애 요소 대책에 포함됩니다.","x":["고려사항입니다. 데이터 유형에 따라 분석 방법과 필요한 인프라가 달라지므로 쓸 수 있는 데이터를 먼저 확인합니다.","고려사항입니다. 이미 검증된 유사 시나리오와 솔루션을 활용하면 시행착오를 줄일 수 있습니다.","고려사항입니다. 비용 증가, 일정 지연 같은 장애 요소를 미리 예상하고 대응 계획을 세워야 합니다.","거리가 멉니다. 정확도만 좇으면 비용과 기간이 늘 수 있고, 사용자가 결과를 이해하지 못하면 활용되지 않으므로 정확도와 이해도의 균형을 고려해야 합니다."]},{"id":"2-1-10","s":2,"c":1,"t":"프로젝트 위험 대응","m":3,"n":12,"q":"분석 기획 단계에서 프로젝트 위험 계획을 세울 때, 식별된 위험에 대한 대응 방법이 아닌 것은?","o":["회피(Avoid)","전이(Transfer)","완화(Mitigate)","무시(Ignore)"],"a":4,"e":"식별된 위험은 회피, 전이, 완화, 수용(Accept)으로 대응 계획을 세웁니다. 위험 계획 수립은 빅데이터 분석 방법론에서 분석 기획 단계의 태스크입니다.","x":["대응 방법입니다. 위험이 생길 원인을 없애거나 계획을 바꿔 위험 자체를 피합니다.","대응 방법입니다. 보험이나 외부 계약처럼 위험의 영향을 제3자에게 넘깁니다.","대응 방법입니다. 위험이 일어날 가능성이나 그 영향을 줄이는 조치를 합니다.","대응 방법이 아닙니다. 식별된 위험은 회피, 전이, 완화, 수용(Accept) 중 하나로 대응합니다. 수용은 위험을 알고 받아들이는 것이지 무시하는 것이 아닙니다."]},{"id":"2-2-08","s":2,"c":2,"t":"프로토타이핑 접근법","m":0,"n":0,"q":"상향식 접근에서 프로토타이핑 접근법이 필요한 이유로 거리가 먼 것은?","o":["문제에 대한 인식 수준이 낮아 요구사항을 명확히 정의하기 어렵다.","필요한 데이터가 존재하는지 미리 알기 어렵다.","분석 대상과 방법이 이미 명확해 결과를 빨리 확인할 필요가 없다.","데이터의 사용 목적이 계속 바뀔 수 있다."],"a":3,"e":"프로토타이핑은 문제가 불명확하거나, 필요한 데이터를 미리 알기 어렵거나, 데이터의 사용 목적이 가변적일 때 빠르게 결과를 만들어 보며 문제를 구체화하는 방법입니다.","x":["필요한 이유입니다. 문제를 잘 몰라 요구사항을 명확히 정할 수 없으면 일단 만들어 보며 문제를 구체화합니다.","필요한 이유입니다. 필요한 데이터가 있는지 미리 알기 어려우면 빠르게 시도해 보며 확인해야 합니다.","거리가 멉니다. 분석 대상과 방법이 이미 명확하면 하향식 접근으로 충분해 프로토타이핑이 꼭 필요하지 않습니다.","필요한 이유입니다. 데이터의 사용 목적이 계속 바뀌면 빠르게 만들어 보고 고치는 방식이 맞습니다."]},{"id":"2-1-06","s":2,"c":1,"t":"분석 방법론 모델","m":3,"n":13,"q":"사용자의 요구사항이나 데이터를 정확히 규정하기 어려울 때, 일단 분석을 시도해 보고 결과를 확인하며 반복적으로 개선해 나가는 방법론 모델은?","o":["폭포수 모델","나선형 모델","프로토타입 모델","계층적 프로세스 모델"],"a":3,"e":"프로토타입 모델은 빠르게 결과물을 만들어 보며 요구를 구체화합니다. 폭포수 모델은 단계를 순서대로 진행하고, 나선형 모델은 반복으로 점증적으로 개발해 처음 해 보는 프로젝트에 맞지만 관리가 복잡해질 수 있습니다.","x":["폭포수 모델은 단계를 순서대로 진행하고 앞 단계가 끝나야 다음으로 넘어가므로, 요구사항이 분명할 때 맞습니다.","나선형 모델도 반복하지만, 핵심은 '반복을 통한 점증적 개발'로 처음 시도하는 프로젝트에 적용하기 쉽고 관리 체계가 없으면 복잡도가 커진다는 점입니다. 요구사항을 정하기 어려워 일단 시도해 보고 결과를 확인하며 개선하는 것은 프로토타입 모델의 정의입니다.","요구사항을 정확히 정하기 어려울 때 일단 결과물을 빠르게 만들어 보고 확인하며 개선하는 것이 프로토타입 모델입니다.","계층적 프로세스 모델은 분석 방법론을 단계(Phase) – 태스크(Task) – 스텝(Step)으로 나누어 구성하는 구조를 말합니다."]},{"id":"2-1-08","s":2,"c":1,"t":"CRISP-DM","m":1,"n":13,"q":"CRISP-DM 방법론에 대한 설명으로 옳지 않은 것은?","o":["업무 이해 → 데이터 이해 → 데이터 준비 → 모델링 → 평가 → 전개의 6단계로 구성된다.","단계 간 피드백을 통해 완성도를 높인다.","데이터 정제와 데이터 통합은 데이터 이해 단계에서 수행한다.","단계 – 일반화 태스크 – 세분화 태스크 – 프로세스 실행의 4레벨 구조이다."],"a":3,"e":"데이터 정제, 통합, 포맷팅은 데이터 준비 단계의 태스크입니다. 데이터 이해 단계에서는 초기 데이터 수집, 데이터 기술 분석, 데이터 탐색, 데이터 품질 확인을 합니다.","x":["맞는 설명입니다. CRISP-DM은 업무 이해부터 전개까지 6단계로 이루어집니다.","맞는 설명입니다. 단계가 한 방향으로만 흐르지 않고 서로 피드백하며 완성도를 높입니다.","틀린 설명입니다. 데이터 정제, 통합, 포맷팅은 데이터 준비 단계의 태스크입니다. 데이터 이해 단계에서는 초기 데이터 수집, 데이터 기술 분석, 탐색, 품질 확인을 합니다.","맞는 설명입니다. 단계(Phase) – 일반화 태스크 – 세분화 태스크 – 프로세스 실행의 4레벨 계층 구조입니다."]},{"id":"2-1-09","s":2,"c":1,"t":"빅데이터 분석 방법론","m":2,"n":13,"q":"빅데이터 분석 방법론의 5단계를 순서대로 나열한 것은?","o":["데이터 준비 → 분석 기획 → 데이터 분석 → 시스템 구현 → 평가 및 전개","분석 기획 → 데이터 분석 → 데이터 준비 → 평가 및 전개 → 시스템 구현","분석 기획 → 데이터 준비 → 데이터 분석 → 시스템 구현 → 평가 및 전개","분석 기획 → 데이터 준비 → 시스템 구현 → 데이터 분석 → 평가 및 전개"],"a":3,"e":"빅데이터 분석 방법론은 단계(Phase) – 태스크(Task) – 스텝(Step)의 3계층으로 이루어지며, 분석 기획부터 평가 및 전개까지 5단계로 진행합니다. 데이터 분석 중 데이터가 부족하면 데이터 준비 단계로 되돌아가는 피드백이 있습니다.","x":["분석 기획이 가장 먼저입니다. 무엇을 분석할지 정해야 필요한 데이터를 준비할 수 있습니다.","데이터 준비가 데이터 분석보다 먼저이고, 시스템 구현 다음에 평가 및 전개가 옵니다.","분석 기획 → 데이터 준비 → 데이터 분석 → 시스템 구현 → 평가 및 전개 순서입니다.","시스템 구현은 데이터 분석 결과를 바탕으로 하므로 데이터 분석 뒤에 옵니다."]},{"id":"2-3-07","s":2,"c":3,"t":"로드맵 수립","m":0,"n":0,"q":"분석 마스터 플랜의 로드맵을 단계적으로 수립할 때의 순서로 가장 적절한 것은?","o":["데이터 분석 확산 및 고도화 → 데이터 분석 체계 도입 → 데이터 분석 유효성 검증","데이터 분석 유효성 검증 → 데이터 분석 체계 도입 → 데이터 분석 확산 및 고도화","데이터 분석 체계 도입 → 데이터 분석 확산 및 고도화 → 데이터 분석 유효성 검증","데이터 분석 체계 도입 → 데이터 분석 유효성 검증 → 데이터 분석 확산 및 고도화"],"a":4,"e":"분석 체계를 도입해 과제를 수행하고, 파일럿으로 유효성을 검증한 뒤, 전사로 확산하고 고도화하는 단계적 로드맵을 세웁니다.","x":["확산 및 고도화는 가장 마지막 단계입니다. 먼저 분석 체계를 도입해야 합니다.","유효성 검증은 도입한 분석 체계로 수행한 과제를 검증하는 단계라 체계 도입 다음에 옵니다.","유효성을 검증하지 않고 확산하지 않습니다. 검증이 확산보다 먼저입니다.","분석 체계 도입 → 파일럿으로 유효성 검증 → 전사 확산 및 고도화 순서로 단계적으로 세웁니다."]},{"id":"2-2-01","s":2,"c":2,"t":"하향식 접근 절차","m":1,"n":14,"q":"하향식 접근 방식으로 분석 과제를 발굴하는 절차를 순서대로 나열한 것은?","o":["문제 정의 → 문제 탐색 → 해결방안 탐색 → 타당성 검토","문제 탐색 → 해결방안 탐색 → 문제 정의 → 타당성 검토","타당성 검토 → 문제 탐색 → 문제 정의 → 해결방안 탐색","문제 탐색 → 문제 정의 → 해결방안 탐색 → 타당성 검토"],"a":4,"e":"하향식 접근은 문제 탐색(Problem Discovery), 문제 정의(Problem Definition), 해결방안 탐색(Solution Search), 타당성 검토(Feasibility Study) 순서입니다. 문제 정의 단계에서 비즈니스 문제를 데이터 문제로 바꿉니다.","x":["문제를 정의하려면 먼저 문제를 탐색해야 하므로 문제 탐색이 첫 단계입니다.","해결방안은 문제를 정의한 다음에 찾습니다. 문제 정의가 해결방안 탐색보다 먼저입니다.","타당성 검토는 해결방안을 찾은 뒤 따지는 마지막 단계입니다.","문제 탐색 → 문제 정의 → 해결방안 탐색 → 타당성 검토 순서입니다."]},{"id":"2-2-06","s":2,"c":2,"t":"분석 과제의 5가지 특성","m":2,"n":14,"q":"분석 과제 관리에서 고려하는 5가지 특성 중, 모델을 반복 실행했을 때 결과의 편차가 작은 정도(안정성)를 뜻하는 것은?","o":["Accuracy","Speed","Analytic Complexity","Precision"],"a":4,"e":"Accuracy는 모델 값과 실제 값의 차이가 작은 정도, Precision은 반복 실행했을 때 결과가 일정한 정도이며 둘은 트레이드오프인 경우가 많습니다. 5가지 특성은 Data Size, Data Complexity, Speed, Analytic Complexity, Accuracy & Precision입니다.","x":["Accuracy는 모델 값과 실제 값의 차이가 작은 정도입니다. 반복 실행했을 때 결과가 일정한지와는 다른 개념입니다.","Speed는 분석 결과가 얼마나 빨리 나와야 하는지(실시간인지, 일 단위인지)에 관한 특성입니다.","Analytic Complexity는 분석 모델이 얼마나 복잡한지, 정확도와 복잡도 사이의 균형에 관한 특성입니다.","반복 실행했을 때 결과의 편차가 작은 정도, 즉 안정성은 Precision입니다."]},{"id":"2-2-07","s":2,"c":2,"t":"분석 프로젝트 관리 영역","m":3,"n":14,"q":"분석 프로젝트 관리 영역과 설명의 연결로 옳지 않은 것은?","o":["시간: 초기 계획보다 오래 걸리기 쉬워 Time Boxing으로 일정을 관리한다.","범위: 분석 기획 단계에서 정한 범위는 이후 바뀌지 않는다.","원가: 외부 데이터를 활용하면 비용이 크게 늘 수 있다.","조달: PoC는 클라우드 같은 외부 인프라를 활용할 수 있다."],"a":2,"e":"분석 프로젝트의 범위는 데이터의 형태와 양, 적용할 알고리즘에 따라 자주 바뀝니다. 그래서 범위 관리가 중요합니다.","x":["맞는 연결입니다. 분석은 초기 계획보다 오래 걸리기 쉬워 정해진 기간 안에 끝내는 Time Boxing으로 일정을 관리합니다.","틀린 연결입니다. 분석 프로젝트의 범위는 데이터의 형태와 양, 적용 모델에 따라 자주 바뀌기 때문에 범위 관리가 중요합니다.","맞는 연결입니다. 외부 데이터를 사거나 도구를 도입하면 비용이 크게 늘 수 있어 원가를 미리 따져야 합니다.","맞는 연결입니다. PoC(개념 검증)는 클라우드 같은 외부 인프라를 빌려 쓰는 방식으로도 진행할 수 있습니다."]},{"id":"2-4-09","s":2,"c":4,"t":"분석 과제 관리 프로세스","m":0,"n":0,"q":"분석 과제 관리 프로세스 중 '과제 발굴' 단계를 순서대로 나열한 것은?","o":["분석 과제 후보 제안 → 분석 아이디어 발굴 → 분석 과제 확정","분석 아이디어 발굴 → 분석 과제 후보 제안 → 분석 과제 확정","분석 과제 확정 → 분석 아이디어 발굴 → 분석 과제 후보 제안","분석 아이디어 발굴 → 분석 과제 확정 → 분석 과제 후보 제안"],"a":2,"e":"과제 발굴은 아이디어 발굴 → 과제 후보 제안 → 과제 확정, 과제 수행은 팀 구성 → 분석 과제 실행 → 진행 관리 → 결과 공유·개선 순서입니다. 발굴한 과제는 분석 과제 풀(Pool)로 관리합니다.","x":["아이디어를 먼저 발굴해야 그중에서 과제 후보를 제안할 수 있습니다.","분석 아이디어 발굴 → 분석 과제 후보 제안 → 분석 과제 확정 순서입니다.","과제 확정은 아이디어 발굴과 후보 제안을 거친 마지막 단계입니다.","후보로 제안된 과제 중에서 확정하므로 후보 제안이 확정보다 먼저입니다."]},{"id":"2-2-03","s":2,"c":2,"t":"해결방안 탐색","m":1,"n":15,"q":"분석 역량은 확보했지만 기존 분석 시스템으로는 부족해 새로운 시스템을 도입해야 할 때 해당하는 해결방안은?","o":["기존 시스템 개선 활용","시스템 고도화","교육 및 채용을 통한 역량 확보","전문 업체 Sourcing"],"a":2,"e":"분석 역량(Who)과 분석 기법·시스템(How)으로 나눕니다. 역량 있음 + 기존 시스템이면 기존 시스템 개선 활용, 역량 있음 + 신규 도입이면 시스템 고도화, 역량 없음 + 기존 시스템이면 교육 및 채용, 역량 없음 + 신규 도입이면 전문 업체 Sourcing입니다.","x":["기존 시스템 개선 활용은 분석 역량이 있고 기존 시스템으로도 해결할 수 있을 때입니다.","분석 역량은 있지만 새로운 시스템이 필요하므로 시스템 고도화입니다.","교육 및 채용을 통한 역량 확보는 역량이 없고 기존 시스템을 쓸 때입니다.","전문 업체 Sourcing은 역량도 없고 새로운 시스템도 필요할 때입니다."]},{"id":"2-2-04","s":2,"c":2,"t":"상향식 접근","m":2,"n":15,"q":"상향식 접근 방식에 대한 설명으로 옳지 않은 것은?","o":["문제 정의 자체가 어려울 때 데이터를 출발점으로 삼는다.","문제가 주어지면 해법을 찾기 위해 각 과정을 체계적으로 단계화한다.","주로 비지도학습 방법으로 데이터 속 패턴을 찾는다.","디자인 사고에서 아이디어를 넓게 펼치는 발산 단계에 해당한다."],"a":2,"e":"문제가 주어진 상태에서 단계적으로 해법을 찾는 것은 하향식 접근입니다. 상향식은 '왜(Why)'보다 '무엇(What)'에 주목해 데이터 자체에서 문제를 재정의합니다.","x":["맞는 설명입니다. 문제를 정의하기 어려울 때 데이터 자체를 출발점으로 삼아 문제를 찾습니다.","틀린 설명입니다. 문제가 주어진 상태에서 해법을 단계적으로 찾는 것은 하향식 접근입니다.","맞는 설명입니다. 정답(레이블) 없이 데이터 속 패턴과 연관성을 찾는 비지도학습을 주로 씁니다.","맞는 설명입니다. 디자인 사고에서 상향식은 가능한 옵션을 넓게 펼치는 발산 단계, 하향식은 좁혀 가는 수렴 단계에 해당합니다."]},{"id":"2-2-05","s":2,"c":2,"t":"타당성 검토","m":3,"n":15,"q":"하향식 접근의 타당성 검토에 대한 설명으로 옳지 않은 것은?","o":["타당성 검토는 문제 탐색보다 먼저 수행한다.","비용 대비 편익으로 경제적 타당성을 따진다.","데이터가 존재하는지, 분석 시스템 환경이 갖춰졌는지 검토한다.","분석 역량을 확보할 수 있는지도 기술적 타당성에 포함된다."],"a":1,"e":"타당성 검토는 하향식 접근의 마지막 단계입니다. 경제적 타당성과 데이터 및 기술적 타당성을 따져 가장 우월한 대안을 고릅니다.","x":["틀린 설명입니다. 타당성 검토는 문제 탐색 → 문제 정의 → 해결방안 탐색 다음에 오는 마지막 단계입니다.","맞는 설명입니다. 비용 대비 편익을 따지는 것이 경제적 타당성 검토입니다.","맞는 설명입니다. 데이터가 있는지, 분석 시스템 환경이 갖춰졌는지 따지는 것이 데이터 및 기술적 타당성 검토입니다.","맞는 설명입니다. 분석 역량을 확보할 수 있는지도 데이터 및 기술적 타당성에서 함께 검토합니다."]},{"id":"2-2-02","s":2,"c":2,"t":"비즈니스 모델 캔버스","m":1,"n":16,"q":"하향식 접근의 문제 탐색 단계에서 비즈니스 모델 캔버스로 분석 기회를 찾을 때 살펴보는 5가지 영역이 아닌 것은?","o":["경쟁사(Competitor)","업무(Operation)","제품(Product)","규제와 감사(Regulation & Audit)"],"a":1,"e":"5가지 영역은 업무, 제품, 고객, 규제와 감사, 지원 인프라입니다. 경쟁사는 분석 기회의 범위를 넓히는 관점(경쟁자 확대 관점)에서 다룹니다.","x":["5가지 영역이 아닙니다. 경쟁사는 분석 기회를 넓혀 보는 경쟁자 확대 관점에서 다룹니다.","5가지 영역입니다. 제품·서비스를 만들고 운영하는 내부 업무에서 분석 기회를 찾습니다.","5가지 영역입니다. 제품·서비스의 품질과 개선 방향에서 분석 기회를 찾습니다.","5가지 영역입니다. 제품을 만들고 전달하는 과정의 규제와 보안 문제에서 분석 기회를 찾습니다."]},{"id":"2-3-04","s":2,"c":3,"t":"포트폴리오 사분면 분석","m":2,"n":16,"q":"다음 포트폴리오 사분면에서 '시급성'을 기준으로 과제 추진 순서를 정할 때 옳은 것은? (공식 교재 기준)","fig":"quad","o":["3 → 4 → 2","3 → 1 → 2","1 → 3 → 2","3 → 2 → 4"],"a":1,"e":"교재 기준으로 시급성을 기준으로 삼으면 3 → 4 → 2, 난이도를 기준으로 삼으면 3 → 1 → 2 순서입니다. 3사분면에서 출발해 기준이 되는 축을 따라 먼저 옮겨 간다고 기억하면 쉽습니다. 어느 기준이든 3사분면이 처음, 2사분면이 마지막입니다. 직관적으로는 3 → 1 → 2가 맞아 보여 이의가 자주 나오지만, 시험은 교재 서술을 정답으로 봅니다.","x":["교재는 시급성을 기준으로 삼으면 3 → 4 → 2 순서라고 정리합니다. 3사분면에서 출발해 시급성 축(가로)을 따라 먼저 옮겨 간다고 기억하세요.","난이도를 기준으로 삼을 때의 순서입니다. 3사분면에서 난이도 축(세로)을 따라 1사분면으로 먼저 옮겨 갑니다.","어느 기준이든 현재 시급하고 쉬운 3사분면이 처음입니다.","어느 기준이든 미래에 필요하고 어려운 2사분면이 마지막입니다."]},{"id":"2-3-05","s":2,"c":3,"t":"이행 계획 수립","m":3,"n":16,"q":"분석 마스터 플랜의 세부 이행 계획에 대한 설명으로 옳은 것은?","o":["모든 단계를 폭포수 방식으로 한 번씩만 진행한다.","반복적 정련 방식은 모델링 단계를 생략해 기간을 줄이는 방식이다.","로드맵은 단계 구분 없이 처음부터 전사에 한꺼번에 적용한다.","데이터 수집·확보와 분석 데이터 준비는 순차적으로 진행하고, 모델링은 반복하는 혼합형을 많이 쓴다."],"a":4,"e":"분석 프로젝트는 반복적인 정련으로 완성도를 높입니다. 다만 모든 단계를 반복하기보다 데이터 수집·준비는 순차적으로, 모델링은 반복적으로 수행하는 혼합형을 주로 씁니다. 로드맵도 단계적으로 세웁니다.","x":["틀린 설명입니다. 분석 프로젝트는 폭포수처럼 한 번씩만 진행하지 않고, 반복적인 정련으로 완성도를 높입니다.","틀린 설명입니다. 반복적 정련 방식은 모델링을 생략하는 것이 아니라 오히려 모델링을 반복해 완성도를 높이는 방식입니다.","틀린 설명입니다. 로드맵은 체계 도입 → 유효성 검증 → 확산 및 고도화처럼 단계적으로 세웁니다.","맞는 설명입니다. 데이터 수집·준비는 순차적으로, 모델링은 반복적으로 진행하는 혼합형을 많이 씁니다."]},{"id":"2-3-01","s":2,"c":3,"t":"우선순위 고려 요소","m":2,"n":17,"q":"분석 마스터 플랜을 수립할 때 우선순위 고려 요소가 아닌 것은?","o":["전략적 중요도","분석 데이터 적용 수준","비즈니스 성과 및 ROI","실행 용이성"],"a":2,"e":"우선순위는 전략적 중요도, 비즈니스 성과·ROI, 실행 용이성으로 정합니다. 업무 내재화 적용 수준, 분석 데이터 적용 수준, 기술 적용 수준은 로드맵을 수립할 때의 고려 요소입니다.","x":["우선순위 고려 요소입니다. 전략적 필요성과 시급성처럼 경영 전략에 얼마나 중요한지를 봅니다.","우선순위가 아니라 로드맵(적용 범위와 방식)을 정할 때의 고려 요소입니다. 업무 내재화 적용 수준, 분석 데이터 적용 수준, 기술 적용 수준이 여기에 속합니다.","우선순위 고려 요소입니다. 과제가 가져올 비즈니스 성과와 투자 대비 효과를 봅니다.","우선순위 고려 요소입니다. 투자 여력과 기술 수준으로 실제로 실행하기 쉬운지를 봅니다."]},{"id":"2-3-03","s":2,"c":3,"t":"포트폴리오 사분면 분석","m":1,"n":17,"q":"다음은 분석 과제를 난이도와 시급성으로 나눈 포트폴리오 사분면이다. 가장 먼저 추진해야 할 영역은?","fig":"quad","o":["1사분면","2사분면","3사분면","4사분면"],"a":3,"e":"현재 시급하면서 난이도가 쉬운 3사분면을 가장 먼저 추진합니다. 미래에 필요하고 난이도도 어려운 2사분면이 가장 나중입니다.","x":["1사분면은 현재 시급하지만 난이도가 어려워, 같은 시급성에 쉬운 3사분면보다 뒤에 추진합니다.","2사분면은 미래에 필요하고 난이도도 어려워 가장 나중에 추진합니다.","3사분면은 현재 시급하면서 난이도도 쉬워 가장 먼저 추진합니다.","4사분면은 난이도는 쉽지만 미래에 필요한 과제라, 지금 시급한 3사분면보다 뒤입니다."]},{"id":"2-3-06","s":2,"c":3,"t":"ISP","m":3,"n":17,"q":"정보기술과 정보시스템을 전략적으로 활용하기 위해 조직의 내·외부 환경을 분석하고 중장기 마스터 플랜을 수립하는 절차는?","o":["ISP(Information Strategy Planning)","BPR(Business Process Reengineering)","ERP(Enterprise Resource Planning)","SLA(Service Level Agreement)"],"a":1,"e":"ISP(정보 전략 계획)는 경영 목표 달성에 필요한 전략적 정보를 파악하고 정보시스템의 중장기 마스터 플랜을 세우는 절차입니다. 분석 마스터 플랜도 ISP와 같은 방식으로 수립합니다.","x":["ISP(정보 전략 계획)는 조직 내·외부 환경을 분석해 정보시스템의 중장기 마스터 플랜을 세우는 절차입니다. 분석 마스터 플랜도 같은 방식으로 세웁니다.","BPR(업무 재설계)은 비용, 품질, 속도를 크게 높이기 위해 업무 프로세스를 근본적으로 다시 설계하는 기법입니다.","ERP(전사적 자원 관리)는 인사, 재무, 생산 등 경영 자원을 하나로 통합해 관리하는 시스템입니다.","SLA(서비스 수준 협약)는 서비스 제공자와 이용자가 서비스 품질 수준을 약속하는 계약입니다."]},{"id":"2-3-02","s":2,"c":3,"t":"ROI 관점의 4V","m":1,"n":18,"q":"ROI 관점에서 빅데이터의 4V를 볼 때 '비즈니스 효과'에 해당하는 요소는?","o":["Volume","Variety","Velocity","Value"],"a":4,"e":"Volume, Variety, Velocity는 데이터를 다루는 데 드는 투자 비용 요소로 난이도와 연결되고, Value는 비즈니스 효과로 시급성과 연결됩니다.","x":["투자 비용 요소입니다. 데이터의 규모를 다루는 데 드는 비용으로, 난이도와 연결됩니다.","투자 비용 요소입니다. 다양한 형태의 데이터를 다루는 데 드는 비용으로, 난이도와 연결됩니다.","투자 비용 요소입니다. 빠르게 생성되는 데이터를 처리하는 데 드는 비용으로, 난이도와 연결됩니다.","Value는 분석으로 얻는 비즈니스 효과(가치)로, 시급성과 연결됩니다."]},{"id":"2-4-01","s":2,"c":4,"t":"분석 거버넌스 체계","m":3,"n":18,"q":"분석 거버넌스 체계의 구성 요소가 아닌 것은?","o":["조직(Organization)","과제 기획·운영 프로세스(Process)","분석 관련 시스템(System)","분석 마스터 플랜(Master Plan)"],"a":4,"e":"분석 거버넌스 체계는 조직, 프로세스, 시스템, 데이터, 분석 교육·마인드 육성 체계(Human Resource)로 구성됩니다.","x":["구성 요소입니다. 분석 기획과 관리, 추진을 맡는 조직입니다.","구성 요소입니다. 과제 발굴부터 수행, 평가까지의 기획·운영 프로세스입니다.","구성 요소입니다. 분석에 쓰는 IT 기술과 프로그램 같은 분석 관련 시스템입니다.","구성 요소가 아닙니다. 분석 마스터 플랜은 거버넌스 체계와 별개로 세우는 중장기 계획이고, 거버넌스 체계는 조직, 프로세스, 시스템, 데이터, 분석 교육·마인드 육성 체계로 이뤄집니다."]},{"id":"2-4-07","s":2,"c":4,"t":"데이터 거버넌스 체계","m":2,"n":18,"q":"데이터 거버넌스 체계 중 '데이터 표준화'에 해당하지 않는 것은?","o":["데이터 표준 용어 설정","명명 규칙 수립","메타데이터와 데이터 사전 구축","데이터 생명 주기 관리 방안 수립"],"a":4,"e":"데이터 생명 주기 관리 방안은 데이터 관리 체계에 해당합니다. 데이터 거버넌스 체계는 데이터 표준화, 데이터 관리 체계, 데이터 저장소 관리, 표준화 활동으로 이루어집니다.","x":["데이터 표준화에 해당합니다. 업무와 데이터에 쓰는 표준 용어를 정합니다.","데이터 표준화에 해당합니다. 데이터 이름을 짓는 규칙을 정합니다.","데이터 표준화에 해당합니다. 데이터를 설명하는 메타데이터와 데이터 사전을 만듭니다.","데이터 표준화가 아니라 데이터 관리 체계에 해당합니다. 데이터 관리 체계에서는 메타데이터·데이터 사전의 관리 원칙과 데이터 생명 주기 관리 방안을 세웁니다."]},{"id":"2-4-02","s":2,"c":4,"t":"분석 준비도","m":2,"n":19,"q":"데이터 분석 준비도(Readiness)를 진단하는 영역이 아닌 것은?","o":["분석 업무 파악","인력 및 조직","분석 성과 보상","분석 문화"],"a":3,"e":"분석 준비도는 분석 업무 파악, 인력 및 조직, 분석 기법, 분석 데이터, 분석 문화, IT 인프라의 6개 영역으로 진단합니다.","x":["진단 영역입니다. 발생한 사실 분석, 예측 분석, 최적화 분석 같은 분석 업무를 얼마나 하는지 파악합니다.","진단 영역입니다. 분석 전문가와 전담 조직이 있는지, 관리자들의 기본 분석 능력은 어떤지 봅니다.","진단 영역이 아닙니다. 준비도의 6개 영역은 분석 업무 파악, 인력 및 조직, 분석 기법, 분석 데이터, 분석 문화, IT 인프라입니다.","진단 영역입니다. 사실에 근거해 의사결정을 하는지, 데이터를 중시하는 문화인지 봅니다."]},{"id":"2-4-03","s":2,"c":4,"t":"분석 성숙도","m":1,"n":19,"q":"CMMI 모델을 바탕으로 한 분석 성숙도 모델의 단계를 순서대로 나열한 것은?","o":["도입 → 확산 → 활용 → 최적화","활용 → 도입 → 확산 → 최적화","도입 → 활용 → 확산 → 최적화","도입 → 활용 → 최적화 → 확산"],"a":3,"e":"분석을 시작하는 도입, 결과를 업무에 적용하는 활용, 전사로 관리·공유하는 확산, 혁신과 성과 향상에 기여하는 최적화 순서입니다. 성숙도는 비즈니스, 조직·역량, IT 부문으로 나눠 진단합니다.","x":["활용과 확산의 순서가 바뀌었습니다. 먼저 분석 결과를 업무에 활용한 뒤 전사로 확산합니다.","분석을 시작하는 도입 단계가 가장 먼저입니다.","도입(분석 시작) → 활용(업무에 적용) → 확산(전사 관리·공유) → 최적화(혁신·성과 향상) 순서입니다.","최적화가 마지막 단계입니다. 전사로 확산한 다음 최적화로 나아갑니다."]},{"id":"2-4-08","s":2,"c":4,"t":"빅데이터 거버넌스","m":3,"n":19,"q":"빅데이터 거버넌스에 대한 설명으로 옳지 않은 것은?","o":["산업 분야별, 데이터 유형별, 정보 거버넌스 요소별로 구분해 작성한다.","데이터가 워낙 많아 품질 관리는 필요 없다.","ROI 관점에서 데이터의 보관 주기와 생명 주기를 관리해 비용을 효율화한다.","개인정보 보호와 보안 관리가 포함된다."],"a":2,"e":"빅데이터도 분석 결과를 믿고 쓰려면 데이터 품질 관리가 필요합니다. 빅데이터 거버넌스는 데이터 거버넌스에 빅데이터의 효율적 관리, 데이터 최적화, 정보 보호, 생명 주기 관리 등을 더한 것입니다.","x":["맞는 설명입니다. 빅데이터 거버넌스는 산업 분야별, 데이터 유형별, 정보 거버넌스 요소별로 구분해 작성합니다.","틀린 설명입니다. 데이터가 많아도 품질이 나쁘면 분석 결과를 믿을 수 없으므로 빅데이터에도 품질 관리가 꼭 필요합니다.","맞는 설명입니다. 데이터를 무조건 쌓아 두지 않고 ROI 관점에서 보관 주기와 생명 주기를 관리해 비용을 줄입니다.","맞는 설명입니다. 개인정보 보호와 보안 관리도 빅데이터 거버넌스에 포함됩니다."]},{"id":"2-4-04","s":2,"c":4,"t":"분석 수준 진단 결과","m":2,"n":20,"q":"분석 준비도는 낮지만, 조직·인력·분석 업무·분석 기법 등을 제한적으로나마 사용하고 있어 분석 성숙도는 높은 기업 유형은?","o":["준비형","정착형","도입형","확산형"],"a":2,"e":"준비도와 성숙도가 모두 낮으면 준비형, 준비도는 낮고 성숙도가 높으면 정착형, 준비도는 높고 성숙도가 낮으면 도입형, 둘 다 높으면 확산형입니다.","x":["준비형은 준비도와 성숙도가 모두 낮아 사전 준비가 필요한 기업입니다.","준비도는 낮지만 제한적으로나마 분석을 활용하고 있어 성숙도가 높은 기업은 정착형입니다. 우선 분석을 정착시키는 것이 목표입니다.","도입형은 반대로 준비도는 높지만 성숙도가 낮은 기업입니다. 분석 업무와 기법은 부족해도 조직·인력이 준비돼 있어 바로 도입할 수 있습니다.","확산형은 준비도와 성숙도가 모두 높아 분석을 계속 확산해 나가는 기업입니다."]},{"id":"2-4-05","s":2,"c":4,"t":"분석 조직 구조","m":3,"n":20,"q":"별도의 분석 전담 조직 없이 각 현업 부서에서 직접 분석을 수행해, 전사적 관점의 핵심 분석이 어려운 분석 조직 구조는?","o":["집중 구조","분산 구조","기능 구조","매트릭스 구조"],"a":3,"e":"기능 구조는 해당 부서 업무에 맞는 분석은 잘하지만 전사 관점의 핵심 분석이 어렵습니다. 집중 구조는 전담 조직이 전사 분석을 맡아 현업과 업무가 이원화될 수 있고, 분산 구조는 분석 인력을 현업 부서에 배치해 결과를 빠르게 실무에 적용합니다.","x":["집중 구조는 별도의 분석 전담 조직이 전사 분석을 맡아 우선순위를 정해 추진합니다. 현업 부서와 업무가 겹쳐 이원화될 수 있습니다.","분산 구조는 분석 전문 인력을 현업 부서에 배치해 분석 결과를 빠르게 실무에 적용합니다. 분석 인력이 따로 있다는 점에서 기능 구조와 다릅니다.","별도의 분석 조직 없이 각 현업 부서가 직접 분석하는 것이 기능 구조입니다. 부서 업무에 맞는 분석은 잘하지만 전사 관점의 핵심 분석은 어렵습니다.","매트릭스 구조는 기능 조직과 프로젝트 조직을 겹친 일반 경영 조직 형태로, 교재의 분석 조직 구조(집중·기능·분산)에 들지 않습니다."]},{"id":"2-4-06","s":2,"c":4,"t":"데이터 거버넌스 구성 요소","m":1,"n":20,"q":"데이터 거버넌스의 구성 요소로 옳은 것은?","o":["데이터, 기술, 인력","원칙, 조직, 프로세스","조직, 프로세스, 시스템, 데이터, 인력","전략적 중요도, 비즈니스 성과, 실행 용이성"],"a":2,"e":"데이터 거버넌스는 원칙(Principle), 조직(Organization), 프로세스(Process)로 구성됩니다. 데이터·기술·인력은 빅데이터 활용 3요소, 다섯 가지는 분석 거버넌스 체계, 전략적 중요도·비즈니스 성과·실행 용이성은 우선순위 고려 요소입니다.","x":["데이터, 기술, 인력은 빅데이터 활용 3요소입니다.","데이터 거버넌스는 원칙(Principle), 조직(Organization), 프로세스(Process)로 구성됩니다.","조직, 프로세스, 시스템, 데이터, 인력(분석 교육·마인드 육성)은 분석 거버넌스 체계의 구성 요소입니다.","전략적 중요도, 비즈니스 성과, 실행 용이성은 분석 과제의 우선순위를 정할 때의 고려 요소입니다."]},{"id":"3-1-03","s":3,"c":1,"t":"상자그림 해석","k":"E","lv":5,"pg":4,"ref":"Q1-3","m":2,"n":21,"q":"어떤 자료의 상자그림이 다음과 같다(Q1 = 20, 중앙값 = 30, Q3 = 40). 이에 대한 설명으로 옳지 않은 것은?","fig":"box","o":["자료의 가운데 50%는 20과 40 사이에 있다.","사분위수 범위(IQR)는 20이다.","75는 위쪽 경계(70)를 넘어 이상값으로 표시되었다.","위쪽 수염의 끝은 이상값까지 포함한 최댓값인 75이다."],"a":4,"e":"수염은 경계(Q3 + 1.5 × IQR = 70) 안에 있는 가장 큰 관측값까지만 그립니다. 경계를 넘는 75는 수염 밖에 점으로 따로 찍힙니다.","x":["맞는 설명입니다. 상자는 Q1(20)부터 Q3(40)까지라 가운데 50%의 자료가 이 안에 있습니다.","맞는 설명입니다. IQR = Q3 − Q1 = 40 − 20 = 20입니다.","맞는 설명입니다. 위쪽 경계는 Q3 + 1.5 × IQR = 40 + 30 = 70이므로, 이를 넘는 75는 이상값으로 따로 점이 찍힙니다.","틀린 설명입니다. 수염은 경계(70) 안에 있는 가장 큰 관측값인 62까지만 그리고, 75는 수염 밖에 점으로 따로 표시됩니다."]},{"id":"3-1-04","s":3,"c":1,"t":"사분위수 이상값","k":"E","lv":5,"pg":4,"ref":"Q1-4","m":3,"n":21,"q":"어떤 변수의 1사분위수가 20, 3사분위수가 40이다. 사분위수 범위(IQR)의 1.5배 기준으로 이상값에 해당하는 것은?","o":["0","15","65","75"],"a":4,"e":"IQR = 20이므로 경계는 −10과 70입니다. 0은 −10보다 크므로 정상 범위이고, 70을 넘는 75만 이상값입니다.","x":["아래쪽 경계는 Q1 − 1.5 × IQR = 20 − 30 = −10입니다. 0은 −10보다 크므로 정상 범위입니다.","15는 −10과 70 사이에 있어 정상 범위입니다. Q1보다 작다고 이상값이 되는 것은 아닙니다.","위쪽 경계는 Q3 + 1.5 × IQR = 40 + 30 = 70입니다. 65는 70보다 작아 정상 범위입니다.","75는 위쪽 경계 70을 넘으므로 이상값입니다."]},{"id":"3-1-05","s":3,"c":1,"t":"ESD 이상값","k":"E","lv":5,"pg":4,"ref":"Q1-5","m":1,"n":21,"q":"평균이 50, 표준편차가 5인 변수에서 ESD 기준(평균 ± 3 × 표준편차)으로 이상값에 해당하는 것은?","o":["33","36","50","64"],"a":1,"e":"정상 범위는 50 − 15 = 35부터 50 + 15 = 65까지입니다. 이 범위를 벗어나는 33만 이상값이고, 36과 64는 경계 안쪽입니다.","x":["정상 범위는 50 ± 3 × 5 = 35~65입니다. 33은 35보다 작아 이상값입니다.","36은 아래쪽 경계 35보다 커서 정상 범위입니다.","50은 평균값 그 자체라 당연히 정상 범위입니다.","64는 위쪽 경계 65보다 작아 정상 범위입니다."]},{"id":"3-1-01","s":3,"c":1,"t":"결측값 처리","k":"D","lv":4,"pg":4,"ref":"Q1-1","m":2,"n":22,"q":"결측값 처리에 대한 설명으로 가장 적절하지 않은 것은?","o":["완전 분석법은 결측값이 있는 레코드를 삭제하므로 효율성이 떨어질 수 있다.","단순확률 대치법은 비슷한 성향의 다른 관측치 값으로 채우는 Hot-deck 방식이 대표적이다.","평균 대치법을 사용하면 해당 변수의 분산이 실제보다 커지는 경향이 있다.","다중 대치법은 대치, 분석, 결합의 세 단계로 진행된다."],"a":3,"e":"빈칸을 모두 같은 평균값으로 채우면 값들이 평균 근처로 몰려 분산은 <b>작아집니다<\/b>. \"커진다\"로 단어 하나만 바꾼 전형적인 함정입니다.","x":["맞는 설명입니다. 결측이 있는 행을 통째로 지우므로 쓸 수 있는 자료가 줄어 효율성이 떨어집니다.","맞는 설명입니다. Hot-deck은 비슷한 성향을 가진 다른 응답자의 값으로 결측값을 채우는, 단순확률 대치법의 대표 방식입니다.","틀린 설명입니다. 빈칸을 모두 같은 평균값으로 채우면 값들이 평균 근처로 몰려 분산이 실제보다 작아집니다.","맞는 설명입니다. 결측값을 여러 번 대치해 데이터셋을 여러 개 만들고(대치), 각각 분석한 뒤(분석), 결과를 하나로 합칩니다(결합)."]},{"id":"3-1-02","s":3,"c":1,"t":"결측 행 삭제 계산","k":"D","lv":4,"pg":4,"ref":"Q1-2","m":3,"n":22,"q":"관측치 100개인 데이터에서 변수 A의 결측이 10개, 변수 B의 결측이 15개이고, 그중 5개 행은 A와 B가 모두 결측이며, 다른 변수에는 결측이 없다. 결측값이 있는 행을 모두 삭제(완전 분석법)하면 남는 행은?","o":["75개","80개","85개","90개"],"a":2,"e":"결측이 하나라도 있는 행은 10 + 15 − 5 = 20개(겹친 5개는 한 번만)라서 80개가 남습니다. ①의 75개는 겹친 행을 두 번 뺀 값입니다.","x":["겹친 5개 행을 두 번 뺀 값입니다. 100 − 10 − 15 = 75로 계산하면 A와 B가 모두 결측인 5개 행을 중복으로 빼게 됩니다.","결측이 하나라도 있는 행은 10 + 15 − 5 = 20개이므로 100 − 20 = 80개가 남습니다.","변수 B의 결측 15개만 뺀 값입니다. A만 결측인 행도 삭제해야 합니다.","변수 A의 결측 10개만 뺀 값입니다. B만 결측인 행도 삭제해야 합니다."]},{"id":"3-1-09","s":3,"c":1,"t":"결측값 유형","k":"D","lv":4,"pg":4,"m":1,"n":22,"q":"결측 여부가 관측된 다른 변수와는 관련이 있지만, 결측된 값 자체와는 관련이 없는 결측 유형은?","o":["완전 무작위 결측(MCAR)","무작위 결측(MAR)","비무작위 결측(MNAR)","측정 오류(measurement error)"],"a":2,"e":"MAR은 결측이 다른 관측 변수(예: 나이)와 관련될 뿐 그 값 자체와는 무관한 경우입니다. 결측이 어떤 변수와도 무관하면 MCAR, 결측된 값 자체와 관련되면(소득이 높을수록 소득을 응답하지 않음) MNAR입니다.","x":["MCAR은 결측이 어떤 변수와도 관련 없이 완전히 무작위로 생긴 경우입니다. 다른 관측 변수와도 관련이 없습니다.","결측이 다른 관측 변수(예: 나이)와는 관련 있지만 결측된 값 자체와는 관련 없는 경우가 MAR(무작위 결측)입니다.","MNAR은 결측이 결측된 값 자체와 관련된 경우입니다. 소득이 높을수록 소득을 응답하지 않는 것이 예입니다.","측정 오류는 값이 기록되긴 했지만 잘못 측정된 경우로, 결측
